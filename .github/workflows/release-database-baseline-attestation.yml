name: release-database-baseline-attestation

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Production project ref registered in the protected environment
        required: true
        type: string
      baseline_approved:
        description: Type READ_ONLY_BASELINE_APPROVED after reviewing the protected non-migration release
        required: true
        type: string
      release_track:
        description: Post-lockdown database contract for the non-database release
        required: true
        type: choice
        options: [prompt-privacy]
      lockdown_evidence_run_id:
        description: Successful production prompt-privacy lockdown run for the serving Worker
        required: true
        type: string
      privilege_evidence_run_id:
        description: Successful post-lockdown privilege smoke chained to the lockdown run
        required: true
        type: string
      verification_evidence_run_id:
        description: Successful immediate live verification chained to the privilege smoke
        required: true
        type: string
      previous_baseline_evidence_run_id:
        description: Optional unexpired successful baseline evidence used to renew lineage after an original artifact expires
        required: false
        type: string
      serving_cutover_evidence_run_id:
        description: Optional successful cutover evidence proving a newer Worker now serves the renewed baseline
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-database-baseline-attestation
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-db-baseline-attestation
    env:
      PROJECT_REF: ${{ inputs.project_ref }}
      EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      BASELINE_APPROVED: ${{ inputs.baseline_approved }}
      RELEASE_TRACK: ${{ inputs.release_track }}
      LOCKDOWN_EVIDENCE_RUN_ID: ${{ inputs.lockdown_evidence_run_id }}
      PRIVILEGE_EVIDENCE_RUN_ID: ${{ inputs.privilege_evidence_run_id }}
      VERIFICATION_EVIDENCE_RUN_ID: ${{ inputs.verification_evidence_run_id }}
      PREVIOUS_BASELINE_EVIDENCE_RUN_ID: ${{ inputs.previous_baseline_evidence_run_id }}
      SERVING_CUTOVER_EVIDENCE_RUN_ID: ${{ inputs.serving_cutover_evidence_run_id }}
      BASELINE_SOURCE_SHA: 084b38123a37e70d3fa51093fe44b39098a36bc2
      POST_LOCKDOWN_EVIDENCE_SHA: b2b997f6c0eec183509cf2bc4241fc29eb2f6b7e
      AUTHORIZED_BASELINE_RELEASE_SHA: ${{ vars.AUTHORIZED_BASELINE_RELEASE_SHA }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Validate protected read-only baseline scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{8,32}$ && "$PROJECT_REF" == "$EXPECTED_PROJECT_REF" && "$PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::production project guard mismatch'; exit 1; }
          [[ "$BASELINE_APPROVED" == 'READ_ONLY_BASELINE_APPROVED' ]] || { echo '::error::read-only baseline approval is required'; exit 1; }
          [[ "$RELEASE_TRACK" == 'prompt-privacy' ]] || { echo '::error::post-lockdown baseline requires the prompt-privacy track'; exit 1; }
          [[ "$LOCKDOWN_EVIDENCE_RUN_ID" =~ ^[0-9]+$ && "$PRIVILEGE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ && "$VERIFICATION_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::post-lockdown evidence run IDs must be canonical'; exit 1; }
          [[ -z "$PREVIOUS_BASELINE_EVIDENCE_RUN_ID" || "$PREVIOUS_BASELINE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::previous baseline evidence run ID must be canonical'; exit 1; }
          [[ -z "$SERVING_CUTOVER_EVIDENCE_RUN_ID" || "$SERVING_CUTOVER_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::serving cutover evidence run ID must be canonical'; exit 1; }
          [[ -z "$SERVING_CUTOVER_EVIDENCE_RUN_ID" || -n "$PREVIOUS_BASELINE_EVIDENCE_RUN_ID" ]] || { echo '::error::serving cutover evidence requires previous baseline evidence'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$AUTHORIZED_BASELINE_RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$AUTHORIZED_BASELINE_RELEASE_SHA" ]] || { echo '::error::authorized baseline release SHA guard mismatch'; exit 1; }
          git merge-base --is-ancestor "$BASELINE_SOURCE_SHA" "$GITHUB_SHA" || { echo '::error::baseline source is not an ancestor of this commit'; exit 1; }
          git merge-base --is-ancestor "$POST_LOCKDOWN_EVIDENCE_SHA" "$GITHUB_SHA" || { echo '::error::post-lockdown evidence source is not an ancestor of this commit'; exit 1; }
          proof_files=$'.github/workflows/release-post-lockdown-observation.yml\n.github/workflows/release-post-lockdown-privilege-smoke.yml\nscripts/remote-privilege-smoke.mjs\nscripts/validate-github-workflows.mjs\nserver/deployment-workflow-sync.test.js\nserver/remote-privilege-smoke-contract.test.js'
          actual_proof_files=$(git diff --name-only "$BASELINE_SOURCE_SHA" "$POST_LOCKDOWN_EVIDENCE_SHA" | sort -u)
          [[ "$actual_proof_files" == "$(printf '%s\n' "$proof_files" | sort -u)" ]] || { echo '::error::post-lockdown proof source change scope is not the exact verified set'; exit 1; }
          unexpected_proof_status=$(git diff --name-status "$BASELINE_SOURCE_SHA" "$POST_LOCKDOWN_EVIDENCE_SHA" | awk '$1 != "M" { print }')
          [[ -z "$unexpected_proof_status" ]] || { echo '::error::post-lockdown proof files must be in-place modifications'; exit 1; }
          git diff --name-only "$POST_LOCKDOWN_EVIDENCE_SHA" "$GITHUB_SHA" | sort -u > "$RUNNER_TEMP/changed-baseline-files.txt"
          [[ -s "$RUNNER_TEMP/changed-baseline-files.txt" ]] || { echo '::error::baseline attestation requires an approved non-migration release'; exit 1; }
          git diff --quiet "$BASELINE_SOURCE_SHA" "$GITHUB_SHA" -- supabase/migrations/ || { echo '::error::baseline release cannot add, remove, rename, or modify database migrations'; exit 1; }

      - name: Require successful CI for this default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::Baseline attestation must run from the default branch'; exit 1; }
          node --input-type=module <<'NODE'
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${process.env.GITHUB_SHA}&status=completed&per_page=100`, { headers });
          if (!response.ok) throw new Error(`GitHub API request failed with status ${response.status}`);
          const payload = await response.json();
          const run = payload.workflow_runs?.find((candidate) => candidate.event === 'push' && candidate.head_sha === process.env.GITHUB_SHA && candidate.head_branch === process.env.DEFAULT_BRANCH && candidate.conclusion === 'success');
          if (!run) throw new Error('No successful CI run exists for this default-branch commit.');
          const jobsResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${run.id}/jobs?filter=latest&per_page=100`, { headers });
          if (!jobsResponse.ok) throw new Error(`GitHub jobs request failed with status ${jobsResponse.status}`);
          const jobs = await jobsResponse.json();
          const conclusions = new Map((jobs.jobs || []).map((job) => [job.name, job.conclusion]));
          for (const required of ['quality', 'Database contracts (local Docker only)']) if (conclusions.get(required) !== 'success') throw new Error(`Required CI job did not pass: ${required}`);
          NODE

      - name: Verify previous read-only baseline renewal source
        if: ${{ inputs.previous_baseline_evidence_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export RENEWAL_DIR
          RENEWAL_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-baseline-renewal-XXXXXX")
          trap 'rm -rf -- "$RENEWAL_DIR"' EXIT
          export RENEWAL_COMMIT_FILE="$RENEWAL_DIR/commit.txt"
          mkdir -p "$RENEWAL_DIR/artifact"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_BASELINE_EVIDENCE_RUN_ID" > "$RENEWAL_DIR/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-database-baseline-attestation.yml" > "$RENEWAL_DIR/workflow.json"
          gh run download "$PREVIOUS_BASELINE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-baseline-evidence-production-$PREVIOUS_BASELINE_EVIDENCE_RUN_ID" --dir "$RENEWAL_DIR/artifact"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (...parts) => JSON.parse(fs.readFileSync(path.join(process.env.RENEWAL_DIR, ...parts), 'utf8'));
          const run = read('run.json');
          const workflow = read('workflow.json');
          const evidence = read('artifact', 'database-baseline-evidence.json');
          const expectedWorkflowPath = '.github/workflows/release-database-baseline-attestation.yml';
          const projectRefHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const lockdownMigrationAlias = { sourceVersion: '20260727000000', remoteVersion: '20260727025134', remoteName: 'backend_stabilization_lockdown' };
          const lockdownMigrationAliasHash = crypto.createHash('sha256').update(JSON.stringify(lockdownMigrationAlias)).digest('hex');
          const requiredInvariants = [
            'expandApplied', 'lockdownAliasApplied', 'directTableWritesBlocked',
            'legacyQuotaWritesBlocked', 'storageWritePoliciesAbsent',
            'serviceV2MutationRpcsCallable', 'clientV2MutationRpcsBlocked',
            'promptPrivacyMigrationsApplied', 'privatePromptSchemaBlocked', 'privatePromptTablesBlocked',
            'clientPromptColumnsBlocked', 'requiredSafeViewsReadable',
            'ownerViewsAnonymousBlocked', 'safeViewsExcludePromptColumns',
            'safeViewsUseSecurityBarrier', 'safeViewDefinitionsMatch',
            'servicePromptColumnsReadable',
          ];
          const baselineV2Keys = [
            'allPassed', 'attestedAt', 'baselineSourceSha', 'commit', 'invariants',
            'lockdownAppliedAt', 'lockdownCommit', 'lockdownEvidenceRunId',
            'lockdownMigrationAlias', 'lockdownMigrationAliasHash', 'lockdownStateAttestedAt',
            'migrationListHash', 'migrationRowsFingerprint', 'missingMigrationCount', 'operation',
            'postLockdownSourceSha', 'previousStableWorkerVersionId', 'privilegeCommit',
            'privilegeEvidenceRunId', 'projectRefHash', 'queryMode', 'releaseTrack',
            'remoteStateFingerprint', 'schemaVersion', 'target', 'verificationCommit',
            'verificationEvidenceRunId', 'workerVersionId',
          ];
          const baselineV3Keys = [
            ...baselineV2Keys,
            'previousBaselineEvidenceRunId', 'servingCutoverEvidenceRunId',
          ];
          const canonicalVersion = (value) => typeof value === 'string' && /^[A-Za-z0-9_-]+$/.test(value);
          const canonicalDate = (value) => Number.isFinite(Date.parse(value || ''));
          const canonicalOptionalRunId = (value) => value === null || /^[0-9]+$/.test(String(value));
          const runBound = run.id === Number(process.env.PREVIOUS_BASELINE_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === evidence.commit
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedWorkflowPath
            && workflow.path === expectedWorkflowPath
            && run.workflow_id === workflow.id;
          const evidenceShape = evidence.schemaVersion === 2
            ? JSON.stringify(Object.keys(evidence).sort()) === JSON.stringify(baselineV2Keys.sort())
            : evidence.schemaVersion === 3
              && JSON.stringify(Object.keys(evidence).sort()) === JSON.stringify(baselineV3Keys.sort())
              && canonicalOptionalRunId(evidence.previousBaselineEvidenceRunId)
              && canonicalOptionalRunId(evidence.servingCutoverEvidenceRunId)
              && (evidence.servingCutoverEvidenceRunId === null || evidence.previousBaselineEvidenceRunId !== null);
          const evidenceBound = evidenceShape
            && evidence.target === 'production'
            && evidence.operation === 'read-only-post-lockdown-baseline-attestation'
            && evidence.queryMode === 'supabase_read_only_user'
            && evidence.releaseTrack === process.env.RELEASE_TRACK
            && /^[0-9a-f]{40}$/.test(evidence.commit || '')
            && evidence.baselineSourceSha === process.env.BASELINE_SOURCE_SHA
            && evidence.postLockdownSourceSha === process.env.POST_LOCKDOWN_EVIDENCE_SHA
            && evidence.projectRefHash === projectRefHash
            && evidence.lockdownEvidenceRunId === process.env.LOCKDOWN_EVIDENCE_RUN_ID
            && evidence.privilegeEvidenceRunId === process.env.PRIVILEGE_EVIDENCE_RUN_ID
            && evidence.verificationEvidenceRunId === process.env.VERIFICATION_EVIDENCE_RUN_ID
            && evidence.lockdownCommit === process.env.BASELINE_SOURCE_SHA
            && evidence.privilegeCommit === process.env.POST_LOCKDOWN_EVIDENCE_SHA
            && evidence.verificationCommit === process.env.POST_LOCKDOWN_EVIDENCE_SHA
            && canonicalVersion(evidence.workerVersionId)
            && canonicalVersion(evidence.previousStableWorkerVersionId)
            && /^[a-f0-9]{64}$/.test(evidence.migrationListHash || '')
            && /^[a-f0-9]{32}$/.test(evidence.migrationRowsFingerprint || '')
            && /^[a-f0-9]{32}$/.test(evidence.remoteStateFingerprint || '')
            && evidence.missingMigrationCount === 0
            && JSON.stringify(evidence.lockdownMigrationAlias) === JSON.stringify(lockdownMigrationAlias)
            && evidence.lockdownMigrationAliasHash === lockdownMigrationAliasHash
            && evidence.invariants
            && JSON.stringify(Object.keys(evidence.invariants).sort()) === JSON.stringify(requiredInvariants.sort())
            && requiredInvariants.every((name) => evidence.invariants[name] === true)
            && evidence.allPassed === true
            && canonicalDate(evidence.lockdownAppliedAt)
            && canonicalDate(evidence.lockdownStateAttestedAt)
            && canonicalDate(evidence.attestedAt)
            && canonicalDate(run.created_at)
            && canonicalDate(run.updated_at)
            && Date.parse(evidence.lockdownAppliedAt) <= Date.parse(evidence.lockdownStateAttestedAt)
            && Date.parse(evidence.lockdownStateAttestedAt) <= Date.parse(evidence.attestedAt)
            && Date.parse(run.created_at) <= Date.parse(evidence.attestedAt)
            && Date.parse(evidence.attestedAt) <= Date.parse(run.updated_at);
          if (!runBound || !evidenceBound) throw new Error('Previous baseline evidence is not bound to an approved successful lineage attestation.');
          fs.writeFileSync(process.env.RENEWAL_COMMIT_FILE, `${evidence.commit}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `PREVIOUS_BASELINE_COMMIT=${evidence.commit}`,
            `PREVIOUS_BASELINE_ATTESTED_AT=${evidence.attestedAt}`,
            `LOCKDOWN_REMOTE_STATE_FINGERPRINT=${evidence.remoteStateFingerprint}`,
            `LOCKDOWN_MIGRATION_ROWS_FINGERPRINT=${evidence.migrationRowsFingerprint}`,
            `LINEAGE_WORKER_VERSION_ID=${evidence.workerVersionId}`,
            `LINEAGE_PREVIOUS_STABLE_VERSION_ID=${evidence.previousStableWorkerVersionId}`,
            `LOCKDOWN_APPLIED_AT=${evidence.lockdownAppliedAt}`,
            `LINEAGE_STATE_ATTESTED_AT=${evidence.lockdownStateAttestedAt}`,
            '',
          ].join('\n'));
          NODE
          PREVIOUS_BASELINE_COMMIT=$(<"$RENEWAL_COMMIT_FILE")
          [[ "$PREVIOUS_BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::previous baseline commit is invalid'; exit 1; }
          [[ "$PREVIOUS_BASELINE_COMMIT" != "$GITHUB_SHA" ]] || { echo '::error::previous baseline must precede the current release'; exit 1; }
          git merge-base --is-ancestor "$PREVIOUS_BASELINE_COMMIT" "$GITHUB_SHA" || { echo '::error::previous baseline commit is not an ancestor of this release'; exit 1; }
          git diff --quiet "$PREVIOUS_BASELINE_COMMIT" "$GITHUB_SHA" -- supabase/migrations/ || { echo '::error::baseline renewal cannot cross a database migration change'; exit 1; }

      - name: Verify serving cutover since renewed baseline
        if: ${{ inputs.previous_baseline_evidence_run_id != '' && inputs.serving_cutover_evidence_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export SERVING_CUTOVER_DIR
          SERVING_CUTOVER_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-serving-cutover-XXXXXX")
          trap 'rm -rf -- "$SERVING_CUTOVER_DIR"' EXIT
          export SERVING_CUTOVER_COMMIT_FILE="$SERVING_CUTOVER_DIR/commit.txt"
          mkdir -p "$SERVING_CUTOVER_DIR/artifact"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SERVING_CUTOVER_EVIDENCE_RUN_ID" > "$SERVING_CUTOVER_DIR/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-worker.yml" > "$SERVING_CUTOVER_DIR/workflow.json"
          gh run download "$SERVING_CUTOVER_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-evidence-production-$SERVING_CUTOVER_EVIDENCE_RUN_ID" --dir "$SERVING_CUTOVER_DIR/artifact"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (...parts) => JSON.parse(fs.readFileSync(path.join(process.env.SERVING_CUTOVER_DIR, ...parts), 'utf8'));
          const run = read('run.json');
          const workflow = read('workflow.json');
          const evidence = read('artifact', 'release-evidence.json');
          const expectedWorkflowPath = '.github/workflows/release-worker.yml';
          const expectedEvidenceKeys = [
            'baselineEvidenceRunId', 'baselineServingVersionId', 'baselineWindow', 'baseUrl',
            'commit', 'completedAt', 'databaseEvidenceMode', 'databaseReleaseTrack',
            'expandAppliedAt', 'expandBridgePrelaunchEvidenceRunId', 'expandEvidenceCommit',
            'expandEvidenceRunId', 'expandMigration', 'expandProjectRefHash', 'lockdownEvidenceRunId',
            'monitorChecks', 'monitorMinutes', 'observabilityMetrics', 'observabilityPassed',
            'observabilityWindow', 'operation', 'previousStableVersionId', 'projectRefHash',
            'rollbackEvidenceRunId', 'rollbackMode', 'rollbackSourceVersionId', 'schemaVersion',
            'shadowEvidenceRunId', 'shadowRunAttempt', 'smokePassed', 'target', 'v2Compatible',
            'versionCreatedAt', 'versionId', 'versionMessage', 'versionMetadataHash', 'versionTag',
            'workerName',
          ];
          const canonicalVersion = (value) => typeof value === 'string' && /^[A-Za-z0-9_-]+$/.test(value);
          const canonicalDate = (value) => Number.isFinite(Date.parse(value || ''));
          const projectRefHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const runBound = run.id === Number(process.env.SERVING_CUTOVER_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === evidence.commit
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedWorkflowPath
            && workflow.path === expectedWorkflowPath
            && run.workflow_id === workflow.id;
          const immutableVersionBound = canonicalVersion(evidence.versionId)
            && evidence.versionId !== process.env.LINEAGE_WORKER_VERSION_ID
            && /^[0-9]+$/.test(String(evidence.shadowEvidenceRunId || ''))
            && Number.isInteger(evidence.shadowRunAttempt)
            && evidence.shadowRunAttempt >= 1
            && evidence.versionTag === `github-${evidence.shadowEvidenceRunId}-${evidence.shadowRunAttempt}`
            && evidence.versionMessage === evidence.commit
            && canonicalDate(evidence.versionCreatedAt)
            && /^[a-f0-9]{64}$/.test(String(evidence.versionMetadataHash || ''));
          const evidenceBound = JSON.stringify(Object.keys(evidence).sort()) === JSON.stringify(expectedEvidenceKeys.sort())
            && evidence.schemaVersion === 4
            && evidence.target === 'production'
            && evidence.operation === 'cutover'
            && /^[0-9a-f]{40}$/.test(String(evidence.commit || ''))
            && evidence.workerName === 'v-mate'
            && evidence.baseUrl === 'https://v-mate.satinode.com'
            && evidence.projectRefHash === projectRefHash
            && evidence.databaseEvidenceMode === 'baseline'
            && evidence.databaseReleaseTrack === process.env.RELEASE_TRACK
            && evidence.baselineEvidenceRunId === process.env.PREVIOUS_BASELINE_EVIDENCE_RUN_ID
            && evidence.baselineServingVersionId === process.env.LINEAGE_WORKER_VERSION_ID
            && evidence.previousStableVersionId === process.env.LINEAGE_WORKER_VERSION_ID
            && evidence.v2Compatible === true
            && evidence.expandEvidenceRunId === ''
            && evidence.expandEvidenceCommit === null
            && evidence.expandBridgePrelaunchEvidenceRunId === null
            && evidence.expandProjectRefHash === ''
            && evidence.expandAppliedAt === ''
            && evidence.expandMigration === null
            && evidence.rollbackMode === null
            && evidence.rollbackEvidenceRunId === null
            && evidence.rollbackSourceVersionId === null
            && evidence.lockdownEvidenceRunId === null
            && evidence.smokePassed === true
            && evidence.monitorChecks === 1
            && evidence.monitorMinutes === 0
            && evidence.observabilityPassed === null
            && evidence.observabilityMetrics === null
            && evidence.observabilityWindow === null
            && evidence.baselineWindow === null
            && immutableVersionBound
            && canonicalDate(process.env.PREVIOUS_BASELINE_ATTESTED_AT)
            && canonicalDate(evidence.completedAt)
            && canonicalDate(run.created_at)
            && canonicalDate(run.updated_at)
            && Date.parse(process.env.PREVIOUS_BASELINE_ATTESTED_AT) <= Date.parse(evidence.versionCreatedAt)
            && Date.parse(evidence.versionCreatedAt) <= Date.parse(run.created_at)
            && Date.parse(run.created_at) <= Date.parse(evidence.completedAt)
            && Date.parse(evidence.completedAt) <= Date.parse(run.updated_at);
          if (!runBound || !evidenceBound) throw new Error('Serving cutover evidence is not bound to the renewed baseline and immutable Worker version.');
          fs.writeFileSync(process.env.SERVING_CUTOVER_COMMIT_FILE, `${evidence.commit}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `LINEAGE_WORKER_VERSION_ID=${evidence.versionId}`,
            `LINEAGE_PREVIOUS_STABLE_VERSION_ID=${evidence.previousStableVersionId}`,
            '',
          ].join('\n'));
          NODE
          SERVING_CUTOVER_COMMIT=$(<"$SERVING_CUTOVER_COMMIT_FILE")
          [[ "$SERVING_CUTOVER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::serving cutover commit is invalid'; exit 1; }
          git merge-base --is-ancestor "$PREVIOUS_BASELINE_COMMIT" "$SERVING_CUTOVER_COMMIT" || { echo '::error::serving cutover does not descend from the renewed baseline'; exit 1; }
          git merge-base --is-ancestor "$SERVING_CUTOVER_COMMIT" "$GITHUB_SHA" || { echo '::error::serving cutover commit is not an ancestor of this release'; exit 1; }
          git diff --quiet "$PREVIOUS_BASELINE_COMMIT" "$SERVING_CUTOVER_COMMIT" -- supabase/migrations/ || { echo '::error::serving cutover cannot cross a database migration change'; exit 1; }

      - name: Verify deployed post-lockdown lineage
        if: ${{ inputs.previous_baseline_evidence_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export LINEAGE_DIR
          LINEAGE_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-post-lockdown-lineage-XXXXXX")
          trap 'rm -rf -- "$LINEAGE_DIR"' EXIT
          for binding in \
            "lockdown:$LOCKDOWN_EVIDENCE_RUN_ID:release-database.yml:database-release-evidence-production-$LOCKDOWN_EVIDENCE_RUN_ID" \
            "privilege:$PRIVILEGE_EVIDENCE_RUN_ID:release-post-lockdown-privilege-smoke.yml:post-lockdown-privilege-evidence-production-$PRIVILEGE_EVIDENCE_RUN_ID" \
            "verification:$VERIFICATION_EVIDENCE_RUN_ID:release-post-lockdown-observation.yml:post-lockdown-verification-evidence-production-$VERIFICATION_EVIDENCE_RUN_ID"
          do
            IFS=: read -r label run_id workflow_file artifact_name <<< "$binding"
            mkdir -p "$LINEAGE_DIR/$label/artifact"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$LINEAGE_DIR/$label/run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file" > "$LINEAGE_DIR/$label/workflow.json"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$LINEAGE_DIR/$label/artifact"
          done
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const read = (...parts) => JSON.parse(fs.readFileSync(path.join(process.env.LINEAGE_DIR, ...parts), 'utf8'));
          const binding = (label, runId, expectedPath, expectedSha) => {
            const run = read(label, 'run.json');
            const workflow = read(label, 'workflow.json');
            const valid = run.id === Number(runId)
              && run.conclusion === 'success'
              && run.status === 'completed'
              && run.event === 'workflow_dispatch'
              && run.head_sha === expectedSha
              && run.head_branch === process.env.DEFAULT_BRANCH
              && run.path === expectedPath
              && workflow.path === expectedPath
              && run.workflow_id === workflow.id;
            if (!valid) throw new Error(`${label} run is not bound to the approved workflow and commit.`);
          };
          binding('lockdown', process.env.LOCKDOWN_EVIDENCE_RUN_ID, '.github/workflows/release-database.yml', process.env.BASELINE_SOURCE_SHA);
          binding('privilege', process.env.PRIVILEGE_EVIDENCE_RUN_ID, '.github/workflows/release-post-lockdown-privilege-smoke.yml', process.env.POST_LOCKDOWN_EVIDENCE_SHA);
          binding('verification', process.env.VERIFICATION_EVIDENCE_RUN_ID, '.github/workflows/release-post-lockdown-observation.yml', process.env.POST_LOCKDOWN_EVIDENCE_SHA);

          const lockdown = read('lockdown', 'artifact', 'database-release-evidence.json');
          const privilege = read('privilege', 'artifact', 'post-lockdown-privilege-smoke-evidence.json');
          const verification = read('verification', 'artifact', 'post-lockdown-verification-evidence.json');
          const projectRefHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const migration = '20260729010000_private_prompt_reads_lockdown.sql';
          const canonicalVersion = (value) => typeof value === 'string' && /^[A-Za-z0-9_-]+$/.test(value);
          const canonicalDate = (value) => Number.isFinite(Date.parse(value || ''));
          const lockdownValid = lockdown.schemaVersion === 3
            && lockdown.target === 'production'
            && lockdown.operation === 'apply-lockdown'
            && lockdown.releaseTrack === 'prompt-privacy'
            && lockdown.commit === process.env.BASELINE_SOURCE_SHA
            && lockdown.migration === migration
            && lockdown.projectRefHash === projectRefHash
            && /^[a-f0-9]{32}$/.test(lockdown.remoteStateFingerprint || '')
            && /^[a-f0-9]{32}$/.test(lockdown.migrationRowsFingerprint || '')
            && canonicalVersion(lockdown.workerVersionId)
            && canonicalVersion(lockdown.previousStableWorkerVersionId)
            && lockdown.workerEvidenceRunId === '30475207704'
            && lockdown.expandEvidenceRunId === '30461795102'
            && lockdown.prelaunchDriftVerified === true
            && lockdown.immutablePromptBackupManifestVerified === true
            && canonicalDate(lockdown.appliedAt);
          const requiredGatewayScenarios = [
            'ephemeralUserCreated', 'anonCharactersInsertDenied', 'authenticatedCharactersInsertDenied',
            'anonRoomsInsertDenied', 'authenticatedRoomsInsertDenied', 'legacyQuotaMutationDenied',
            'authenticatedStorageUploadDenied', 'authenticatedQuotaReadAllowed',
            'serviceRoleV2RpcSurfaceAllowed', 'clientV2RpcSurfaceDenied',
            'serviceRoleV2ReserveRefundAllowed', 'ephemeralUserCleanupSucceeded',
          ];
          const privilegeValid = privilege.schemaVersion === 1
            && privilege.target === 'production'
            && privilege.operation === 'post-lockdown-privilege-smoke'
            && privilege.releaseTrack === 'prompt-privacy'
            && privilege.commit === process.env.POST_LOCKDOWN_EVIDENCE_SHA
            && privilege.lockdownCommit === process.env.BASELINE_SOURCE_SHA
            && privilege.lockdownEvidenceRunId === process.env.LOCKDOWN_EVIDENCE_RUN_ID
            && privilege.lockdownMigration === migration
            && privilege.projectRefHash === projectRefHash
            && privilege.workerVersionId === lockdown.workerVersionId
            && privilege.previousStableWorkerVersionId === lockdown.previousStableWorkerVersionId
            && privilege.lockdownAppliedAt === lockdown.appliedAt
            && privilege.lockdownStateReattested === true
            && privilege.sqlRoleProbePassed === true
            && privilege.httpGatewayProbePassed === true
            && privilege.allPassed === true
            && privilege.gatewayScenarios
            && Object.keys(privilege.gatewayScenarios).sort().join(',') === requiredGatewayScenarios.sort().join(',')
            && requiredGatewayScenarios.every((name) => privilege.gatewayScenarios[name] === true)
            && canonicalDate(privilege.lockdownStateAttestedAt)
            && canonicalDate(privilege.completedAt);
          const verificationValid = verification.schemaVersion === 2
            && verification.target === 'production'
            && verification.operation === 'post-lockdown-verification'
            && verification.verificationMode === 'single-immediate-live-smoke'
            && verification.releaseTrack === 'prompt-privacy'
            && verification.commit === process.env.POST_LOCKDOWN_EVIDENCE_SHA
            && verification.lockdownCommit === process.env.BASELINE_SOURCE_SHA
            && verification.lockdownEvidenceRunId === process.env.LOCKDOWN_EVIDENCE_RUN_ID
            && verification.privilegeEvidenceRunId === process.env.PRIVILEGE_EVIDENCE_RUN_ID
            && verification.lockdownMigration === migration
            && verification.projectRefHash === projectRefHash
            && verification.workerVersionId === lockdown.workerVersionId
            && verification.baselineWorkerVersionId === lockdown.previousStableWorkerVersionId
            && verification.lockdownAppliedAt === lockdown.appliedAt
            && verification.lockdownStateAttestedAt === privilege.lockdownStateAttestedAt
            && verification.servingVersionVerified === true
            && verification.liveSmokePassed === true
            && canonicalDate(verification.completedAt);
          const chronologyValid = Date.parse(lockdown.appliedAt) <= Date.parse(privilege.lockdownStateAttestedAt)
            && Date.parse(privilege.lockdownStateAttestedAt) <= Date.parse(privilege.completedAt)
            && Date.parse(privilege.completedAt) <= Date.parse(verification.completedAt);
          if (!lockdownValid || !privilegeValid || !verificationValid || !chronologyValid) throw new Error('Post-lockdown release lineage is incomplete or inconsistent.');
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `LOCKDOWN_REMOTE_STATE_FINGERPRINT=${lockdown.remoteStateFingerprint}`,
            `LOCKDOWN_MIGRATION_ROWS_FINGERPRINT=${lockdown.migrationRowsFingerprint}`,
            `LINEAGE_WORKER_VERSION_ID=${lockdown.workerVersionId}`,
            `LINEAGE_PREVIOUS_STABLE_VERSION_ID=${lockdown.previousStableWorkerVersionId}`,
            `LOCKDOWN_APPLIED_AT=${lockdown.appliedAt}`,
            `LINEAGE_STATE_ATTESTED_AT=${privilege.lockdownStateAttestedAt}`,
            '',
          ].join('\n'));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Capture read-only database baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database release credential is not configured'; exit 1; }
          workdir=$(mktemp -d "$RUNNER_TEMP/vmate-baseline-attestation-XXXXXX")
          mkdir -p private-artifacts artifacts
          trap 'rm -rf "$workdir"' EXIT
          cat > "$workdir/migration-list.sql" <<'SQL'
          select migration_record.version, migration_record.name
          from supabase_migrations.schema_migrations migration_record
          order by migration_record.version;
          SQL
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file "$workdir/migration-list.sql" --output private-artifacts/migration-list.json
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-migration-state.sql --output private-artifacts/migration-state.json
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-release-state.sql --output private-artifacts/release-state.json
          {
            printf 'with expected(source_version, remote_version, remote_name) as (values '
            first=true
            while IFS= read -r migration; do
              version="${migration%%_*}"
              remote_version="$version"
              remote_name=''
              if [[ "$version" == '20260727000000' ]]; then
                remote_version='20260727025134'
                remote_name='backend_stabilization_lockdown'
              fi
              if [[ "$first" == true ]]; then first=false; else printf ','; fi
              if [[ -n "$remote_name" ]]; then
                printf "('%s','%s','%s')" "$version" "$remote_version" "$remote_name"
              else
                printf "('%s','%s',null)" "$version" "$remote_version"
              fi
            done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
            [[ "$first" == false ]] || { echo '::error::no source migrations found'; exit 1; }
            printf ') select coalesce(pg_catalog.jsonb_agg(expected.source_version order by expected.source_version), '\''[]'\''::jsonb) as missing_source_versions from expected left join supabase_migrations.schema_migrations applied on applied.version = expected.remote_version and (expected.remote_name is null or applied.name = expected.remote_name) where applied.version is null;\n'
          } > "$workdir/migration-coverage.sql"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file "$workdir/migration-coverage.sql" --output private-artifacts/migration-coverage.json
          cat > "$workdir/baseline-invariants.sql" <<'SQL'
          select pg_catalog.jsonb_build_object(
            'expandApplied', exists (select 1 from supabase_migrations.schema_migrations where version = '20260726190559'),
            'lockdownAliasApplied', exists (select 1 from supabase_migrations.schema_migrations where version = '20260727025134' and name = 'backend_stabilization_lockdown'),
            'directTableWritesBlocked', not exists (
              select 1 from pg_catalog.unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join pg_catalog.unnest(array['public.characters', 'public.worlds', 'public.character_assets', 'public.world_assets', 'public.rooms', 'public.room_messages', 'public.room_state_summaries']) as tables(table_name)
              cross join pg_catalog.unnest(array['INSERT', 'UPDATE', 'DELETE']) as privileges(privilege_name)
              where pg_catalog.has_table_privilege(role_name, table_name, privilege_name)
            ),
            'legacyQuotaWritesBlocked', not exists (
              select 1 from pg_catalog.unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join pg_catalog.unnest(array['public.reserve_daily_chat_message(text,integer)', 'public.complete_daily_chat_message(text,jsonb)', 'public.refund_daily_chat_message(text,integer)']) as functions(signature)
              where pg_catalog.has_function_privilege(role_name, signature, 'EXECUTE')
            ),
            'storageWritePoliciesAbsent', not exists (
              select 1 from pg_catalog.pg_policies where schemaname = 'storage' and tablename = 'objects'
              and policyname in ('Authenticated users can upload vmate assets to their own folder', 'Authenticated users can update vmate assets in their own folder', 'Authenticated users can delete vmate assets in their own folder')
            ),
            'serviceV2MutationRpcsCallable', not exists (
              select 1
              from (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where not pg_catalog.has_function_privilege('service_role', signature, 'EXECUTE')
            ),
            'clientV2MutationRpcsBlocked', not exists (
              select 1
              from pg_catalog.unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where pg_catalog.has_function_privilege(role_name, signature, 'EXECUTE')
            ),
            'promptPrivacyMigrationsApplied', not exists (
              select 1
              from (values
                ('20260729000000'),
                ('20260729010000')
              ) as expected(version)
              where not exists (
                select 1 from supabase_migrations.schema_migrations applied
                where applied.version = expected.version
              )
            ),
            'privatePromptSchemaBlocked', not exists (
              select 1
              from pg_catalog.pg_namespace namespace_record
              cross join lateral pg_catalog.aclexplode(
                coalesce(namespace_record.nspacl, pg_catalog.acldefault('n', namespace_record.nspowner))
              ) privilege_record
              left join pg_catalog.pg_roles role_record on role_record.oid = privilege_record.grantee
              where namespace_record.nspname = 'vmate_private'
                and privilege_record.privilege_type in ('USAGE', 'CREATE')
                and (privilege_record.grantee = 0 or role_record.rolname in ('anon', 'authenticated', 'service_role'))
            ) and not exists (
              select 1
              from pg_catalog.unnest(array['anon', 'authenticated', 'service_role']) as roles(role_name)
              cross join pg_catalog.unnest(array['USAGE', 'CREATE']) as privileges(privilege_name)
              where pg_catalog.has_schema_privilege(role_name, 'vmate_private', privilege_name)
            ),
            'privatePromptTablesBlocked', not exists (
              select 1
              from pg_catalog.unnest(array['anon', 'authenticated', 'service_role']) as roles(role_name)
              cross join pg_catalog.unnest(array[
                'vmate_private.prompt_lockdown_room_state_backup_20260729',
                'vmate_private.prompt_lockdown_greeting_backup_20260729',
                'vmate_private.prompt_lockdown_backup_manifest_20260729'
              ]) as tables(table_name)
              cross join pg_catalog.unnest(array['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'TRUNCATE', 'REFERENCES', 'TRIGGER']) as privileges(privilege_name)
              where pg_catalog.has_table_privilege(role_name, table_name, privilege_name)
            ) and not exists (
              select 1
              from pg_catalog.pg_class relation_record
              join pg_catalog.pg_namespace namespace_record on namespace_record.oid = relation_record.relnamespace
              cross join lateral pg_catalog.aclexplode(
                coalesce(relation_record.relacl, pg_catalog.acldefault('r', relation_record.relowner))
              ) privilege_record
              where namespace_record.nspname = 'vmate_private'
                and relation_record.relname in (
                  'prompt_lockdown_room_state_backup_20260729',
                  'prompt_lockdown_greeting_backup_20260729',
                  'prompt_lockdown_backup_manifest_20260729'
                )
                and privilege_record.grantee = 0
                and privilege_record.privilege_type in ('SELECT', 'INSERT', 'UPDATE', 'DELETE', 'TRUNCATE', 'REFERENCES', 'TRIGGER')
            ),
            'clientPromptColumnsBlocked', not exists (
              select 1
              from (values
                ('anon', 'public.characters', 'profile_json'),
                ('anon', 'public.characters', 'speech_style_json'),
                ('anon', 'public.characters', 'prompt_profile_json'),
                ('anon', 'public.worlds', 'world_rules_markdown'),
                ('anon', 'public.worlds', 'prompt_profile_json'),
                ('anon', 'public.rooms', 'resolved_prompt_snapshot_json'),
                ('authenticated', 'public.characters', 'profile_json'),
                ('authenticated', 'public.characters', 'speech_style_json'),
                ('authenticated', 'public.characters', 'prompt_profile_json'),
                ('authenticated', 'public.worlds', 'world_rules_markdown'),
                ('authenticated', 'public.worlds', 'prompt_profile_json'),
                ('authenticated', 'public.rooms', 'resolved_prompt_snapshot_json'),
                ('authenticated', 'public.rooms', 'bridge_profile_json')
              ) as protected(role_name, table_name, column_name)
              where pg_catalog.has_column_privilege(role_name, table_name, column_name, 'SELECT')
            ),
            'requiredSafeViewsReadable', not exists (
              select 1
              from (values
                ('anon', 'public.public_character_catalog'),
                ('anon', 'public.public_world_catalog'),
                ('authenticated', 'public.public_character_catalog'),
                ('authenticated', 'public.public_world_catalog'),
                ('authenticated', 'public.owned_character_details'),
                ('authenticated', 'public.owned_world_details'),
                ('authenticated', 'public.owned_room_summaries')
              ) as required(role_name, table_name)
              where not pg_catalog.has_table_privilege(role_name, table_name, 'SELECT')
            ),
            'ownerViewsAnonymousBlocked', not exists (
              select 1
              from (values
                ('public.owned_character_details'),
                ('public.owned_world_details'),
                ('public.owned_room_summaries')
              ) as owner_views(table_name)
              where pg_catalog.has_table_privilege('anon', table_name, 'SELECT')
            ),
            'safeViewsExcludePromptColumns', not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public' and (
                (table_name = 'public_character_catalog' and column_name in ('profile_json', 'speech_style_json', 'prompt_profile_json'))
                or (table_name = 'public_world_catalog' and column_name in ('world_rules_markdown', 'prompt_profile_json'))
                or (table_name = 'owned_room_summaries' and column_name in ('resolved_prompt_snapshot_json', 'bridge_profile_json'))
              )
            ),
            'safeViewsUseSecurityBarrier', not exists (
              select 1
              from (values
                ('public_character_catalog'),
                ('public_world_catalog'),
                ('owned_character_details'),
                ('owned_world_details'),
                ('owned_room_summaries')
              ) as safe_views(view_name)
              where not exists (
                select 1 from pg_catalog.pg_class relation_record
                join pg_catalog.pg_namespace namespace_record on namespace_record.oid = relation_record.relnamespace
                where namespace_record.nspname = 'public'
                  and relation_record.relname = safe_views.view_name
                  and coalesce(relation_record.reloptions, array[]::text[]) @> array['security_barrier=true']
              )
            ),
            'safeViewDefinitionsMatch', not exists (
              select 1
              -- The two star-expanded owner views retain the deployed relation's physical column order; these hashes intentionally pin production rather than a fresh-schema deparse.
              from (values
                ('owned_character_details', '71437e126b6b647e3f50ff91d98bd3f3f27a535e4be3df00f1a39d22b49f5533'),
                ('owned_room_summaries', '47b2bcab5843cc366d8888074e1950ab1e71bf79708124b265e8f313ec6eaafa'),
                ('owned_world_details', '2006d2f05a8b3ad0ab3039ef82e29802a5b720e3b7dcca48ef4d7636b6bfcf41'),
                ('public_character_catalog', '169aa590d66bddec5a10e6428a548ada4cbba51f7c04a147652a8582d9609c74'),
                ('public_world_catalog', 'd6600ea38a78da1ee3a4c4779dd459250f887908eb40b13bbd3f64adb1c9437c')
              ) as expected(view_name, definition_hash)
              left join pg_catalog.pg_namespace namespace_record
                on namespace_record.nspname = 'public'
              left join pg_catalog.pg_class relation_record
                on relation_record.relnamespace = namespace_record.oid
                and relation_record.relname = expected.view_name
                and relation_record.relkind = 'v'
              where relation_record.oid is null
                or encode(extensions.digest(pg_catalog.pg_get_viewdef(relation_record.oid, true), 'sha256'), 'hex') is distinct from expected.definition_hash
            ),
            'servicePromptColumnsReadable', not exists (
              select 1
              from (values
                ('public.characters', 'profile_json'),
                ('public.characters', 'speech_style_json'),
                ('public.characters', 'prompt_profile_json'),
                ('public.worlds', 'world_rules_markdown'),
                ('public.worlds', 'prompt_profile_json'),
                ('public.rooms', 'resolved_prompt_snapshot_json'),
                ('public.rooms', 'bridge_profile_json')
              ) as protected(table_name, column_name)
              where not pg_catalog.has_column_privilege('service_role', table_name, column_name, 'SELECT')
            )
          ) as invariants;
          SQL
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file "$workdir/baseline-invariants.sql" --output private-artifacts/invariants.json

      - name: Record sanitized read-only baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf private-artifacts' EXIT
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const firstRow = (value) => Array.isArray(value)
            ? value[0]
            : Array.isArray(value?.data)
              ? value.data[0]
              : Array.isArray(value?.result)
                ? value.result[0]
                : value && typeof value === 'object'
                  ? value
                  : undefined;
          const migration = firstRow(readJson('private-artifacts/migration-state.json'));
          const release = firstRow(readJson('private-artifacts/release-state.json'));
          const migrationCoverage = firstRow(readJson('private-artifacts/migration-coverage.json'));
          const invariants = firstRow(readJson('private-artifacts/invariants.json'))?.invariants;
          if (!migration?.migration_rows_fingerprint || !release?.release_state_fingerprint || !migrationCoverage || !invariants || typeof invariants !== 'object') throw new Error('Read-only baseline query result is invalid.');
          if (!Array.isArray(migrationCoverage.missing_source_versions) || migrationCoverage.missing_source_versions.length !== 0) throw new Error('A source migration is not applied remotely.');
          const required = [
            'expandApplied', 'lockdownAliasApplied', 'directTableWritesBlocked',
            'legacyQuotaWritesBlocked', 'storageWritePoliciesAbsent',
            'serviceV2MutationRpcsCallable', 'clientV2MutationRpcsBlocked',
            'promptPrivacyMigrationsApplied', 'privatePromptSchemaBlocked', 'privatePromptTablesBlocked',
            'clientPromptColumnsBlocked', 'requiredSafeViewsReadable',
            'ownerViewsAnonymousBlocked', 'safeViewsExcludePromptColumns',
            'safeViewsUseSecurityBarrier', 'safeViewDefinitionsMatch',
            'servicePromptColumnsReadable',
          ];
          if (!required.every((name) => invariants[name] === true)) throw new Error('Read-only baseline invariants did not pass.');
          if (migration.migration_rows_fingerprint !== process.env.LOCKDOWN_MIGRATION_ROWS_FINGERPRINT
            || release.release_state_fingerprint !== process.env.LOCKDOWN_REMOTE_STATE_FINGERPRINT) {
            throw new Error('Current database fingerprints do not match the applied lockdown evidence.');
          }
          const migrationList = fs.readFileSync('private-artifacts/migration-list.json');
          const lockdownMigrationAlias = { sourceVersion: '20260727000000', remoteVersion: '20260727025134', remoteName: 'backend_stabilization_lockdown' };
          const evidence = {
            schemaVersion: 3,
            target: 'production',
            operation: 'read-only-post-lockdown-baseline-attestation',
            queryMode: 'supabase_read_only_user',
            releaseTrack: process.env.RELEASE_TRACK,
            commit: process.env.GITHUB_SHA,
            baselineSourceSha: process.env.BASELINE_SOURCE_SHA,
            postLockdownSourceSha: process.env.POST_LOCKDOWN_EVIDENCE_SHA,
            projectRefHash: crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex'),
            lockdownEvidenceRunId: process.env.LOCKDOWN_EVIDENCE_RUN_ID,
            privilegeEvidenceRunId: process.env.PRIVILEGE_EVIDENCE_RUN_ID,
            verificationEvidenceRunId: process.env.VERIFICATION_EVIDENCE_RUN_ID,
            previousBaselineEvidenceRunId: process.env.PREVIOUS_BASELINE_EVIDENCE_RUN_ID || null,
            servingCutoverEvidenceRunId: process.env.SERVING_CUTOVER_EVIDENCE_RUN_ID || null,
            lockdownCommit: process.env.BASELINE_SOURCE_SHA,
            privilegeCommit: process.env.POST_LOCKDOWN_EVIDENCE_SHA,
            verificationCommit: process.env.POST_LOCKDOWN_EVIDENCE_SHA,
            workerVersionId: process.env.LINEAGE_WORKER_VERSION_ID,
            previousStableWorkerVersionId: process.env.LINEAGE_PREVIOUS_STABLE_VERSION_ID,
            lockdownAppliedAt: process.env.LOCKDOWN_APPLIED_AT,
            lockdownStateAttestedAt: process.env.LINEAGE_STATE_ATTESTED_AT,
            migrationListHash: crypto.createHash('sha256').update(migrationList).digest('hex'),
            migrationRowsFingerprint: migration.migration_rows_fingerprint,
            remoteStateFingerprint: release.release_state_fingerprint,
            missingMigrationCount: 0,
            lockdownMigrationAlias,
            lockdownMigrationAliasHash: crypto.createHash('sha256').update(JSON.stringify(lockdownMigrationAlias)).digest('hex'),
            invariants: Object.fromEntries(required.map((name) => [name, true])),
            allPassed: true,
            attestedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/database-baseline-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: database-baseline-evidence-production-${{ github.run_id }}
          path: artifacts/database-baseline-evidence.json
          if-no-files-found: error
