name: release-prelaunch-attestation

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Production project ref registered in the protected environment
        required: true
        type: string
      prelaunch_direct_approved:
        description: Type PRELAUNCH_DIRECT_APPROVED to attest that the no-staging direct prompt-privacy path is approved
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-prelaunch-attestation
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-db-preflight
    env:
      PROJECT_REF: ${{ inputs.project_ref }}
      EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRELAUNCH_DIRECT_APPROVED: ${{ inputs.prelaunch_direct_approved }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Validate protected production prelaunch scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{8,32}$
            && "$PROJECT_REF" == "$EXPECTED_PROJECT_REF"
            && "$PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::production project guard mismatch'; exit 1; }
          [[ "$PRELAUNCH_DIRECT_APPROVED" == 'PRELAUNCH_DIRECT_APPROVED' ]] || { echo '::error::explicit prelaunch direct approval is required'; exit 1; }

      - name: Require successful CI for this default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::GitHub evidence credential is unavailable'; exit 1; }
          [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::Prelaunch attestation must run from the default branch'; exit 1; }
          node --input-type=module <<'NODE'
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const api = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API request failed with status ${response.status}`);
            return response.json();
          };
          const runs = await api(`/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${process.env.GITHUB_SHA}&status=completed&per_page=100`);
          const run = runs.workflow_runs?.find((candidate) => candidate.event === 'push'
            && candidate.head_sha === process.env.GITHUB_SHA
            && candidate.head_branch === process.env.DEFAULT_BRANCH
            && candidate.conclusion === 'success');
          if (!run) throw new Error('No successful CI run exists for this default-branch commit.');
          const jobs = await api(`/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${run.id}/jobs?filter=latest&per_page=100`);
          const conclusions = new Map((jobs.jobs || []).map((job) => [job.name, job.conclusion]));
          for (const required of ['quality', 'Database contracts (local Docker only)']) {
            if (conclusions.get(required) !== 'success') throw new Error(`Required CI job did not pass: ${required}`);
          }
          NODE

      - name: Capture sanitized read-only prelaunch evidence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database read credential is not configured'; exit 1; }
          workdir=$(mktemp -d "$RUNNER_TEMP/vmate-prelaunch-attestation-XXXXXX")
          mkdir -p artifacts
          trap 'rm -rf -- "$workdir"' EXIT
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-release-state.sql --output "$workdir/release-state.json"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-migration-state.sql --output "$workdir/migration-state.json"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-prelaunch-row-counts.sql --output "$workdir/row-counts.json"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-prelaunch-protected-state.sql --output "$workdir/protected-state.json"
          node - "$workdir" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const workdir = process.argv[2];
          const readJson = (file) => JSON.parse(fs.readFileSync(path.join(workdir, file), 'utf8'));
          const firstRow = (value) => Array.isArray(value)
            ? value[0]
            : Array.isArray(value?.data)
              ? value.data[0]
              : Array.isArray(value?.result)
                ? value.result[0]
                : value && typeof value === 'object'
                  ? value
                  : undefined;
          const release = firstRow(readJson('release-state.json'));
          const migration = firstRow(readJson('migration-state.json'));
          const counts = firstRow(readJson('row-counts.json'))?.row_counts;
          const protectedState = firstRow(readJson('protected-state.json'));
          const expectedTables = [
            'account_storage_cleanup_fences', 'app_settings', 'auth_users', 'bookmarks', 'character_assets',
            'characters', 'chat_messages', 'chat_usage_daily', 'chat_usage_events',
            'content_moderation', 'content_moderation_actions', 'content_reports', 'owner_users',
            'profiles', 'recent_views', 'room_messages', 'room_state_summaries', 'rooms',
            'storage_deletion_outbox', 'storage_objects', 'world_assets', 'worlds',
          ];
          const canonicalFingerprint = (value) => /^[a-f0-9]{32}$/.test(String(value || ''));
          if (!canonicalFingerprint(release?.release_state_fingerprint)
            || !canonicalFingerprint(migration?.migration_rows_fingerprint)
            || !canonicalFingerprint(protectedState?.protected_state_fingerprint)
            || !counts || typeof counts !== 'object' || Array.isArray(counts)
            || JSON.stringify(Object.keys(counts).sort()) !== JSON.stringify([...expectedTables].sort())
            || !expectedTables.every((table) => Number.isSafeInteger(Number(counts[table])) && Number(counts[table]) >= 0)) {
            throw new Error('Read-only prelaunch fingerprint result is invalid.');
          }
          const canonicalCounts = Object.fromEntries(expectedTables.sort().map((table) => [table, String(counts[table])]));
          const catalogSource = JSON.stringify([
            release.release_state_fingerprint,
            migration.migration_rows_fingerprint,
          ]);
          const evidenceKey = process.env.SUPABASE_ACCESS_TOKEN;
          if (!evidenceKey) throw new Error('Prelaunch evidence key is unavailable.');
          const hmac = (value) => crypto.createHmac('sha256', evidenceKey).update(value).digest('hex');
          const evidence = {
            schemaVersion: 2,
            target: 'production',
            operation: 'prelaunch-direct-attestation',
            queryMode: 'supabase_read_only_user',
            releaseTrack: 'prompt-privacy',
            commit: process.env.GITHUB_SHA,
            projectRefHash: crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex'),
            catalogStateHash: hmac(catalogSource),
            rowCountHash: hmac(JSON.stringify(canonicalCounts)),
            protectedStateHash: hmac(protectedState.protected_state_fingerprint),
            catalogStateCaptured: true,
            rowCountSnapshotCaptured: true,
            protectedStateCaptured: true,
            prelaunchDirectApproved: process.env.PRELAUNCH_DIRECT_APPROVED === 'PRELAUNCH_DIRECT_APPROVED',
            productionProjectGuardPassed: true,
            defaultBranchCiPassed: true,
            allPassed: true,
            attestedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/prelaunch-attestation-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: prelaunch-attestation-evidence-production-${{ github.run_id }}
          path: artifacts/prelaunch-attestation-evidence.json
          if-no-files-found: error
          retention-days: 1
