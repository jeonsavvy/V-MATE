name: release-post-lockdown-verification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database and Worker target being verified after lockdown
        required: true
        type: choice
        options: [staging, production]
      base_url:
        description: HTTPS origin registered in the selected environment
        required: true
        type: string
      worker_name:
        description: Worker name registered in the selected environment
        required: true
        type: string
      lockdown_evidence_run_id:
        description: apply-lockdown database release evidence run
        required: true
        type: string
      privilege_evidence_run_id:
        description: post-lockdown privilege smoke evidence run
        required: true
        type: string
      wrangler_env:
        description: Staging environment name; leave empty for production
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: post-lockdown-verification-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target == 'production' && 'production-post-lockdown-observation' || 'staging-post-lockdown-observation' }}
      url: ${{ inputs.base_url }}
    env:
      BASE_URL: ${{ inputs.base_url }}
      WORKER_NAME: ${{ inputs.worker_name }}
      LOCKDOWN_EVIDENCE_RUN_ID: ${{ inputs.lockdown_evidence_run_id }}
      PRIVILEGE_EVIDENCE_RUN_ID: ${{ inputs.privilege_evidence_run_id }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
      EXPECTED_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      EXPECTED_WORKER_NAME: ${{ vars.WORKER_NAME }}
      EXPECTED_WRANGLER_ENV: ${{ vars.WRANGLER_ENV }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_WORKER_BASE_URL }}
      PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate approved target and evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          canonical_origin() {
            node -e 'const value = new URL(process.argv[1]); if (value.protocol !== "https:" || value.username || value.password || value.search || value.hash || value.pathname !== "/") process.exit(1); process.stdout.write(value.origin)' "$1"
          }
          origin=$(canonical_origin "$BASE_URL") || { echo '::error::base_url must be a canonical HTTPS origin'; exit 1; }
          expected=$(canonical_origin "$EXPECTED_BASE_URL") || { echo '::error::approved origin is unavailable'; exit 1; }
          production=$(canonical_origin "$PRODUCTION_BASE_URL") || { echo '::error::production origin guard is unavailable'; exit 1; }
          [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::post-lockdown verification must run from the default branch'; exit 1; }
          [[ "$origin" == "$expected" && "$WORKER_NAME" == "$EXPECTED_WORKER_NAME" ]] || { echo '::error::environment target guard mismatch'; exit 1; }
          if [[ '${{ inputs.target }}' == 'staging' ]]; then [[ "$origin" != "$production" && "$WORKER_NAME" != "$PRODUCTION_WORKER_NAME" && "$WRANGLER_ENV" == "$EXPECTED_WRANGLER_ENV" ]] || { echo '::error::staging target guard mismatch'; exit 1; }; else [[ "$origin" == "$production" && "$WORKER_NAME" == "$PRODUCTION_WORKER_NAME" && -z "$WRANGLER_ENV" ]] || { echo '::error::production target guard mismatch'; exit 1; }; fi
          [[ "$LOCKDOWN_EVIDENCE_RUN_ID" =~ ^[0-9]+$ && "$PRIVILEGE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::evidence run ID is invalid'; exit 1; }

      - name: Verify fresh lockdown and privilege evidence binding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export VERIFY_DIR
          VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-post-lockdown-evidence-XXXXXX")
          trap 'rm -rf -- "$VERIFY_DIR"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LOCKDOWN_EVIDENCE_RUN_ID" > "$VERIFY_DIR/lockdown-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-database.yml" > "$VERIFY_DIR/lockdown-workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIVILEGE_EVIDENCE_RUN_ID" > "$VERIFY_DIR/privilege-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-post-lockdown-privilege-smoke.yml" > "$VERIFY_DIR/privilege-workflow.json"
          gh run download "$LOCKDOWN_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-release-evidence-${{ inputs.target }}-$LOCKDOWN_EVIDENCE_RUN_ID" --dir "$VERIFY_DIR/lockdown-artifact"
          gh run download "$PRIVILEGE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "post-lockdown-privilege-evidence-${{ inputs.target }}-$PRIVILEGE_EVIDENCE_RUN_ID" --dir "$VERIFY_DIR/privilege-artifact"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const readJson = (name) => JSON.parse(fs.readFileSync(path.join(process.env.VERIFY_DIR, name), 'utf8'));
          const findOne = (directory, filename) => {
            const files = [];
            const walk = (item) => fs.readdirSync(item, { withFileTypes: true }).forEach((entry) => {
              const next = path.join(item, entry.name);
              if (entry.isDirectory()) walk(next); else if (entry.name === filename) files.push(next);
            });
            walk(path.join(process.env.VERIFY_DIR, directory));
            if (files.length !== 1) process.exit(1);
            return JSON.parse(fs.readFileSync(files[0], 'utf8'));
          };
          const runBound = (run, workflow, runId, workflowPath) => run.id === Number(runId)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.GITHUB_SHA
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === workflowPath
            && workflow.path === workflowPath
            && run.workflow_id === workflow.id;
          const lockdownRun = readJson('lockdown-run.json');
          const lockdownWorkflow = readJson('lockdown-workflow.json');
          const privilegeRun = readJson('privilege-run.json');
          const privilegeWorkflow = readJson('privilege-workflow.json');
          const lock = findOne('lockdown-artifact', 'database-release-evidence.json');
          const smoke = findOne('privilege-artifact', 'post-lockdown-privilege-smoke-evidence.json');
          const expectedMigration = {
            'backend-stabilization': '20260727000000_backend_stabilization_lockdown.sql',
            'prompt-privacy': '20260729010000_private_prompt_reads_lockdown.sql',
          }[lock.releaseTrack];
          const appliedAt = Date.parse(lock.appliedAt || '');
          const privilegeCompletedAt = Date.parse(smoke.completedAt || '');
          const now = Date.now();
          const fresh = Number.isFinite(appliedAt)
            && Number.isFinite(privilegeCompletedAt)
            && appliedAt <= privilegeCompletedAt
            && privilegeCompletedAt <= now
            && now - appliedAt <= 6 * 60 * 60 * 1000
            && now - privilegeCompletedAt <= 30 * 60 * 1000;
          const valid = runBound(lockdownRun, lockdownWorkflow, process.env.LOCKDOWN_EVIDENCE_RUN_ID, '.github/workflows/release-database.yml')
            && runBound(privilegeRun, privilegeWorkflow, process.env.PRIVILEGE_EVIDENCE_RUN_ID, '.github/workflows/release-post-lockdown-privilege-smoke.yml')
            && fresh
            && lock.schemaVersion === 3
            && lock.target === '${{ inputs.target }}'
            && lock.operation === 'apply-lockdown'
            && Boolean(expectedMigration)
            && lock.migration === expectedMigration
            && lock.commit === process.env.GITHUB_SHA
            && /^[a-f0-9]{64}$/.test(lock.projectRefHash || '')
            && /^[A-Za-z0-9_-]+$/.test(lock.workerVersionId || '')
            && /^[A-Za-z0-9_-]+$/.test(lock.previousStableWorkerVersionId || '')
            && smoke.schemaVersion === 1
            && smoke.target === '${{ inputs.target }}'
            && smoke.operation === 'post-lockdown-privilege-smoke'
            && smoke.releaseTrack === lock.releaseTrack
            && smoke.lockdownMigration === lock.migration
            && smoke.commit === process.env.GITHUB_SHA
            && smoke.projectRefHash === lock.projectRefHash
            && smoke.workerVersionId === lock.workerVersionId
            && smoke.previousStableWorkerVersionId === lock.previousStableWorkerVersionId
            && smoke.lockdownEvidenceRunId === process.env.LOCKDOWN_EVIDENCE_RUN_ID
            && smoke.allPassed === true;
          if (!valid) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, `LOCKDOWN_RELEASE_TRACK=${lock.releaseTrack}\nLOCKDOWN_MIGRATION=${lock.migration}\nLOCKDOWN_PROJECT_REF_HASH=${lock.projectRefHash}\nLOCKDOWN_APPLIED_AT=${lock.appliedAt}\nWORKER_VERSION_ID=${lock.workerVersionId}\nBASELINE_WORKER_VERSION_ID=${lock.previousStableWorkerVersionId}\n`);
          NODE

      - name: Verify v2 Worker is the only serving version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::required Cloudflare deployment credential is absent'; exit 1; }
          export DEPLOYMENT_STATUS_FILE
          DEPLOYMENT_STATUS_FILE=$(mktemp "$RUNNER_TEMP/vmate-post-lockdown-deployment-XXXXXX.json")
          trap 'rm -f -- "$DEPLOYMENT_STATUS_FILE"' EXIT
          args=(--env ""); if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          npx --no-install wrangler deployments status "${args[@]}" --name "$WORKER_NAME" --json > "$DEPLOYMENT_STATUS_FILE"
          node <<'NODE'
          const source = JSON.parse(require('node:fs').readFileSync(process.env.DEPLOYMENT_STATUS_FILE, 'utf8'));
          if (!source || typeof source !== 'object' || Array.isArray(source) || !Array.isArray(source.versions) || source.versions.length === 0) process.exit(1);
          const entries = source.versions.map((entry) => {
            if (!entry || typeof entry !== 'object' || Array.isArray(entry)
              || typeof entry.version_id !== 'string' || !/^[A-Za-z0-9_-]+$/.test(entry.version_id)
              || typeof entry.percentage !== 'number' || !Number.isFinite(entry.percentage)
              || entry.percentage < 0 || entry.percentage > 100) process.exit(1);
            return { id: entry.version_id, percentage: entry.percentage };
          });
          const ids = new Set(entries.map((entry) => entry.id));
          const total = entries.reduce((sum, entry) => sum + entry.percentage, 0);
          if (ids.size !== entries.length || Math.abs(total - 100) > 1e-9
            || entries.length !== 1 || entries[0].id !== process.env.WORKER_VERSION_ID || entries[0].percentage !== 100) process.exit(1);
          NODE

      - name: Run one immediate live smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-release.mjs --base-url "$BASE_URL"

      - name: Record single verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            schemaVersion: 2,
            target: '${{ inputs.target }}',
            operation: 'post-lockdown-verification',
            verificationMode: 'single-immediate-live-smoke',
            releaseTrack: process.env.LOCKDOWN_RELEASE_TRACK,
            lockdownMigration: process.env.LOCKDOWN_MIGRATION,
            commit: process.env.GITHUB_SHA,
            projectRefHash: process.env.LOCKDOWN_PROJECT_REF_HASH,
            workerVersionId: process.env.WORKER_VERSION_ID,
            baselineWorkerVersionId: process.env.BASELINE_WORKER_VERSION_ID,
            lockdownEvidenceRunId: process.env.LOCKDOWN_EVIDENCE_RUN_ID,
            privilegeEvidenceRunId: process.env.PRIVILEGE_EVIDENCE_RUN_ID,
            lockdownAppliedAt: process.env.LOCKDOWN_APPLIED_AT,
            servingVersionVerified: true,
            liveSmokePassed: true,
            completedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/post-lockdown-verification-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: post-lockdown-verification-evidence-${{ inputs.target }}-${{ github.run_id }}
          path: artifacts/post-lockdown-verification-evidence.json
          if-no-files-found: error
