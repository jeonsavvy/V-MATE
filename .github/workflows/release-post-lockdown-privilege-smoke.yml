name: release-post-lockdown-privilege-smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database target whose completed lockdown is being verified
        required: true
        type: choice
        options: [staging, production]
      project_ref:
        description: Project ref registered in the selected protected environment
        required: true
        type: string
      lockdown_evidence_run_id:
        description: apply-lockdown database release evidence run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: post-lockdown-privilege-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.target == 'production' && 'production-post-lockdown-privilege' || 'staging-post-lockdown-privilege' }}
    env:
      PROJECT_REF: ${{ inputs.project_ref }}
      EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      LOCKDOWN_EVIDENCE_RUN_ID: ${{ inputs.lockdown_evidence_run_id }}
      AUTHORIZED_POST_LOCKDOWN_SHA: ${{ vars.AUTHORIZED_POST_LOCKDOWN_SHA }}
      AUTHORIZED_LOCKDOWN_SOURCE_SHA: ${{ vars.AUTHORIZED_LOCKDOWN_SOURCE_SHA }}
      AUTHORIZED_LOCKDOWN_EVIDENCE_RUN_ID: ${{ vars.AUTHORIZED_LOCKDOWN_EVIDENCE_RUN_ID }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate approved target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{8,32}$ && "$LOCKDOWN_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::required privilege-smoke input is absent or invalid'; exit 1; }
          [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::post-lockdown privilege smoke must run from the default branch'; exit 1; }
          [[ "$PROJECT_REF" == "$EXPECTED_PROJECT_REF" ]] || { echo '::error::project_ref does not match the selected environment'; exit 1; }
          if [[ '${{ inputs.target }}' == 'production' ]]; then [[ "$PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::production project guard mismatch'; exit 1; }; else [[ "$PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::staging cannot use the production project'; exit 1; }; fi

      - name: Verify applied lockdown evidence binding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/lockdown
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LOCKDOWN_EVIDENCE_RUN_ID" > evidence/lockdown/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-database.yml" > evidence/lockdown/workflow.json
          gh run download "$LOCKDOWN_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-release-evidence-${{ inputs.target }}-$LOCKDOWN_EVIDENCE_RUN_ID" --dir evidence/lockdown
          node <<'NODE'
          const crypto = require('node:crypto'); const fs = require('node:fs'); const path = require('node:path');
          const files = []; const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).forEach((entry) => { const item = path.join(dir, entry.name); if (entry.isDirectory()) walk(item); else if (entry.name === 'database-release-evidence.json') files.push(item); }); walk('evidence/lockdown');
          if (files.length !== 1) process.exit(1);
          const value = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const run = JSON.parse(fs.readFileSync('evidence/lockdown/run.json', 'utf8'));
          const workflow = JSON.parse(fs.readFileSync('evidence/lockdown/workflow.json', 'utf8'));
          const expectedWorkflowPath = '.github/workflows/release-database.yml';
          const refHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const expectedMigration = {
            'backend-stabilization': '20260727000000_backend_stabilization_lockdown.sql',
            'prompt-privacy': '20260729010000_private_prompt_reads_lockdown.sql',
          }[value.releaseTrack];
          const runBound = run.id === Number(process.env.LOCKDOWN_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === value.commit
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedWorkflowPath
            && workflow.path === expectedWorkflowPath
            && run.workflow_id === workflow.id;
          const valid = runBound
            && value.schemaVersion === 3
            && value.target === '${{ inputs.target }}'
            && value.operation === 'apply-lockdown'
            && /^[a-f0-9]{40}$/.test(String(value.commit || ''))
            && Boolean(expectedMigration)
            && value.migration === expectedMigration
            && value.projectRefHash === refHash
            && /^[a-f0-9]{32}$/.test(String(value.remoteStateFingerprint || ''))
            && /^[a-f0-9]{32}$/.test(String(value.migrationRowsFingerprint || ''))
            && Number.isFinite(Date.parse(value.appliedAt || ''))
            && /^[A-Za-z0-9_-]+$/.test(String(value.workerVersionId || ''))
            && /^[A-Za-z0-9_-]+$/.test(String(value.previousStableWorkerVersionId || ''));
          if (!valid) process.exit(1);
          const appliedAt = new Date(value.appliedAt).toISOString();
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `LOCKDOWN_RELEASE_TRACK=${value.releaseTrack}\nLOCKDOWN_MIGRATION=${value.migration}\nLOCKDOWN_WORKER_VERSION_ID=${value.workerVersionId}\nLOCKDOWN_PREVIOUS_STABLE_VERSION_ID=${value.previousStableWorkerVersionId}\nLOCKDOWN_COMMIT=${value.commit}\nLOCKDOWN_APPLIED_AT=${appliedAt}\nLOCKDOWN_REMOTE_STATE_FINGERPRINT=${value.remoteStateFingerprint}\nLOCKDOWN_MIGRATION_ROWS_FINGERPRINT=${value.migrationRowsFingerprint}\n`,
          );
          NODE

      - name: Verify approved cross-commit lockdown evidence bridge
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LOCKDOWN_COMMIT" != "$GITHUB_SHA" ]]; then
            [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$AUTHORIZED_POST_LOCKDOWN_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$AUTHORIZED_POST_LOCKDOWN_SHA" ]] || { echo '::error::authorized post-lockdown SHA guard mismatch'; exit 1; }
            [[ "$LOCKDOWN_COMMIT" =~ ^[a-f0-9]{40}$ && "$AUTHORIZED_LOCKDOWN_SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$LOCKDOWN_COMMIT" == "$AUTHORIZED_LOCKDOWN_SOURCE_SHA" ]] || { echo '::error::authorized lockdown source SHA guard mismatch'; exit 1; }
            [[ "$AUTHORIZED_LOCKDOWN_EVIDENCE_RUN_ID" =~ ^[0-9]+$ && "$LOCKDOWN_EVIDENCE_RUN_ID" == "$AUTHORIZED_LOCKDOWN_EVIDENCE_RUN_ID" ]] || { echo '::error::authorized lockdown evidence run guard mismatch'; exit 1; }
            git merge-base --is-ancestor "$LOCKDOWN_COMMIT" "$GITHUB_SHA" || { echo '::error::lockdown evidence source is not an ancestor of this verifier'; exit 1; }
            bridge_allowed_files=$'.github/workflows/release-post-lockdown-observation.yml\n.github/workflows/release-post-lockdown-privilege-smoke.yml\nscripts/remote-privilege-smoke.mjs\nscripts/validate-github-workflows.mjs\nserver/deployment-workflow-sync.test.js\nserver/remote-privilege-smoke-contract.test.js'
            expected_bridge_files=$(printf '%s\n' "$bridge_allowed_files" | sort -u)
            actual_bridge_files=$(git diff --name-only "$LOCKDOWN_COMMIT" "$GITHUB_SHA" | sort -u)
            [[ "$actual_bridge_files" == "$expected_bridge_files" ]] || { echo '::error::lockdown verifier bridge change scope is not the exact harness-only set'; exit 1; }
            unexpected_bridge_status=$(git diff --name-status "$LOCKDOWN_COMMIT" "$GITHUB_SHA" | awk '$1 != "M" { print }')
            [[ -z "$unexpected_bridge_status" ]] || { echo '::error::lockdown verifier bridge files must be in-place modifications'; exit 1; }
          fi

      - name: Link disposable worktree to approved project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database release credential is not configured'; exit 1; }
          workdir=$(mktemp -d "$RUNNER_TEMP/vmate-privilege-smoke-XXXXXX")
          mkdir -p "$workdir/supabase"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          npx --no-install supabase link --workdir "$workdir" --project-ref "$PROJECT_REF"
          echo "SUPABASE_WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Reattest unchanged remote lockdown state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database read credential is not configured'; exit 1; }
          state_dir=$(mktemp -d "$RUNNER_TEMP/vmate-lockdown-reattest-XXXXXX")
          trap 'rm -rf -- "$state_dir"' EXIT
          cp scripts/capture-release-state.sql "$SUPABASE_WORKDIR/capture_release_state.sql"
          cp scripts/capture-migration-state.sql "$SUPABASE_WORKDIR/capture_migration_state.sql"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_release_state.sql" > "$state_dir/release-state.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_migration_state.sql" > "$state_dir/migration-state.txt"
          export LOCKDOWN_REATTEST_DIR="$state_dir"
          node <<'NODE'
          const fs = require('node:fs');
          const oneFingerprint = (name) => {
            const matches = fs.readFileSync(`${process.env.LOCKDOWN_REATTEST_DIR}/${name}`, 'utf8').match(/\b[a-f0-9]{32}\b/g) || [];
            if (matches.length !== 1) process.exit(1);
            return matches[0];
          };
          const remoteStateFingerprint = oneFingerprint('release-state.txt');
          const migrationRowsFingerprint = oneFingerprint('migration-state.txt');
          if (remoteStateFingerprint !== process.env.LOCKDOWN_REMOTE_STATE_FINGERPRINT
            || migrationRowsFingerprint !== process.env.LOCKDOWN_MIGRATION_ROWS_FINGERPRINT) process.exit(1);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `LOCKDOWN_STATE_REATTESTED=true\nLOCKDOWN_STATE_ATTESTED_AT=${new Date().toISOString()}\n`,
          );
          NODE

      - name: Verify SQL role and transaction privilege contracts
        id: sql_probe
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database release credential is not configured'; exit 1; }
          printf "begin;\nselect set_config('vmate.release_track', '%s', true);\n" "$LOCKDOWN_RELEASE_TRACK" > "$SUPABASE_WORKDIR/post_lockdown_privilege_smoke.sql"
          cat >> "$SUPABASE_WORKDIR/post_lockdown_privilege_smoke.sql" <<'SQL'
          do $$
          begin
            set local role anon;
            begin insert into public.characters(owner_user_id, slug, name) values ('00000000-0000-0000-0000-000000000001', 'privilege-smoke-anon', 'privilege smoke'); raise exception 'anon content write unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            begin insert into public.rooms(user_id, character_id, title) values ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000002', 'privilege smoke'); raise exception 'anon room write unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            begin insert into storage.objects(bucket_id, name) values ('vmate-assets', 'privilege-smoke/anon.webp'); raise exception 'anon storage write unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            reset role;
            set local role authenticated;
            perform set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000001', true);
            begin insert into public.characters(owner_user_id, slug, name) values ('00000000-0000-0000-0000-000000000001', 'privilege-smoke-authenticated', 'privilege smoke'); raise exception 'authenticated content write unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            begin insert into public.rooms(user_id, character_id, title) values ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000002', 'privilege smoke'); raise exception 'authenticated room write unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            begin insert into storage.objects(bucket_id, name) values ('vmate-assets', 'privilege-smoke/authenticated.webp'); raise exception 'authenticated storage write unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            begin perform public.reserve_daily_chat_message('privilege-smoke-request', 30); raise exception 'legacy quota RPC unexpectedly succeeded'; exception when insufficient_privilege then null; end;
            perform public.get_daily_chat_quota(30);
            reset role;
            if exists (
              select 1
              from unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join unnest(array[
                'public.characters', 'public.worlds', 'public.character_assets', 'public.world_assets',
                'public.rooms', 'public.room_messages', 'public.room_state_summaries'
              ]) as tables(table_name)
              cross join unnest(array['INSERT', 'UPDATE', 'DELETE']) as privileges(privilege_name)
              where has_table_privilege(role_name, table_name, privilege_name)
            ) then raise exception 'an API role retains a direct mutation grant'; end if;
            if exists (
              select 1
              from unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join unnest(array[
                'public.reserve_daily_chat_message(text,integer)',
                'public.complete_daily_chat_message(text,jsonb)',
                'public.refund_daily_chat_message(text,integer)'
              ]) as functions(signature)
              where has_function_privilege(role_name, signature, 'EXECUTE')
            ) then raise exception 'an API role retains a legacy quota mutation grant'; end if;
            if exists (
              select 1 from pg_policies
              where schemaname = 'storage' and tablename = 'objects'
                and policyname in (
                  'Authenticated users can upload vmate assets to their own folder',
                  'Authenticated users can update vmate assets in their own folder',
                  'Authenticated users can delete vmate assets in their own folder'
                )
            ) then raise exception 'an authenticated Storage write policy remains'; end if;
            if exists (
              select 1
              from (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where not has_function_privilege('service_role', signature, 'EXECUTE')
            ) then raise exception 'service role cannot execute every required v2 RPC'; end if;
            if exists (
              select 1
              from unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where has_function_privilege(role_name, signature, 'EXECUTE')
            ) then raise exception 'a browser role can execute a service-only v2 RPC'; end if;
            if current_setting('vmate.release_track', true) = 'prompt-privacy' then
              if exists (
                select 1
                from (values
                  ('anon', 'public.characters', 'profile_json'),
                  ('anon', 'public.characters', 'speech_style_json'),
                  ('anon', 'public.characters', 'prompt_profile_json'),
                  ('anon', 'public.worlds', 'world_rules_markdown'),
                  ('anon', 'public.worlds', 'prompt_profile_json'),
                  ('anon', 'public.rooms', 'resolved_prompt_snapshot_json'),
                  ('authenticated', 'public.characters', 'profile_json'),
                  ('authenticated', 'public.characters', 'speech_style_json'),
                  ('authenticated', 'public.characters', 'prompt_profile_json'),
                  ('authenticated', 'public.worlds', 'world_rules_markdown'),
                  ('authenticated', 'public.worlds', 'prompt_profile_json'),
                  ('authenticated', 'public.rooms', 'resolved_prompt_snapshot_json'),
                  ('authenticated', 'public.rooms', 'bridge_profile_json')
                ) as protected(role_name, table_name, column_name)
                where has_column_privilege(role_name, table_name, column_name, 'SELECT')
              ) then raise exception 'a browser role retains direct prompt-column read access'; end if;
              if exists (
                select 1
                from (values
                  ('anon', 'public.public_character_catalog'),
                  ('anon', 'public.public_world_catalog'),
                  ('authenticated', 'public.public_character_catalog'),
                  ('authenticated', 'public.public_world_catalog'),
                  ('authenticated', 'public.owned_character_details'),
                  ('authenticated', 'public.owned_world_details'),
                  ('authenticated', 'public.owned_room_summaries')
                ) as required(role_name, table_name)
                where not has_table_privilege(role_name, table_name, 'SELECT')
              ) then raise exception 'a required safe read view is not selectable'; end if;
              if exists (
                select 1
                from (values
                  ('public.owned_character_details'),
                  ('public.owned_world_details'),
                  ('public.owned_room_summaries')
                ) as owner_views(table_name)
                where has_table_privilege('anon', table_name, 'SELECT')
              ) then raise exception 'anon can select an owner-only view'; end if;
              if exists (
                select 1
                from information_schema.columns
                where table_schema = 'public' and (
                  (table_name = 'public_character_catalog' and column_name in ('profile_json', 'speech_style_json', 'prompt_profile_json'))
                  or (table_name = 'public_world_catalog' and column_name in ('world_rules_markdown', 'prompt_profile_json'))
                  or (table_name = 'owned_room_summaries' and column_name in ('resolved_prompt_snapshot_json', 'bridge_profile_json'))
                )
              ) then raise exception 'a safe view exposes a protected prompt column'; end if;
              if exists (
                select 1
                from (values
                  ('public_character_catalog'),
                  ('public_world_catalog'),
                  ('owned_character_details'),
                  ('owned_world_details'),
                  ('owned_room_summaries')
                ) as safe_views(view_name)
                where not exists (
                  select 1 from pg_class c
                  join pg_namespace n on n.oid = c.relnamespace
                  where n.nspname = 'public' and c.relname = safe_views.view_name
                    and coalesce(c.reloptions, array[]::text[]) @> array['security_barrier=true']
                )
              ) then raise exception 'a safe view is missing its security barrier'; end if;
              if exists (
                select 1
                from (values
                  ('public.characters', 'profile_json'),
                  ('public.characters', 'speech_style_json'),
                  ('public.characters', 'prompt_profile_json'),
                  ('public.worlds', 'world_rules_markdown'),
                  ('public.worlds', 'prompt_profile_json'),
                  ('public.rooms', 'resolved_prompt_snapshot_json'),
                  ('public.rooms', 'bridge_profile_json')
                ) as protected(table_name, column_name)
                where not has_column_privilege('service_role', table_name, column_name, 'SELECT')
              ) then raise exception 'service role cannot read a required prompt column'; end if;
            end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/post_lockdown_privilege_smoke.sql" > /dev/null

      - name: Verify actual remote anon and authenticated HTTP privilege boundaries
        id: http_probe
        if: ${{ steps.sql_probe.outcome != '' }}
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database release credential is not configured'; exit 1; }
          mkdir -p private-artifacts
          key_file=$(mktemp "$RUNNER_TEMP/vmate-project-api-keys-XXXXXX.json")
          selected_key_file=$(mktemp "$RUNNER_TEMP/vmate-selected-api-keys-XXXXXX.json")
          chmod 600 "$key_file" "$selected_key_file"
          trap 'rm -f -- "$key_file" "$selected_key_file"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            --output "$key_file"
          node scripts/select-supabase-project-api-keys.mjs --input "$key_file" --output "$selected_key_file"
          SUPABASE_ANON_KEY=$(jq -er '.anonKey | select(type == "string" and length > 0)' "$selected_key_file")
          SUPABASE_SERVICE_ROLE_KEY=$(jq -er '.serviceRoleKey | select(type == "string" and length > 0)' "$selected_key_file")
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          export SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          unset SUPABASE_ACCESS_TOKEN
          node scripts/remote-privilege-smoke.mjs \
            --project-ref "$PROJECT_REF" \
            --target "${{ inputs.target }}" \
            --commit "$GITHUB_SHA" \
            --worker-version-id "$LOCKDOWN_WORKER_VERSION_ID" \
            --output private-artifacts/remote-privilege-result.json \
            --confirm-remote-writes

      - name: Record sanitized privilege smoke evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          trap 'rm -rf private-artifacts evidence' EXIT
          node <<'NODE'
          const crypto = require('node:crypto'); const fs = require('node:fs');
          const refHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const sqlPassed = '${{ steps.sql_probe.outcome }}' === 'success';
          const lockdownStateReattested = process.env.LOCKDOWN_STATE_REATTESTED === 'true'
            && Number.isFinite(Date.parse(process.env.LOCKDOWN_STATE_ATTESTED_AT || ''));
          let remote = null;
          try { remote = JSON.parse(fs.readFileSync('private-artifacts/remote-privilege-result.json', 'utf8')); } catch {}
          const scenarios = remote?.scenarios && typeof remote.scenarios === 'object' ? remote.scenarios : {};
          const requiredScenarios = [
            'ephemeralUserCreated', 'anonCharactersInsertDenied', 'authenticatedCharactersInsertDenied',
            'anonRoomsInsertDenied', 'authenticatedRoomsInsertDenied', 'legacyQuotaMutationDenied',
            'authenticatedStorageUploadDenied', 'authenticatedQuotaReadAllowed',
            'serviceRoleV2RpcSurfaceAllowed', 'clientV2RpcSurfaceDenied',
            'serviceRoleV2ReserveRefundAllowed', 'ephemeralUserCleanupSucceeded',
          ];
          const remotePassed = remote?.schemaVersion === 1
            && remote?.target === '${{ inputs.target }}'
            && remote?.commit === process.env.GITHUB_SHA
            && remote?.projectRefHash === refHash
            && remote?.workerVersionId === process.env.LOCKDOWN_WORKER_VERSION_ID
            && Object.keys(scenarios).length === requiredScenarios.length
            && requiredScenarios.every((name) => scenarios[name] === true);
          const evidence = { schemaVersion: 1, target: '${{ inputs.target }}', operation: 'post-lockdown-privilege-smoke', releaseTrack: process.env.LOCKDOWN_RELEASE_TRACK, lockdownMigration: process.env.LOCKDOWN_MIGRATION, commit: process.env.GITHUB_SHA, lockdownCommit: process.env.LOCKDOWN_COMMIT || null, lockdownAppliedAt: process.env.LOCKDOWN_APPLIED_AT || null, lockdownStateReattested, lockdownStateAttestedAt: lockdownStateReattested ? process.env.LOCKDOWN_STATE_ATTESTED_AT : null, projectRefHash: refHash, workerVersionId: process.env.LOCKDOWN_WORKER_VERSION_ID || null, previousStableWorkerVersionId: process.env.LOCKDOWN_PREVIOUS_STABLE_VERSION_ID || null, lockdownEvidenceRunId: process.env.LOCKDOWN_EVIDENCE_RUN_ID, sqlRoleProbePassed: sqlPassed, httpGatewayProbePassed: remotePassed, gatewayScenarios: Object.fromEntries(requiredScenarios.map((name) => [name, scenarios[name] === true])), allPassed: lockdownStateReattested && sqlPassed && remotePassed, completedAt: new Date().toISOString() };
          fs.writeFileSync('artifacts/post-lockdown-privilege-smoke-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          if (!evidence.allPassed) process.exitCode = 1;
          NODE

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: post-lockdown-privilege-evidence-${{ inputs.target }}-${{ github.run_id }}
          path: artifacts/post-lockdown-privilege-smoke-evidence.json
          if-no-files-found: error

      - name: Remove disposable worktree
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${SUPABASE_WORKDIR:-}" && "$SUPABASE_WORKDIR" == "$RUNNER_TEMP"/* ]]; then rm -rf -- "$SUPABASE_WORKDIR"; fi
