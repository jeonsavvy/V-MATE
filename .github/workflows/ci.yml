name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate GitHub Actions workflow structure
        run: node scripts/validate-github-workflows.mjs

      - name: Validate public documentation surface
        run: node scripts/validate-public-surface.mjs

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Verify (typecheck, test, build)
        run: npm run verify

      - name: Enforce server coverage gates
        run: npm run test:server:coverage

      - name: Validate Worker upload without remote mutation
        run: npm run cf:dry-run

      - name: Record immutable release asset hashes
        run: npm run release:manifest

  database_contracts:
    name: Database contracts (local Docker only)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run fresh and upgrade database contracts
        run: npm run test:db
