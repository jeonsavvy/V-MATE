name: release-database

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target database; writes use operation-specific approval environments
        required: true
        type: choice
        options: [staging, production]
      release_track:
        description: Allowlisted two-phase database contract to preview or apply
        required: true
        type: choice
        options: [backend-stabilization, prompt-privacy]
      operation:
        description: Preview or explicitly apply exactly one stage in the selected track
        required: true
        type: choice
        options: [dry-run-expand, apply-expand, dry-run-lockdown, apply-lockdown]
      project_ref:
        description: Project ref registered in the selected GitHub environment
        required: true
        type: string
      worker_version_id:
        description: Required for apply-lockdown; must match a verified cutover artifact
        required: false
        type: string
      worker_evidence_run_id:
        description: Required for apply-lockdown; GitHub run containing verified cutover evidence
        required: false
        type: string
      backup_evidence_run_id:
        description: Required before apply-expand and prompt-privacy apply-lockdown except the approved production prompt-privacy prelaunch path
        required: false
        type: string
      synthetic_evidence_run_id:
        description: Required before staging apply-lockdown; GitHub run containing the approved synthetic A/B smoke evidence
        required: false
        type: string
      staging_privilege_evidence_run_id:
        description: Standard path before production apply-expand; completed staging post-lockdown privilege smoke for this commit
        required: false
        type: string
      prelaunch_evidence_run_id:
        description: Prelaunch-only current attestation; apply-lockdown may renew the original expand attestation within six hours
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: database-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.operation }} ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target == 'production' && format('production-db-{0}', inputs.operation) || format('staging-db-{0}', inputs.operation) }}
    env:
      PROJECT_REF: ${{ inputs.project_ref }}
      EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      STAGING_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
      WORKER_EVIDENCE_RUN_ID: ${{ inputs.worker_evidence_run_id }}
      BACKUP_EVIDENCE_RUN_ID: ${{ inputs.backup_evidence_run_id }}
      SYNTHETIC_EVIDENCE_RUN_ID: ${{ inputs.synthetic_evidence_run_id }}
      STAGING_PRIVILEGE_EVIDENCE_RUN_ID: ${{ inputs.staging_privilege_evidence_run_id }}
      PRELAUNCH_EVIDENCE_RUN_ID: ${{ inputs.prelaunch_evidence_run_id }}
      RELEASE_TRACK: ${{ inputs.release_track }}
      AUTHORIZED_DOMAIN_RELEASE_SHA: ${{ vars.AUTHORIZED_DOMAIN_RELEASE_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Require successful CI for this default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo '::error::Database releases must run from the default branch';
            exit 1;
          }
          node --input-type=module <<'NODE'
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const api = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API request failed with status ${response.status}`);
            return response.json();
          };
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const branch = process.env.DEFAULT_BRANCH;
          const runs = await api(`/repos/${repository}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=100`);
          const run = runs.workflow_runs?.find((candidate) => candidate.event === 'push'
            && candidate.head_sha === sha
            && candidate.head_branch === branch
            && candidate.conclusion === 'success');
          if (!run) throw new Error('No successful CI run exists for this default-branch commit.');
          const jobs = await api(`/repos/${repository}/actions/runs/${run.id}/jobs?filter=latest&per_page=100`);
          const conclusions = new Map((jobs.jobs || []).map((job) => [job.name, job.conclusion]));
          for (const required of ['quality', 'Database contracts (local Docker only)']) {
            if (conclusions.get(required) !== 'success') throw new Error(`Required CI job did not pass: ${required}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate approved target and selected migration stage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database release credential is not configured'; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{8,32}$ ]] || { echo '::error::project_ref is not canonical'; exit 1; }
          [[ -n "$EXPECTED_PROJECT_REF" && "$PROJECT_REF" == "$EXPECTED_PROJECT_REF" ]] || { echo '::error::project_ref does not match the selected approval environment'; exit 1; }
          [[ -n "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::production project guard is not configured'; exit 1; }
          if [[ '${{ inputs.target }}' == 'staging' ]]; then
            [[ "$PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::staging cannot use the production project'; exit 1; }
          else
            [[ "$PROJECT_REF" == "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::production project guard mismatch'; exit 1; }
          fi
          case '${{ inputs.release_track }}:${{ inputs.operation }}' in
            backend-stabilization:dry-run-expand|backend-stabilization:apply-expand) migration='20260726190559_backend_stabilization_expand.sql' ;;
            backend-stabilization:dry-run-lockdown|backend-stabilization:apply-lockdown) migration='20260727000000_backend_stabilization_lockdown.sql' ;;
            prompt-privacy:dry-run-expand|prompt-privacy:apply-expand) migration='20260729000000_prompt_read_views_expand.sql' ;;
            prompt-privacy:dry-run-lockdown|prompt-privacy:apply-lockdown) migration='20260729010000_private_prompt_reads_lockdown.sql' ;;
            *) echo '::error::unsupported migration operation'; exit 1 ;;
          esac
          [[ -f "supabase/migrations/$migration" ]] || { echo '::error::allowlisted migration is absent'; exit 1; }
          echo "MIGRATION=$migration" >> "$GITHUB_ENV"
          if [[ '${{ inputs.operation }}' == 'apply-lockdown' ]]; then
            [[ "$WORKER_VERSION_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::worker_version_id is required for lockdown'; exit 1; }
            [[ "$WORKER_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::worker_evidence_run_id is required for lockdown'; exit 1; }
          fi
          prelaunch=false
          [[ "$PRELAUNCH_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] && prelaunch=true
          if [[ -n "$PRELAUNCH_EVIDENCE_RUN_ID" && "$prelaunch" != true ]]; then
            echo '::error::prelaunch_evidence_run_id is not canonical'; exit 1
          fi
          if [[ "$prelaunch" == true && ! ( '${{ inputs.target }}' == 'production' && '${{ inputs.release_track }}' == 'prompt-privacy' && ( '${{ inputs.operation }}' == 'apply-expand' || '${{ inputs.operation }}' == 'apply-lockdown' ) ) ]]; then
            echo '::error::prelaunch evidence is limited to production prompt-privacy apply operations'; exit 1
          fi
          if [[ '${{ inputs.operation }}' == 'apply-expand' || ( '${{ inputs.release_track }}' == 'prompt-privacy' && '${{ inputs.operation }}' == 'apply-lockdown' ) ]]; then
            if [[ "$prelaunch" == true ]]; then
              [[ -z "$BACKUP_EVIDENCE_RUN_ID" ]] || { echo '::error::prelaunch and physical backup evidence are mutually exclusive'; exit 1; }
            else
              [[ "$BACKUP_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::backup_evidence_run_id is required before apply-expand and prompt-privacy apply-lockdown unless the approved prelaunch path applies'; exit 1; }
            fi
          fi
          if [[ '${{ inputs.target }}' == 'production' && '${{ inputs.operation }}' == 'apply-expand' ]]; then
            staging=false
            [[ "$STAGING_PRIVILEGE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] && staging=true
            if [[ -n "$STAGING_PRIVILEGE_EVIDENCE_RUN_ID" && "$staging" != true ]]; then
              echo '::error::staging_privilege_evidence_run_id is not canonical'; exit 1
            fi
            if [[ '${{ inputs.release_track }}' == 'prompt-privacy' ]]; then
              [[ "$staging" != "$prelaunch" ]] || { echo '::error::exactly one staging privilege or prelaunch evidence run is required'; exit 1; }
            else
              [[ "$prelaunch" == false && "$staging" == true ]] || { echo '::error::staging_privilege_evidence_run_id is required before production apply-expand'; exit 1; }
            fi
            if [[ "$staging" == true ]]; then
              [[ "$STAGING_PROJECT_REF" =~ ^[a-z0-9]{8,32}$ && "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]] || { echo '::error::staging project guard is not configured or is not distinct from production'; exit 1; }
            fi
          fi
          if [[ '${{ inputs.target }}' == 'staging' && '${{ inputs.operation }}' == 'apply-lockdown' ]]; then
            [[ "$SYNTHETIC_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::synthetic_evidence_run_id is required before staging apply-lockdown'; exit 1; }
          fi

      - name: Verify approved backup readiness before expand or prompt privacy lockdown
        if: ${{ (inputs.operation == 'apply-expand' || (inputs.release_track == 'prompt-privacy' && inputs.operation == 'apply-lockdown')) && inputs.prelaunch_evidence_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/backup-readiness
          gh run download "$BACKUP_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "backup-readiness-evidence-${{ inputs.target }}-$BACKUP_EVIDENCE_RUN_ID" --dir artifacts/backup-readiness
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'backup-readiness-evidence.json') files.push(item);
          });
          walk('artifacts/backup-readiness');
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const refHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const capturedAt = Date.parse(evidence.capturedAt || '');
          const fresh = Number.isFinite(capturedAt) && Date.now() - capturedAt <= 6 * 60 * 60 * 1000 && Date.now() >= capturedAt;
          const valid = evidence.schemaVersion === 1
            && evidence.target === '${{ inputs.target }}'
            && evidence.operation === 'backup-readiness'
            && evidence.commit === process.env.GITHUB_SHA
            && evidence.projectRefHash === refHash
            && evidence.physicalBackupPresent === true
            && evidence.backupReadinessApproved === true
            && ('${{ inputs.target }}' !== 'production' || evidence.pitrReadinessApproved === true)
            && fresh;
          if (!valid) process.exit(1);
          NODE

      - name: Verify fresh production prelaunch attestation
        if: ${{ inputs.target == 'production' && inputs.release_track == 'prompt-privacy' && (inputs.operation == 'apply-expand' || inputs.operation == 'apply-lockdown') && inputs.prelaunch_evidence_run_id != '' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/prelaunch-attestation
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRELAUNCH_EVIDENCE_RUN_ID" > artifacts/prelaunch-attestation/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-prelaunch-attestation.yml" > artifacts/prelaunch-attestation/workflow.json
          gh run download "$PRELAUNCH_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "prelaunch-attestation-evidence-production-$PRELAUNCH_EVIDENCE_RUN_ID" --dir artifacts/prelaunch-attestation
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'prelaunch-attestation-evidence.json') files.push(item);
          });
          walk('artifacts/prelaunch-attestation');
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const run = JSON.parse(fs.readFileSync('artifacts/prelaunch-attestation/run.json', 'utf8'));
          const workflow = JSON.parse(fs.readFileSync('artifacts/prelaunch-attestation/workflow.json', 'utf8'));
          const expectedPath = '.github/workflows/release-prelaunch-attestation.yml';
          const expectedKeys = [
            'allPassed', 'attestedAt', 'catalogStateCaptured', 'catalogStateHash',
            'commit', 'defaultBranchCiPassed', 'operation',
            'prelaunchDirectApproved', 'productionProjectGuardPassed', 'projectRefHash',
            'protectedStateCaptured', 'protectedStateHash', 'queryMode', 'releaseTrack',
            'rowCountHash', 'rowCountSnapshotCaptured', 'schemaVersion', 'target',
          ];
          const exactShape = JSON.stringify(Object.keys(evidence).sort()) === JSON.stringify(expectedKeys.sort());
          const refHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const attestedAt = Date.parse(evidence.attestedAt || '');
          const fresh = Number.isFinite(attestedAt)
            && Date.now() >= attestedAt
            && Date.now() - attestedAt <= 6 * 60 * 60 * 1000;
          const runBound = run.id === Number(process.env.PRELAUNCH_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.GITHUB_SHA
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedPath
            && workflow.path === expectedPath
            && run.workflow_id === workflow.id;
          const valid = exactShape
            && runBound
            && evidence.schemaVersion === 2
            && evidence.target === 'production'
            && evidence.operation === 'prelaunch-direct-attestation'
            && evidence.queryMode === 'supabase_read_only_user'
            && evidence.releaseTrack === 'prompt-privacy'
            && evidence.commit === process.env.GITHUB_SHA
            && evidence.projectRefHash === refHash
            && /^[a-f0-9]{64}$/.test(String(evidence.catalogStateHash || ''))
            && /^[a-f0-9]{64}$/.test(String(evidence.rowCountHash || ''))
            && /^[a-f0-9]{64}$/.test(String(evidence.protectedStateHash || ''))
            && evidence.catalogStateCaptured === true
            && evidence.rowCountSnapshotCaptured === true
            && evidence.protectedStateCaptured === true
            && evidence.prelaunchDirectApproved === true
            && evidence.productionProjectGuardPassed === true
            && evidence.defaultBranchCiPassed === true
            && evidence.allPassed === true
            && fresh;
          if (!valid) process.exit(1);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PRELAUNCH_CURRENT_CATALOG_STATE_HASH=${evidence.catalogStateHash}\nPRELAUNCH_CURRENT_ROW_COUNT_HASH=${evidence.rowCountHash}\nPRELAUNCH_CURRENT_PROTECTED_STATE_HASH=${evidence.protectedStateHash}\n`,
          );
          NODE

      - name: Verify successful staging post-lockdown privilege smoke before production expand
        if: ${{ inputs.target == 'production' && inputs.operation == 'apply-expand' && inputs.staging_privilege_evidence_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_metadata=$(gh run view "$STAGING_PRIVILEGE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,workflowName)
          node --input-type=module - "$run_metadata" <<'NODE'
          const run = JSON.parse(process.argv[2]);
          if (run.conclusion !== 'success' || run.headSha !== process.env.GITHUB_SHA || run.workflowName !== 'release-post-lockdown-privilege-smoke') process.exit(1);
          NODE
          mkdir -p artifacts/staging-privilege-smoke
          gh run download "$STAGING_PRIVILEGE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "post-lockdown-privilege-evidence-staging-$STAGING_PRIVILEGE_EVIDENCE_RUN_ID" --dir artifacts/staging-privilege-smoke
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'post-lockdown-privilege-smoke-evidence.json') files.push(item);
          });
          walk('artifacts/staging-privilege-smoke');
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const stagingRefHash = crypto.createHash('sha256').update(process.env.STAGING_PROJECT_REF).digest('hex');
          const expectedLockdownMigration = {
            'backend-stabilization': '20260727000000_backend_stabilization_lockdown.sql',
            'prompt-privacy': '20260729010000_private_prompt_reads_lockdown.sql',
          }['${{ inputs.release_track }}'];
          const valid = evidence.schemaVersion === 1
            && evidence.target === 'staging'
            && evidence.operation === 'post-lockdown-privilege-smoke'
            && evidence.releaseTrack === '${{ inputs.release_track }}'
            && evidence.lockdownMigration === expectedLockdownMigration
            && evidence.commit === process.env.GITHUB_SHA
            && evidence.projectRefHash === stagingRefHash
            && evidence.allPassed === true
            && evidence.sqlRoleProbePassed === true
            && evidence.httpGatewayProbePassed === true
            && evidence.gatewayScenarios?.serviceRoleV2RpcSurfaceAllowed === true
            && evidence.gatewayScenarios?.clientV2RpcSurfaceDenied === true
            && /^[A-Za-z0-9_-]+$/.test(String(evidence.workerVersionId || ''))
            && /^[0-9]+$/.test(String(evidence.lockdownEvidenceRunId || ''));
          if (!valid) process.exit(1);
          NODE

      - name: Verify staging synthetic A/B smoke before lockdown
        if: ${{ inputs.target == 'staging' && inputs.operation == 'apply-lockdown' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/synthetic-smoke
          gh run download "$SYNTHETIC_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "synthetic-smoke-evidence-staging-$SYNTHETIC_EVIDENCE_RUN_ID" --dir artifacts/synthetic-smoke
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'synthetic-smoke-evidence.json') files.push(item);
          });
          walk('artifacts/synthetic-smoke');
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const refHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const expectedExpandMigration = {
            'backend-stabilization': '20260726190559_backend_stabilization_expand.sql',
            'prompt-privacy': '20260729000000_prompt_read_views_expand.sql',
          }[process.env.RELEASE_TRACK];
          const scenarioValues = evidence.scenarios && typeof evidence.scenarios === 'object' ? Object.values(evidence.scenarios) : [];
          const valid = evidence.schemaVersion === 1
            && evidence.target === 'staging'
            && evidence.operation === 'synthetic-smoke'
            && evidence.releaseTrack === process.env.RELEASE_TRACK
            && evidence.expandMigration === expectedExpandMigration
            && /^[0-9]+$/.test(String(evidence.expandEvidenceRunId || ''))
            && evidence.commit === process.env.GITHUB_SHA
            && evidence.projectRefHash === refHash
            && evidence.allPassed === true
            && scenarioValues.length >= 20
            && scenarioValues.every((value) => value === true)
            && evidence.workerVersionId === process.env.WORKER_VERSION_ID;
          if (!valid) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, `SYNTHETIC_EXPAND_EVIDENCE_RUN_ID=${evidence.expandEvidenceRunId}\n`);
          NODE

      - name: Verify compatible Worker cutover evidence before lockdown
        if: ${{ inputs.operation == 'apply-lockdown' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/worker-evidence
          artifact_name="release-evidence-${{ inputs.target }}-${WORKER_EVIDENCE_RUN_ID}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKER_EVIDENCE_RUN_ID" > artifacts/worker-evidence/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-worker.yml" > artifacts/worker-evidence/workflow.json
          gh run download "$WORKER_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir artifacts/worker-evidence
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'release-evidence.json') files.push(item);
          });
          walk('artifacts/worker-evidence');
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const run = JSON.parse(fs.readFileSync('artifacts/worker-evidence/run.json', 'utf8'));
          const workflow = JSON.parse(fs.readFileSync('artifacts/worker-evidence/workflow.json', 'utf8'));
          const projectRefHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          const expectedExpandMigration = {
            'backend-stabilization': '20260726190559_backend_stabilization_expand.sql',
            'prompt-privacy': '20260729000000_prompt_read_views_expand.sql',
          }[process.env.RELEASE_TRACK];
          const expectedWorkflowPath = '.github/workflows/release-worker.yml';
          const runBound = run.id === Number(process.env.WORKER_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.GITHUB_SHA
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedWorkflowPath
            && workflow.path === expectedWorkflowPath
            && run.workflow_id === workflow.id;
          const immutableVersionBound = /^[0-9]+$/.test(String(evidence.shadowEvidenceRunId || ''))
            && Number.isInteger(evidence.shadowRunAttempt)
            && evidence.shadowRunAttempt >= 1
            && evidence.versionTag === `github-${evidence.shadowEvidenceRunId}-${evidence.shadowRunAttempt}`
            && evidence.versionMessage === process.env.GITHUB_SHA
            && Number.isFinite(Date.parse(evidence.versionCreatedAt || ''))
            && /^[a-f0-9]{64}$/.test(String(evidence.versionMetadataHash || ''));
          const expandCommitBound = evidence.expandEvidenceCommit === process.env.GITHUB_SHA
            ? evidence.expandBridgePrelaunchEvidenceRunId === null
            : '${{ inputs.target }}' === 'production'
              && process.env.RELEASE_TRACK === 'prompt-privacy'
              && evidence.expandEvidenceRunId === '30461795102'
              && evidence.expandEvidenceCommit === 'd839befb167ca1024258ac01198ec96c3d3b3837'
              && /^[0-9]+$/.test(String(evidence.expandBridgePrelaunchEvidenceRunId || ''))
              && /^[0-9]+$/.test(String(process.env.PRELAUNCH_EVIDENCE_RUN_ID || ''));
          const valid = runBound
            && immutableVersionBound
            && expandCommitBound
            && evidence.schemaVersion === 4
            && evidence.target === '${{ inputs.target }}'
            && evidence.operation === 'cutover'
            && evidence.commit === process.env.GITHUB_SHA
            && evidence.versionId === process.env.WORKER_VERSION_ID
            && evidence.databaseReleaseTrack === process.env.RELEASE_TRACK
            && evidence.expandMigration === expectedExpandMigration
            && /^[0-9]+$/.test(String(evidence.expandEvidenceRunId || ''))
            && ('${{ inputs.target }}' !== 'staging' || evidence.expandEvidenceRunId === process.env.SYNTHETIC_EXPAND_EVIDENCE_RUN_ID)
            && evidence.expandProjectRefHash === projectRefHash
            && Number.isFinite(Date.parse(evidence.expandAppliedAt || ''))
            && /^[A-Za-z0-9_-]+$/.test(String(evidence.previousStableVersionId || ''))
            && evidence.smokePassed === true
            && evidence.monitorChecks === 1
            && evidence.monitorMinutes === 0
            && evidence.observabilityPassed === null
            && evidence.observabilityMetrics === null
            && evidence.observabilityWindow === null
            && evidence.baselineWindow === null;
          if (!valid) process.exit(1);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `LOCKDOWN_EXPAND_EVIDENCE_RUN_ID=${evidence.expandEvidenceRunId}\nLOCKDOWN_EXPAND_EVIDENCE_COMMIT=${evidence.expandEvidenceCommit}\nLOCKDOWN_EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID=${evidence.expandBridgePrelaunchEvidenceRunId || ''}\nLOCKDOWN_PREVIOUS_STABLE_VERSION_ID=${evidence.previousStableVersionId}\n`,
          );
          NODE

      - name: Verify prelaunch evidence matches the production expand chain
        if: ${{ inputs.target == 'production' && inputs.release_track == 'prompt-privacy' && inputs.operation == 'apply-lockdown' && inputs.prelaunch_evidence_run_id != '' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/prelaunch-expand
          if [[ "$LOCKDOWN_EXPAND_EVIDENCE_COMMIT" != "$GITHUB_SHA" ]]; then
            [[ "$LOCKDOWN_EXPAND_EVIDENCE_RUN_ID" == '30461795102' && "$LOCKDOWN_EXPAND_EVIDENCE_COMMIT" == 'd839befb167ca1024258ac01198ec96c3d3b3837' ]] || { echo '::error::lockdown expand evidence is not the fixed bridge source'; exit 1; }
            [[ "$LOCKDOWN_EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::cutover evidence is missing its current-commit bridge attestation'; exit 1; }
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$AUTHORIZED_DOMAIN_RELEASE_SHA" ]] || { echo '::error::authorized domain release SHA guard mismatch'; exit 1; }
            git merge-base --is-ancestor "$LOCKDOWN_EXPAND_EVIDENCE_COMMIT" "$GITHUB_SHA" || { echo '::error::lockdown expand bridge source is not an ancestor of this commit'; exit 1; }
            bridge_allowed_files=$'.github/workflows/release-database.yml\n.github/workflows/release-worker.yml\nscripts/smoke-release.mjs\nscripts/validate-github-workflows.mjs\nserver/deployment-workflow-sync.test.js\nserver/smoke-release.test.js'
            expected_bridge_files=$(printf '%s\n' "$bridge_allowed_files" | sort -u)
            actual_bridge_files=$(git diff --name-only "$LOCKDOWN_EXPAND_EVIDENCE_COMMIT" "$GITHUB_SHA" | sort -u)
            [[ "$actual_bridge_files" == "$expected_bridge_files" ]] || { echo '::error::lockdown expand bridge change scope is not the exact release-only set'; exit 1; }
            unexpected_bridge_status=$(git diff --name-status "$LOCKDOWN_EXPAND_EVIDENCE_COMMIT" "$GITHUB_SHA" | awk '$1 != "M" { print }')
            [[ -z "$unexpected_bridge_status" ]] || { echo '::error::lockdown expand bridge files must be in-place modifications'; exit 1; }
          else
            [[ -z "$LOCKDOWN_EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" ]] || { echo '::error::current-commit expand evidence must not carry a bridge attestation'; exit 1; }
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LOCKDOWN_EXPAND_EVIDENCE_RUN_ID" > artifacts/prelaunch-expand/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-database.yml" > artifacts/prelaunch-expand/workflow.json
          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('artifacts/prelaunch-expand/run.json', 'utf8'));
          const workflow = JSON.parse(fs.readFileSync('artifacts/prelaunch-expand/workflow.json', 'utf8'));
          const expectedPath = '.github/workflows/release-database.yml';
          const runBound = run.id === Number(process.env.LOCKDOWN_EXPAND_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.LOCKDOWN_EXPAND_EVIDENCE_COMMIT
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedPath
            && workflow.path === expectedPath
            && run.workflow_id === workflow.id;
          if (!runBound) throw new Error('Expand evidence run metadata is not bound to release-database on this default-branch commit.');
          NODE
          gh run download "$LOCKDOWN_EXPAND_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-release-evidence-production-$LOCKDOWN_EXPAND_EVIDENCE_RUN_ID" --dir artifacts/prelaunch-expand
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'database-release-evidence.json') files.push(item);
          });
          walk('artifacts/prelaunch-expand');
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const refHash = crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex');
          if (!process.env.SUPABASE_ACCESS_TOKEN
            || !/^[a-f0-9]{32}$/.test(String(evidence.remoteStateFingerprint || ''))
            || !/^[a-f0-9]{32}$/.test(String(evidence.migrationRowsFingerprint || ''))) process.exit(1);
          const expectedCatalogStateHash = crypto.createHmac('sha256', process.env.SUPABASE_ACCESS_TOKEN)
            .update(JSON.stringify([evidence.remoteStateFingerprint, evidence.migrationRowsFingerprint]))
            .digest('hex');
          const valid = evidence.schemaVersion === 3
            && evidence.target === 'production'
            && evidence.operation === 'apply-expand'
            && evidence.releaseTrack === 'prompt-privacy'
            && evidence.migration === '20260729000000_prompt_read_views_expand.sql'
            && evidence.commit === process.env.LOCKDOWN_EXPAND_EVIDENCE_COMMIT
            && evidence.projectRefHash === refHash
            && /^[0-9]+$/.test(String(evidence.prelaunchOriginalEvidenceRunId || ''))
            && evidence.prelaunchRenewalEvidenceRunId === null
            && /^[a-f0-9]{64}$/.test(String(evidence.prelaunchOriginalCatalogStateHash || ''))
            && process.env.PRELAUNCH_CURRENT_CATALOG_STATE_HASH === expectedCatalogStateHash
            && evidence.prelaunchOriginalRowCountHash === process.env.PRELAUNCH_CURRENT_ROW_COUNT_HASH
            && evidence.prelaunchOriginalProtectedStateHash === process.env.PRELAUNCH_CURRENT_PROTECTED_STATE_HASH
            && evidence.backupEvidenceRunId === null
            && Number.isFinite(Date.parse(evidence.appliedAt || ''));
          if (!valid) process.exit(1);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PRELAUNCH_ORIGINAL_EVIDENCE_RUN_ID=${evidence.prelaunchOriginalEvidenceRunId}\nPRELAUNCH_ORIGINAL_CATALOG_STATE_HASH=${evidence.prelaunchOriginalCatalogStateHash}\nPRELAUNCH_ORIGINAL_ROW_COUNT_HASH=${evidence.prelaunchOriginalRowCountHash}\nPRELAUNCH_ORIGINAL_PROTECTED_STATE_HASH=${evidence.prelaunchOriginalProtectedStateHash}\n`,
          );
          NODE

      - name: Verify prompt privacy logical backup source contract
        if: ${{ inputs.release_track == 'prompt-privacy' && (inputs.operation == 'dry-run-lockdown' || inputs.operation == 'apply-lockdown') }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('supabase/migrations/20260729010000_private_prompt_reads_lockdown.sql', 'utf8');
          const normalized = source.replace(/--[^\n]*/g, ' ').replace(/\s+/g, ' ').toLowerCase();
          const schema = 'vmate_private';
          const stateTable = `${schema}.prompt_lockdown_room_state_backup_20260729`;
          const greetingTable = `${schema}.prompt_lockdown_greeting_backup_20260729`;
          const manifestTable = `${schema}.prompt_lockdown_backup_manifest_20260729`;
          const tableBlock = (table) => normalized.match(new RegExp(`create table ${table.replaceAll('.', '\\.')} \\((.*?)\\);`))?.[1] || '';
          const stateBlock = tableBlock(stateTable);
          const greetingBlock = tableBlock(greetingTable);
          const manifestBlock = tableBlock(manifestTable);
          const requireColumns = (block, columns, label) => {
            if (!block || !columns.every((column) => new RegExp(`\\b${column}\\b`).test(block))) {
              throw new Error(`${label} logical backup columns are incomplete.`);
            }
          };
          requireColumns(stateBlock, ['room_id', 'room_version_before', 'current_situation', 'location', 'relationship_state', 'world_notes_json', 'updated_at'], 'Room state');
          requireColumns(greetingBlock, ['message_id', 'room_id', 'room_version_before', 'role', 'sequence_no', 'content_json'], 'Greeting');
          requireColumns(manifestBlock, [
            'singleton', 'state_count', 'greeting_count', 'state_key_version_hash',
            'greeting_key_version_hash', 'state_payload_hash', 'greeting_payload_hash', 'captured_at',
          ], 'Manifest');
          if (!/\broom_id\b[^,)]*\bprimary key\b|\bprimary key\s*\(\s*room_id\s*\)/.test(stateBlock)) throw new Error('Room state logical backup primary key is absent.');
          if (!/\bmessage_id\b[^,)]*\bprimary key\b|\bprimary key\s*\(\s*message_id\s*\)/.test(greetingBlock)) throw new Error('Greeting logical backup primary key is absent.');
          const stateInsert = normalized.indexOf(`insert into ${stateTable}`);
          const greetingInsert = normalized.indexOf(`insert into ${greetingTable}`);
          const manifestInsert = normalized.indexOf(`insert into ${manifestTable}`);
          const stateUpdate = normalized.indexOf('update public.room_state_summaries');
          const greetingUpdate = normalized.indexOf('update public.room_messages');
          if (!(stateInsert >= 0 && stateInsert < stateUpdate
            && greetingInsert >= 0 && greetingInsert < greetingUpdate
            && manifestInsert > stateInsert && manifestInsert > greetingInsert
            && manifestInsert < stateUpdate && manifestInsert < greetingUpdate)) {
            throw new Error('Logical backups must be populated before destructive prompt scrubbing.');
          }
          const stateGuard = normalized.slice(stateInsert, stateUpdate);
          const greetingGuard = normalized.slice(greetingInsert, greetingUpdate);
          if (!stateGuard.includes('raise exception') || !stateGuard.includes('public.room_state_summaries') || stateGuard.split(stateTable).length < 3) {
            throw new Error('Room state source-key backup guard is absent.');
          }
          if (!greetingGuard.includes('raise exception') || !greetingGuard.includes('public.room_messages') || greetingGuard.split(greetingTable).length < 3) {
            throw new Error('Greeting source-key backup guard is absent.');
          }
          if (!normalized.includes('prompt_lockdown_manifest_update_delete_guard_20260729')
            || !normalized.includes('prompt_lockdown_manifest_truncate_guard_20260729')
            || !normalized.includes('prompt lockdown backup manifest is immutable')) {
            throw new Error('Immutable logical backup manifest guards are absent.');
          }
          for (const table of [stateTable, greetingTable, manifestTable]) {
            for (const role of ['public', 'anon', 'authenticated', 'service_role']) {
              const denied = new RegExp(`revoke all on table[\\s\\S]{0,700}${table.replaceAll('.', '\\.')}[\\s\\S]{0,700}from[\\s\\S]{0,200}\\b${role}\\b`).test(normalized);
              if (!denied) throw new Error(`Logical backup table denial is absent for ${role}.`);
            }
          }
          for (const role of ['public', 'anon', 'authenticated', 'service_role']) {
            const denied = new RegExp(`revoke all on schema ${schema} from[\\s\\S]{0,200}\\b${role}\\b`).test(normalized);
            if (!denied) throw new Error(`Private schema denial is absent for ${role}.`);
          }
          NODE

      - name: Build migration chain through selected stage
        shell: bash
        run: |
          set -euo pipefail
          workdir=$(mktemp -d "$RUNNER_TEMP/vmate-db-release-XXXXXX")
          mkdir -p "$workdir/supabase/migrations" artifacts
          cp supabase/config.toml "$workdir/supabase/config.toml"
          found=false
          : > artifacts/migration-allowlist.txt
          while IFS= read -r source; do
            filename=$(basename "$source")
            destination_filename="$filename"
            if [[ '${{ inputs.target }}' == 'production' && '${{ inputs.release_track }}' == 'prompt-privacy' && "$filename" == '20260727000000_backend_stabilization_lockdown.sql' ]]; then
              destination_filename='20260727025134_backend_stabilization_lockdown.sql'
            fi
            cp "$source" "$workdir/supabase/migrations/$destination_filename"
            printf '%s\n' "$destination_filename" >> artifacts/migration-allowlist.txt
            if [[ "$filename" == "$MIGRATION" ]]; then found=true; break; fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          [[ "$found" == true ]] || { echo '::error::selected migration is not in the ordered chain'; exit 1; }
          [[ "$(grep -c "^${MIGRATION}$" artifacts/migration-allowlist.txt)" -eq 1 ]] || { echo '::error::selected migration must occur exactly once'; exit 1; }
          echo "SUPABASE_WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Link disposable worktree to approved project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase link --workdir "$SUPABASE_WORKDIR" --project-ref "$PROJECT_REF"

      - name: Verify production lockdown migration alias before prompt release
        if: ${{ inputs.target == 'production' && inputs.release_track == 'prompt-privacy' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$SUPABASE_WORKDIR/verify_lockdown_alias.sql" <<'SQL'
          begin;
          do $$
          begin
            if not exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '20260727025134' and name = 'backend_stabilization_lockdown'
            ) then raise exception 'production lockdown migration alias is absent'; end if;
            if exists (
              select 1 from supabase_migrations.schema_migrations
              where version = '20260727000000'
            ) then raise exception 'production contains both source and alias lockdown versions'; end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/verify_lockdown_alias.sql" > /dev/null

      - name: Verify consolidated legacy baseline before expand
        if: ${{ inputs.release_track == 'backend-stabilization' && (inputs.operation == 'dry-run-expand' || inputs.operation == 'apply-expand') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$SUPABASE_WORKDIR/verify_legacy_baseline.sql" <<'SQL'
          begin;
          do $$
          begin
            if to_regprocedure('public.has_confirmed_age()') is not null then raise exception 'legacy age function remains'; end if;
            if exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'profiles' and column_name = 'age_confirmed_at') then raise exception 'legacy age profile column remains'; end if;
            if exists (select 1 from auth.users where coalesce(raw_user_meta_data, '{}'::jsonb) ? 'ageConfirmed') then raise exception 'legacy age metadata remains'; end if;
            if exists (select 1 from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname = 'Public can read vmate assets') then raise exception 'public storage listing policy remains'; end if;
            if to_regprocedure('public.rls_auto_enable()') is not null
              and (has_function_privilege('anon', 'public.rls_auto_enable()', 'EXECUTE') or has_function_privilege('authenticated', 'public.rls_auto_enable()', 'EXECUTE')) then
              raise exception 'database-internal RLS helper remains exposed';
            end if;
            if has_function_privilege('anon', 'public.apply_content_report_action(uuid,text,text)', 'EXECUTE') then raise exception 'owner report action remains public'; end if;
            if not has_function_privilege('authenticated', 'public.reserve_daily_chat_message(text,integer)', 'EXECUTE') then raise exception 'pre-lockdown quota contract is absent'; end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'public' and tablename = 'characters' and policyname = 'Users can insert their own characters'
                and coalesce(with_check, '') not ilike '%has_confirmed_age%'
            ) then raise exception 'character rights-only publishing policy is absent'; end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'public' and tablename = 'worlds' and policyname = 'Users can insert their own worlds'
                and coalesce(with_check, '') not ilike '%has_confirmed_age%'
            ) then raise exception 'world rights-only publishing policy is absent'; end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/verify_legacy_baseline.sql" > /dev/null

      - name: Verify prompt privacy baseline before expand
        if: ${{ inputs.release_track == 'prompt-privacy' && (inputs.operation == 'dry-run-expand' || inputs.operation == 'apply-expand') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$SUPABASE_WORKDIR/verify_prompt_privacy_baseline.sql" <<'SQL'
          begin;
          do $$
          begin
            if has_function_privilege('authenticated', 'public.reserve_daily_chat_message(text,integer)', 'EXECUTE') then
              raise exception 'backend stabilization lockdown is not applied';
            end if;
            if exists (
              select 1
              from (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where not has_function_privilege('service_role', signature, 'EXECUTE')
            ) then raise exception 'service v2 RPC contract is incomplete'; end if;
            if exists (
              select 1
              from unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where has_function_privilege(role_name, signature, 'EXECUTE')
            ) then raise exception 'a browser role can execute a service-only v2 RPC'; end if;
            if exists (
              select 1
              from (values
                ('anon', 'public.characters', 'profile_json'),
                ('anon', 'public.characters', 'speech_style_json'),
                ('anon', 'public.characters', 'prompt_profile_json'),
                ('authenticated', 'public.characters', 'profile_json'),
                ('authenticated', 'public.characters', 'speech_style_json'),
                ('authenticated', 'public.characters', 'prompt_profile_json'),
                ('anon', 'public.worlds', 'world_rules_markdown'),
                ('anon', 'public.worlds', 'prompt_profile_json'),
                ('authenticated', 'public.worlds', 'world_rules_markdown'),
                ('authenticated', 'public.worlds', 'prompt_profile_json'),
                ('authenticated', 'public.rooms', 'resolved_prompt_snapshot_json'),
                ('authenticated', 'public.rooms', 'bridge_profile_json')
              ) as required(role_name, table_name, column_name)
              where not has_column_privilege(role_name, table_name, column_name, 'SELECT')
            ) then
              raise exception 'old Worker prompt reads are not available before prompt expand';
            end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/verify_prompt_privacy_baseline.sql" > /dev/null

      - name: Capture remote database state before preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/capture-release-state.sql "$SUPABASE_WORKDIR/capture_release_state.sql"
          cp scripts/capture-migration-state.sql "$SUPABASE_WORKDIR/capture_migration_state.sql"
          NO_COLOR=1 npx --no-install supabase migration list --workdir "$SUPABASE_WORKDIR" --linked > "$RUNNER_TEMP/migration-history-before.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_release_state.sql" > "$RUNNER_TEMP/release-state-before.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_migration_state.sql" > "$RUNNER_TEMP/migration-state-before.txt"

      - name: Preview and prove exactly one pending migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 npx --no-install supabase db push --workdir "$SUPABASE_WORKDIR" --linked --dry-run 2>&1 | tee "$RUNNER_TEMP/db-push-dry-run.txt"
          node <<'NODE'
          const fs = require('node:fs');
          const selected = process.env.MIGRATION;
          const known = fs.readFileSync('artifacts/migration-allowlist.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean);
          const output = fs.readFileSync(`${process.env.RUNNER_TEMP}/db-push-dry-run.txt`, 'utf8');
          const pending = known.filter((file) => output.includes(file) || output.includes(file.replace(/\.sql$/, '')));
          if (pending.length !== 1 || pending[0] !== selected) {
            console.error('::error::dry-run did not prove that only the selected migration is pending');
            process.exit(1);
          }
          NODE

      - name: Recheck prelaunch data and catalog immediately before apply
        if: ${{ startsWith(inputs.operation, 'apply-') && inputs.prelaunch_evidence_run_id != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Database read credential is not configured'; exit 1; }
          workdir=$(mktemp -d "$RUNNER_TEMP/vmate-prelaunch-current-XXXXXX")
          trap 'rm -rf -- "$workdir"' EXIT
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-release-state.sql --output "$workdir/release-state.json"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-migration-state.sql --output "$workdir/migration-state.json"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-prelaunch-row-counts.sql --output "$workdir/row-counts.json"
          node scripts/run-supabase-read-only-query.mjs --project-ref "$PROJECT_REF" --sql-file scripts/capture-prelaunch-protected-state.sql --output "$workdir/protected-state.json"
          node - "$workdir" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const workdir = process.argv[2];
          const readJson = (file) => JSON.parse(fs.readFileSync(path.join(workdir, file), 'utf8'));
          const firstRow = (value) => Array.isArray(value)
            ? value[0]
            : Array.isArray(value?.data)
              ? value.data[0]
              : Array.isArray(value?.result)
                ? value.result[0]
                : value && typeof value === 'object'
                  ? value
                  : undefined;
          const release = firstRow(readJson('release-state.json'));
          const migration = firstRow(readJson('migration-state.json'));
          const counts = firstRow(readJson('row-counts.json'))?.row_counts;
          const protectedState = firstRow(readJson('protected-state.json'));
          const expectedTables = [
            'account_storage_cleanup_fences', 'app_settings', 'auth_users', 'bookmarks', 'character_assets',
            'characters', 'chat_messages', 'chat_usage_daily', 'chat_usage_events',
            'content_moderation', 'content_moderation_actions', 'content_reports', 'owner_users',
            'profiles', 'recent_views', 'room_messages', 'room_state_summaries', 'rooms',
            'storage_deletion_outbox', 'storage_objects', 'world_assets', 'worlds',
          ];
          const canonicalFingerprint = (value) => /^[a-f0-9]{32}$/.test(String(value || ''));
          if (!canonicalFingerprint(release?.release_state_fingerprint)
            || !canonicalFingerprint(migration?.migration_rows_fingerprint)
            || !canonicalFingerprint(protectedState?.protected_state_fingerprint)
            || !counts || typeof counts !== 'object' || Array.isArray(counts)
            || JSON.stringify(Object.keys(counts).sort()) !== JSON.stringify([...expectedTables].sort())
            || !expectedTables.every((table) => Number.isSafeInteger(Number(counts[table])) && Number(counts[table]) >= 0)) {
            throw new Error('Current prelaunch fingerprint result is invalid.');
          }
          const canonicalCounts = Object.fromEntries(expectedTables.sort().map((table) => [table, String(counts[table])]));
          const hmac = (value) => crypto.createHmac('sha256', process.env.SUPABASE_ACCESS_TOKEN).update(value).digest('hex');
          const current = {
            catalog: hmac(JSON.stringify([release.release_state_fingerprint, migration.migration_rows_fingerprint])),
            rows: hmac(JSON.stringify(canonicalCounts)),
            protectedState: hmac(protectedState.protected_state_fingerprint),
          };
          const unchanged = current.catalog === process.env.PRELAUNCH_CURRENT_CATALOG_STATE_HASH
            && current.rows === process.env.PRELAUNCH_CURRENT_ROW_COUNT_HASH
            && current.protectedState === process.env.PRELAUNCH_CURRENT_PROTECTED_STATE_HASH;
          if (!unchanged) throw new Error('Production database changed after the current prelaunch attestation; renew attestation before applying.');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PRELAUNCH_DRIFT_VERIFIED=true\n');
          NODE

      - name: Apply exactly the approved migration stage
        if: ${{ startsWith(inputs.operation, 'apply-') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase db push --workdir "$SUPABASE_WORKDIR" --linked

      - name: Verify immutable prompt backup manifest and role denial after lockdown
        if: ${{ inputs.release_track == 'prompt-privacy' && inputs.operation == 'apply-lockdown' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$SUPABASE_WORKDIR/verify_prompt_logical_backups.sql" <<'SQL'
          begin;
          do $$
          declare
            manifest vmate_private.prompt_lockdown_backup_manifest_20260729%rowtype;
            backup_state_count bigint;
            backup_greeting_count bigint;
            backup_state_hash text;
            backup_greeting_hash text;
            backup_state_payload_hash text;
            backup_greeting_payload_hash text;
          begin
            if to_regclass('vmate_private.prompt_lockdown_room_state_backup_20260729') is null
              or to_regclass('vmate_private.prompt_lockdown_greeting_backup_20260729') is null
              or to_regclass('vmate_private.prompt_lockdown_backup_manifest_20260729') is null then
              raise exception 'prompt logical backup contract is absent';
            end if;
            if (select count(*) from vmate_private.prompt_lockdown_backup_manifest_20260729) <> 1 then
              raise exception 'prompt logical backup manifest cardinality mismatch';
            end if;
            select * into strict manifest
            from vmate_private.prompt_lockdown_backup_manifest_20260729
            where singleton;
            select
              count(*),
              encode(sha256(convert_to(coalesce(string_agg(
                backup.room_id::text || ':' || backup.room_version_before::text,
                E'\n' order by backup.room_id
              ), ''), 'UTF8')), 'hex')
            into backup_state_count, backup_state_hash
            from vmate_private.prompt_lockdown_room_state_backup_20260729 backup;
            select
              count(*),
              encode(sha256(convert_to(coalesce(string_agg(
                backup.message_id::text || ':' || backup.room_id::text || ':'
                  || backup.room_version_before::text,
                E'\n' order by backup.message_id
              ), ''), 'UTF8')), 'hex')
            into backup_greeting_count, backup_greeting_hash
            from vmate_private.prompt_lockdown_greeting_backup_20260729 backup;
            select encode(sha256(convert_to(coalesce(string_agg(
              jsonb_build_array(
                backup.room_id::text,
                backup.room_version_before,
                backup.current_situation,
                backup.location,
                backup.relationship_state,
                backup.world_notes_json,
                extract(epoch from backup.updated_at)
              )::text,
              E'\n' order by backup.room_id
            ), ''), 'UTF8')), 'hex')
            into backup_state_payload_hash
            from vmate_private.prompt_lockdown_room_state_backup_20260729 backup;
            select encode(sha256(convert_to(coalesce(string_agg(
              jsonb_build_array(
                backup.message_id::text,
                backup.room_id::text,
                backup.room_version_before,
                backup.role,
                backup.sequence_no,
                backup.content_json
              )::text,
              E'\n' order by backup.message_id
            ), ''), 'UTF8')), 'hex')
            into backup_greeting_payload_hash
            from vmate_private.prompt_lockdown_greeting_backup_20260729 backup;
            if manifest.state_count is distinct from backup_state_count
              or manifest.greeting_count is distinct from backup_greeting_count
              or manifest.state_key_version_hash is distinct from backup_state_hash
              or manifest.greeting_key_version_hash is distinct from backup_greeting_hash
              or manifest.state_payload_hash is distinct from backup_state_payload_hash
              or manifest.greeting_payload_hash is distinct from backup_greeting_payload_hash
              or manifest.captured_at is null then
              raise exception 'prompt logical backup manifest parity failed';
            end if;
            if not exists (
              select 1
              from pg_catalog.pg_trigger trigger_record
              join pg_catalog.pg_class relation on relation.oid = trigger_record.tgrelid
              join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'vmate_private'
                and relation.relname = 'prompt_lockdown_backup_manifest_20260729'
                and trigger_record.tgname = 'prompt_lockdown_manifest_update_delete_guard_20260729'
                and not trigger_record.tgisinternal
                and trigger_record.tgenabled <> 'D'
            ) or not exists (
              select 1
              from pg_catalog.pg_trigger trigger_record
              join pg_catalog.pg_class relation on relation.oid = trigger_record.tgrelid
              join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'vmate_private'
                and relation.relname = 'prompt_lockdown_backup_manifest_20260729'
                and trigger_record.tgname = 'prompt_lockdown_manifest_truncate_guard_20260729'
                and not trigger_record.tgisinternal
                and trigger_record.tgenabled <> 'D'
            ) then raise exception 'prompt logical backup manifest immutability guard is absent'; end if;
            if exists (
              select 1
              from pg_catalog.pg_class relation
              join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
              cross join lateral pg_catalog.aclexplode(coalesce(relation.relacl, pg_catalog.acldefault('r', relation.relowner))) privilege
              where namespace.nspname = 'vmate_private'
                and relation.relname in (
                  'prompt_lockdown_room_state_backup_20260729',
                  'prompt_lockdown_greeting_backup_20260729',
                  'prompt_lockdown_backup_manifest_20260729'
                )
                and privilege.grantee = 0
            ) then raise exception 'PUBLIC retains a prompt logical backup table privilege'; end if;
            if exists (
              select 1
              from pg_catalog.unnest(array['anon', 'authenticated', 'service_role']) roles(role_name)
              cross join pg_catalog.unnest(array[
                'vmate_private.prompt_lockdown_room_state_backup_20260729',
                'vmate_private.prompt_lockdown_greeting_backup_20260729',
                'vmate_private.prompt_lockdown_backup_manifest_20260729'
              ]) relations(relation_name)
              cross join pg_catalog.unnest(array['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'TRUNCATE', 'REFERENCES', 'TRIGGER']) privileges(privilege_name)
              where pg_catalog.has_table_privilege(roles.role_name, relations.relation_name, privileges.privilege_name)
            ) then raise exception 'an API role retains a prompt logical backup table privilege'; end if;
            if exists (
              select 1
              from pg_catalog.pg_namespace namespace
              cross join lateral pg_catalog.aclexplode(coalesce(namespace.nspacl, pg_catalog.acldefault('n', namespace.nspowner))) privilege
              where namespace.nspname = 'vmate_private' and privilege.grantee = 0
            ) then raise exception 'PUBLIC retains a prompt logical backup schema privilege'; end if;
            if exists (
              select 1
              from pg_catalog.unnest(array['anon', 'authenticated', 'service_role']) roles(role_name)
              cross join pg_catalog.unnest(array['USAGE', 'CREATE']) privileges(privilege_name)
              where pg_catalog.has_schema_privilege(roles.role_name, 'vmate_private', privileges.privilege_name)
            ) then raise exception 'an API role retains a prompt logical backup schema privilege'; end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/verify_prompt_logical_backups.sql" > /dev/null

      - name: Verify complete service-only v2 RPC contract after apply
        if: ${{ startsWith(inputs.operation, 'apply-') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$SUPABASE_WORKDIR/verify_v2_rpc_privileges.sql" <<'SQL'
          begin;
          do $$
          begin
            if exists (
              select 1
              from (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where not has_function_privilege('service_role', signature, 'EXECUTE')
            ) then raise exception 'service role is missing a required v2 RPC grant'; end if;
            if exists (
              select 1
              from unnest(array['anon', 'authenticated']) as roles(role_name)
              cross join (values
                ('public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)'),
                ('public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)'),
                ('public.refund_chat_message_v2(uuid,text,text,integer)'),
                ('public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)'),
                ('public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)'),
                ('public.reconcile_expired_chat_reservations_v2(integer)')
              ) as functions(signature)
              where has_function_privilege(role_name, signature, 'EXECUTE')
            ) then raise exception 'a browser role retains a service-only v2 RPC grant'; end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/verify_v2_rpc_privileges.sql" > /dev/null

      - name: Prove dry-run did not change remote database state
        if: ${{ startsWith(inputs.operation, 'dry-run-') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 npx --no-install supabase migration list --workdir "$SUPABASE_WORKDIR" --linked > "$RUNNER_TEMP/migration-history-after-dry-run.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_release_state.sql" > "$RUNNER_TEMP/release-state-after-dry-run.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_migration_state.sql" > "$RUNNER_TEMP/migration-state-after-dry-run.txt"
          cmp --silent "$RUNNER_TEMP/migration-history-before.txt" "$RUNNER_TEMP/migration-history-after-dry-run.txt" || {
            echo '::error::dry-run changed remote migration history';
            exit 1;
          }
          cmp --silent "$RUNNER_TEMP/release-state-before.txt" "$RUNNER_TEMP/release-state-after-dry-run.txt" || {
            echo '::error::dry-run changed the remote database catalog';
            exit 1;
          }
          cmp --silent "$RUNNER_TEMP/migration-state-before.txt" "$RUNNER_TEMP/migration-state-after-dry-run.txt" || {
            echo '::error::dry-run changed remote migration row contents';
            exit 1;
          }

      - name: Capture remote database state after apply
        if: ${{ startsWith(inputs.operation, 'apply-') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 npx --no-install supabase migration list --workdir "$SUPABASE_WORKDIR" --linked > "$RUNNER_TEMP/migration-history-after.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_release_state.sql" > "$RUNNER_TEMP/release-state-after.txt"
          npx --no-install supabase db query --workdir "$SUPABASE_WORKDIR" --linked --file "$SUPABASE_WORKDIR/capture_migration_state.sql" > "$RUNNER_TEMP/migration-state-after.txt"

      - name: Record sanitized database release evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const operation = '${{ inputs.operation }}';
          const applied = operation.startsWith('apply-');
          const prelaunch = /^[0-9]+$/.test(process.env.PRELAUNCH_EVIDENCE_RUN_ID || '');
          const prelaunchEligible = '${{ inputs.target }}' === 'production'
            && process.env.RELEASE_TRACK === 'prompt-privacy'
            && (operation === 'apply-expand' || operation === 'apply-lockdown');
          if (prelaunch && !prelaunchEligible) throw new Error('Prelaunch evidence is outside its approved scope.');
          if (prelaunch && process.env.PRELAUNCH_DRIFT_VERIFIED !== 'true') {
            throw new Error('Current prelaunch drift verification is absent.');
          }
          const backupRequired = !prelaunch && (operation === 'apply-expand'
            || (process.env.RELEASE_TRACK === 'prompt-privacy' && operation === 'apply-lockdown'));
          if (backupRequired && !/^[0-9]+$/.test(process.env.BACKUP_EVIDENCE_RUN_ID || '')) {
            throw new Error('Required backup evidence run ID is absent.');
          }
          const historyPath = `${process.env.RUNNER_TEMP}/migration-history-${applied ? 'after' : 'after-dry-run'}.txt`;
          const statePath = `${process.env.RUNNER_TEMP}/release-state-${applied ? 'after' : 'after-dry-run'}.txt`;
          const migrationStatePath = `${process.env.RUNNER_TEMP}/migration-state-${applied ? 'after' : 'after-dry-run'}.txt`;
          const history = fs.readFileSync(historyPath, 'utf8');
          const stateMatches = fs.readFileSync(statePath, 'utf8').match(/\b[a-f0-9]{32}\b/g) || [];
          if (stateMatches.length !== 1) throw new Error('Remote state fingerprint was not canonical.');
          const stateFingerprint = stateMatches[0];
          const migrationStateMatches = fs.readFileSync(migrationStatePath, 'utf8').match(/\b[a-f0-9]{32}\b/g) || [];
          if (migrationStateMatches.length !== 1) throw new Error('Migration row fingerprint was not canonical.');
          const prelaunchOriginalEvidenceRunId = prelaunch
            ? operation === 'apply-expand'
              ? process.env.PRELAUNCH_EVIDENCE_RUN_ID
              : process.env.PRELAUNCH_ORIGINAL_EVIDENCE_RUN_ID
            : null;
          const prelaunchOriginalCatalogStateHash = prelaunch
            ? operation === 'apply-expand'
              ? process.env.PRELAUNCH_CURRENT_CATALOG_STATE_HASH
              : process.env.PRELAUNCH_ORIGINAL_CATALOG_STATE_HASH
            : null;
          const prelaunchOriginalRowCountHash = prelaunch
            ? operation === 'apply-expand'
              ? process.env.PRELAUNCH_CURRENT_ROW_COUNT_HASH
              : process.env.PRELAUNCH_ORIGINAL_ROW_COUNT_HASH
            : null;
          const prelaunchOriginalProtectedStateHash = prelaunch
            ? operation === 'apply-expand'
              ? process.env.PRELAUNCH_CURRENT_PROTECTED_STATE_HASH
              : process.env.PRELAUNCH_ORIGINAL_PROTECTED_STATE_HASH
            : null;
          if (prelaunch && (!/^[0-9]+$/.test(String(prelaunchOriginalEvidenceRunId || ''))
            || ![prelaunchOriginalCatalogStateHash, prelaunchOriginalRowCountHash, prelaunchOriginalProtectedStateHash]
              .every((value) => /^[a-f0-9]{64}$/.test(String(value || ''))))) {
            throw new Error('Original prelaunch evidence binding is incomplete.');
          }
          const evidence = {
            schemaVersion: 3,
            target: '${{ inputs.target }}',
            operation,
            releaseTrack: process.env.RELEASE_TRACK,
            commit: process.env.GITHUB_SHA,
            migration: process.env.MIGRATION,
            projectRefHash: crypto.createHash('sha256').update(process.env.PROJECT_REF).digest('hex'),
            migrationHistoryHash: crypto.createHash('sha256').update(history).digest('hex'),
            remoteStateFingerprint: stateFingerprint,
            migrationRowsFingerprint: migrationStateMatches[0],
            appliedAt: applied ? new Date().toISOString() : null,
            previewedAt: applied ? null : new Date().toISOString(),
            workerVersionId: operation === 'apply-lockdown' ? process.env.WORKER_VERSION_ID : null,
            workerEvidenceRunId: operation === 'apply-lockdown' ? process.env.WORKER_EVIDENCE_RUN_ID : null,
            previousStableWorkerVersionId: operation === 'apply-lockdown' ? process.env.LOCKDOWN_PREVIOUS_STABLE_VERSION_ID : null,
            expandEvidenceRunId: operation === 'apply-lockdown' ? process.env.LOCKDOWN_EXPAND_EVIDENCE_RUN_ID : null,
            backupEvidenceRunId: backupRequired ? process.env.BACKUP_EVIDENCE_RUN_ID : null,
            prelaunchOriginalEvidenceRunId,
            prelaunchRenewalEvidenceRunId: prelaunch && operation === 'apply-lockdown' ? process.env.PRELAUNCH_EVIDENCE_RUN_ID : null,
            prelaunchOriginalCatalogStateHash,
            prelaunchOriginalRowCountHash,
            prelaunchOriginalProtectedStateHash,
            prelaunchRenewalCatalogStateHash: prelaunch && operation === 'apply-lockdown' ? process.env.PRELAUNCH_CURRENT_CATALOG_STATE_HASH : null,
            prelaunchRenewalRowCountHash: prelaunch && operation === 'apply-lockdown' ? process.env.PRELAUNCH_CURRENT_ROW_COUNT_HASH : null,
            prelaunchRenewalProtectedStateHash: prelaunch && operation === 'apply-lockdown' ? process.env.PRELAUNCH_CURRENT_PROTECTED_STATE_HASH : null,
            prelaunchDriftVerified: prelaunch ? true : null,
            immutablePromptBackupManifestVerified: process.env.RELEASE_TRACK === 'prompt-privacy' && operation === 'apply-lockdown' ? true : null,
            syntheticEvidenceRunId: '${{ inputs.target }}' === 'staging' && '${{ inputs.operation }}' === 'apply-lockdown' ? process.env.SYNTHETIC_EVIDENCE_RUN_ID : null,
          };
          fs.writeFileSync('artifacts/database-release-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload sanitized database release evidence
        uses: actions/upload-artifact@v4
        with:
          name: database-release-evidence-${{ inputs.target }}-${{ github.run_id }}
          path: artifacts/database-release-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable migration worktree
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_WORKDIR:-}" && "$SUPABASE_WORKDIR" == "$RUNNER_TEMP"/* ]]; then
            rm -rf -- "$SUPABASE_WORKDIR"
          fi
