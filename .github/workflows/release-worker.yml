name: release-worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target; production uses operation-specific approval environments
        required: true
        type: choice
        options: [staging, production]
      operation:
        description: Upload without traffic (shadow), verify, cut over, or roll back
        required: true
        type: choice
        options: [shadow, smoke, cutover, rollback]
      database_release_track:
        description: Database contract this Worker and its rollback evidence must match
        required: true
        type: choice
        options: [backend-stabilization, prompt-privacy]
      base_url:
        description: HTTPS origin registered in the selected GitHub environment
        required: true
        type: string
      worker_name:
        description: Worker name registered in the selected GitHub environment
        required: true
        type: string
      version_id:
        description: Required for smoke, cutover, and rollback; leave empty for shadow
        required: false
        type: string
      shadow_evidence_run_id:
        description: Required for smoke and cutover; successful current-commit shadow upload evidence for version_id
        required: false
        type: string
      wrangler_env:
        description: Named Wrangler environment; staging must match the approved environment variable
        required: false
        type: string
      expand_evidence_run_id:
        description: Mutually exclusive with baseline_evidence_run_id; apply-expand evidence for the selected database track and target
        required: false
        type: string
      expand_bridge_prelaunch_evidence_run_id:
        description: Current-commit prelaunch attestation required only for the fixed production prompt-privacy expand evidence bridge
        required: false
        type: string
      baseline_evidence_run_id:
        description: Mutually exclusive with expand_evidence_run_id; read-only post-lockdown evidence for a verified non-migration release
        required: false
        type: string
      rollback_mode:
        description: Required for manual rollback; choose evidence-bound pre-lockdown or post-lockdown recovery
        required: false
        type: choice
        options: [pre-lockdown, post-lockdown]
      rollback_evidence_run_id:
        description: Required for manual rollback; successful v2 cutover release evidence run
        required: false
        type: string
      lockdown_evidence_run_id:
        description: Required for expand-backed post-lockdown rollback; omit for a baseline-backed rollback
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: worker-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.operation }} ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: ${{ inputs.target == 'production' && format('production-{0}', inputs.operation) || 'staging' }}
      url: ${{ inputs.base_url }}
    env:
      BASE_URL: ${{ inputs.base_url }}
      WORKER_NAME: ${{ inputs.worker_name }}
      INPUT_VERSION_ID: ${{ inputs.version_id }}
      SHADOW_EVIDENCE_RUN_ID: ${{ inputs.shadow_evidence_run_id }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
      EXPECTED_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      EXPECTED_WORKER_NAME: ${{ vars.WORKER_NAME }}
      EXPECTED_WRANGLER_ENV: ${{ vars.WRANGLER_ENV }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_WORKER_BASE_URL }}
      PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
      EXPAND_EVIDENCE_RUN_ID: ${{ inputs.expand_evidence_run_id }}
      EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID: ${{ inputs.expand_bridge_prelaunch_evidence_run_id }}
      BASELINE_EVIDENCE_RUN_ID: ${{ inputs.baseline_evidence_run_id }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ROLLBACK_MODE: ${{ inputs.rollback_mode }}
      ROLLBACK_EVIDENCE_RUN_ID: ${{ inputs.rollback_evidence_run_id }}
      LOCKDOWN_EVIDENCE_RUN_ID: ${{ inputs.lockdown_evidence_run_id }}
      DATABASE_RELEASE_TRACK: ${{ inputs.database_release_track }}
      AUTHORIZED_DOMAIN_RELEASE_SHA: ${{ vars.AUTHORIZED_DOMAIN_RELEASE_SHA }}
      AUTHORIZED_BASELINE_RELEASE_SHA: ${{ vars.AUTHORIZED_BASELINE_RELEASE_SHA }}
      BASELINE_SOURCE_SHA: 084b38123a37e70d3fa51093fe44b39098a36bc2
      POST_LOCKDOWN_EVIDENCE_SHA: b2b997f6c0eec183509cf2bc4241fc29eb2f6b7e
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate approved target
        shell: bash
        run: |
          set -euo pipefail
          canonical_origin() {
            node -e 'const value = new URL(process.argv[1]); if (value.protocol !== "https:" || value.username || value.password || value.search || value.hash || value.pathname !== "/") process.exit(1); process.stdout.write(value.origin)' "$1"
          }
          input_origin=$(canonical_origin "$BASE_URL") || { echo '::error::base_url must be an HTTPS origin'; exit 1; }
          expected_origin=$(canonical_origin "$EXPECTED_BASE_URL") || { echo '::error::approved WORKER_BASE_URL is missing or invalid'; exit 1; }
          [[ "$input_origin" == "$expected_origin" ]] || { echo '::error::base_url does not match the selected approval environment'; exit 1; }
          echo "APPROVED_ORIGIN=$input_origin" >> "$GITHUB_ENV"
          [[ -n "$EXPECTED_WORKER_NAME" && "$WORKER_NAME" == "$EXPECTED_WORKER_NAME" ]] || { echo '::error::worker_name does not match the selected approval environment'; exit 1; }
          [[ "$WORKER_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo '::error::worker_name has invalid characters'; exit 1; }
          if [[ '${{ inputs.target }}' == 'staging' ]]; then
            [[ -n "$EXPECTED_WRANGLER_ENV" && "$WRANGLER_ENV" == "$EXPECTED_WRANGLER_ENV" ]] || { echo '::error::staging wrangler_env does not match the approved environment'; exit 1; }
            production_origin=$(canonical_origin "$PRODUCTION_BASE_URL") || { echo '::error::production target guard is not configured'; exit 1; }
            [[ "$input_origin" != "$production_origin" && -n "$PRODUCTION_WORKER_NAME" && "$WORKER_NAME" != "$PRODUCTION_WORKER_NAME" ]] || { echo '::error::staging cannot target the production Worker or origin'; exit 1; }
          else
            [[ -z "$WRANGLER_ENV" ]] || { echo '::error::production must use the top-level Wrangler target'; exit 1; }
            production_origin=$(canonical_origin "$PRODUCTION_BASE_URL") || { echo '::error::production target guard is not configured'; exit 1; }
            [[ "$input_origin" == "$production_origin" && "$WORKER_NAME" == "$PRODUCTION_WORKER_NAME" ]] || { echo '::error::production target guard mismatch'; exit 1; }
            [[ "$input_origin" == 'https://v-mate.satinode.com' ]] || { echo '::error::production must use the canonical V-MATE origin'; exit 1; }
            legacy_origin='https://v-mate.jeonsavvy.workers.dev'
            echo "LEGACY_ORIGIN=$legacy_origin" >> "$GITHUB_ENV"
          fi
          if [[ '${{ inputs.operation }}' != 'shadow' ]]; then
            [[ "$INPUT_VERSION_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::version_id is required and must be canonical'; exit 1; }
          fi
          if [[ '${{ inputs.operation }}' == 'smoke' || '${{ inputs.operation }}' == 'cutover' ]]; then
            [[ "$SHADOW_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::shadow_evidence_run_id is required for smoke and cutover'; exit 1; }
          else
            [[ -z "$SHADOW_EVIDENCE_RUN_ID" ]] || { echo '::error::shadow_evidence_run_id is only valid for smoke and cutover'; exit 1; }
          fi
          if [[ '${{ inputs.operation }}' != 'rollback' ]]; then
            [[ "$DATABASE_RELEASE_TRACK" == 'backend-stabilization' || "$DATABASE_RELEASE_TRACK" == 'prompt-privacy' ]] || { echo '::error::database_release_track is invalid'; exit 1; }
            [[ -z "$EXPAND_EVIDENCE_RUN_ID" || "$EXPAND_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::expand_evidence_run_id must be canonical'; exit 1; }
            [[ -z "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" || "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::expand_bridge_prelaunch_evidence_run_id must be canonical'; exit 1; }
            [[ -z "$BASELINE_EVIDENCE_RUN_ID" || "$BASELINE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::baseline_evidence_run_id must be canonical'; exit 1; }
            expand_set=false; baseline_set=false
            [[ "$EXPAND_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] && expand_set=true
            [[ "$BASELINE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] && baseline_set=true
            [[ "$expand_set" != "$baseline_set" ]] || { echo '::error::exactly one expand_evidence_run_id or baseline_evidence_run_id is required'; exit 1; }
            if [[ "$baseline_set" == true ]]; then
              [[ -z "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" ]] || { echo '::error::expand bridge attestation requires expand evidence'; exit 1; }
              [[ "$DATABASE_RELEASE_TRACK" == 'prompt-privacy' ]] || { echo '::error::post-lockdown baseline requires the prompt-privacy track'; exit 1; }
              [[ '${{ inputs.target }}' == 'production' ]] || { echo '::error::baseline evidence is production-only'; exit 1; }
              [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::baseline release must run from the default branch'; exit 1; }
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$AUTHORIZED_BASELINE_RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$AUTHORIZED_BASELINE_RELEASE_SHA" ]] || { echo '::error::authorized baseline release SHA guard mismatch'; exit 1; }
              git merge-base --is-ancestor "$BASELINE_SOURCE_SHA" "$GITHUB_SHA" || { echo '::error::baseline source is not an ancestor of this commit'; exit 1; }
              git merge-base --is-ancestor "$POST_LOCKDOWN_EVIDENCE_SHA" "$GITHUB_SHA" || { echo '::error::post-lockdown evidence source is not an ancestor of this commit'; exit 1; }
              proof_files=$'.github/workflows/release-post-lockdown-observation.yml\n.github/workflows/release-post-lockdown-privilege-smoke.yml\nscripts/remote-privilege-smoke.mjs\nscripts/validate-github-workflows.mjs\nserver/deployment-workflow-sync.test.js\nserver/remote-privilege-smoke-contract.test.js'
              actual_proof_files=$(git diff --name-only "$BASELINE_SOURCE_SHA" "$POST_LOCKDOWN_EVIDENCE_SHA" | sort -u)
              [[ "$actual_proof_files" == "$(printf '%s\n' "$proof_files" | sort -u)" ]] || { echo '::error::post-lockdown proof source change scope is not the exact verified set'; exit 1; }
              unexpected_proof_status=$(git diff --name-status "$BASELINE_SOURCE_SHA" "$POST_LOCKDOWN_EVIDENCE_SHA" | awk '$1 != "M" { print }')
              [[ -z "$unexpected_proof_status" ]] || { echo '::error::post-lockdown proof files must be in-place modifications'; exit 1; }
              git diff --quiet "$BASELINE_SOURCE_SHA" "$GITHUB_SHA" -- supabase/migrations/ || { echo '::error::baseline release cannot add, remove, rename, or modify database migrations'; exit 1; }
            fi
            if [[ -n "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" ]]; then
              [[ '${{ inputs.target }}' == 'production' && "$DATABASE_RELEASE_TRACK" == 'prompt-privacy' && "$expand_set" == true ]] || { echo '::error::expand bridge attestation is limited to production prompt-privacy expand evidence'; exit 1; }
            fi
          else
            [[ -z "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" ]] || { echo '::error::expand bridge attestation is not valid for rollback'; exit 1; }
          fi
          [[ "$EXPECTED_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{8,32}$ ]] || { echo '::error::approved Supabase project ref is missing or invalid'; exit 1; }
          if [[ '${{ inputs.operation }}' == 'rollback' ]]; then
            [[ "$ROLLBACK_MODE" == 'pre-lockdown' || "$ROLLBACK_MODE" == 'post-lockdown' ]] || { echo '::error::rollback_mode must be pre-lockdown or post-lockdown'; exit 1; }
            [[ "$ROLLBACK_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::rollback_evidence_run_id is required for manual rollback'; exit 1; }
            if [[ "$ROLLBACK_MODE" == 'pre-lockdown' ]]; then
              [[ -z "$LOCKDOWN_EVIDENCE_RUN_ID" ]] || { echo '::error::pre-lockdown rollback must not supply lockdown evidence'; exit 1; }
            else
              [[ -z "$LOCKDOWN_EVIDENCE_RUN_ID" || "$LOCKDOWN_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::lockdown_evidence_run_id must be canonical when supplied'; exit 1; }
            fi
          fi

      - name: Verify matching database evidence before serving the new Worker
        if: ${{ inputs.operation != 'rollback' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_VERIFY_DIR
          DATABASE_VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-database-evidence-XXXXXX")
          trap 'rm -rf -- "$DATABASE_VERIFY_DIR"' EXIT
          if [[ "$BASELINE_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_EVIDENCE_RUN_ID" > "$DATABASE_VERIFY_DIR/baseline-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-database-baseline-attestation.yml" > "$DATABASE_VERIFY_DIR/baseline-workflow.json"
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const run = JSON.parse(fs.readFileSync(path.join(process.env.DATABASE_VERIFY_DIR, 'baseline-run.json'), 'utf8'));
          const workflow = JSON.parse(fs.readFileSync(path.join(process.env.DATABASE_VERIFY_DIR, 'baseline-workflow.json'), 'utf8'));
          const defaultBranch = process.env.DEFAULT_BRANCH;
          const expectedPath = '.github/workflows/release-database-baseline-attestation.yml';
          const valid = run.id === Number(process.env.BASELINE_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.GITHUB_SHA
            && run.head_branch === defaultBranch
            && run.path === expectedPath
            && workflow.path === expectedPath
            && run.workflow_id === workflow.id;
          if (!valid) throw new Error('Baseline evidence run metadata does not bind to the approved attestation workflow and current default-branch commit.');
          NODE
            gh run download "$BASELINE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-baseline-evidence-production-$BASELINE_EVIDENCE_RUN_ID" --dir "$DATABASE_VERIFY_DIR/artifact"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPAND_EVIDENCE_RUN_ID" > "$DATABASE_VERIFY_DIR/expand-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-database.yml" > "$DATABASE_VERIFY_DIR/expand-workflow.json"
            node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const run = JSON.parse(fs.readFileSync(path.join(process.env.DATABASE_VERIFY_DIR, 'expand-run.json'), 'utf8'));
          const workflow = JSON.parse(fs.readFileSync(path.join(process.env.DATABASE_VERIFY_DIR, 'expand-workflow.json'), 'utf8'));
          const expectedPath = '.github/workflows/release-database.yml';
          const fixedBridge = '${{ inputs.target }}' === 'production'
            && process.env.DATABASE_RELEASE_TRACK === 'prompt-privacy'
            && process.env.EXPAND_EVIDENCE_RUN_ID === '30461795102'
            && run.head_sha === 'd839befb167ca1024258ac01198ec96c3d3b3837';
          const valid = run.id === Number(process.env.EXPAND_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && (run.head_sha === process.env.GITHUB_SHA || fixedBridge)
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedPath
            && workflow.path === expectedPath
            && run.workflow_id === workflow.id;
          if (!valid) throw new Error('Expand evidence run metadata does not bind to the current commit or the fixed release-only bridge.');
          NODE
            export EXPAND_EVIDENCE_COMMIT
            EXPAND_EVIDENCE_COMMIT=$(node -e "const fs=require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).head_sha)" "$DATABASE_VERIFY_DIR/expand-run.json")
            if [[ "$EXPAND_EVIDENCE_COMMIT" != "$GITHUB_SHA" ]]; then
              [[ "$EXPAND_EVIDENCE_RUN_ID" == '30461795102' && "$EXPAND_EVIDENCE_COMMIT" == 'd839befb167ca1024258ac01198ec96c3d3b3837' ]] || { echo '::error::expand evidence is not the fixed bridge source'; exit 1; }
              [[ "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::current-commit prelaunch attestation is required for the expand evidence bridge'; exit 1; }
              [[ -n "$DEFAULT_BRANCH" && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo '::error::expand evidence bridge must run from the default branch'; exit 1; }
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$AUTHORIZED_DOMAIN_RELEASE_SHA" ]] || { echo '::error::authorized domain release SHA guard mismatch'; exit 1; }
              git merge-base --is-ancestor "$EXPAND_EVIDENCE_COMMIT" "$GITHUB_SHA" || { echo '::error::expand bridge source is not an ancestor of this commit'; exit 1; }
              bridge_allowed_files=$'.github/workflows/release-database.yml\n.github/workflows/release-worker.yml\nscripts/smoke-release.mjs\nscripts/validate-github-workflows.mjs\nserver/deployment-workflow-sync.test.js\nserver/smoke-release.test.js'
              expected_bridge_files=$(printf '%s\n' "$bridge_allowed_files" | sort -u)
              actual_bridge_files=$(git diff --name-only "$EXPAND_EVIDENCE_COMMIT" "$GITHUB_SHA" | sort -u)
              [[ "$actual_bridge_files" == "$expected_bridge_files" ]] || { echo '::error::expand bridge change scope is not the exact release-only set'; exit 1; }
              unexpected_bridge_status=$(git diff --name-status "$EXPAND_EVIDENCE_COMMIT" "$GITHUB_SHA" | awk '$1 != "M" { print }')
              [[ -z "$unexpected_bridge_status" ]] || { echo '::error::expand bridge files must be in-place modifications'; exit 1; }
              mkdir -p "$DATABASE_VERIFY_DIR/bridge-prelaunch"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" > "$DATABASE_VERIFY_DIR/bridge-prelaunch/run.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-prelaunch-attestation.yml" > "$DATABASE_VERIFY_DIR/bridge-prelaunch/workflow.json"
              gh run download "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "prelaunch-attestation-evidence-production-$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" --dir "$DATABASE_VERIFY_DIR/bridge-prelaunch/artifact"
            else
              [[ -z "$EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID" ]] || { echo '::error::expand bridge attestation must be empty for current-commit evidence'; exit 1; }
            fi
            gh run download "$EXPAND_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-release-evidence-${{ inputs.target }}-$EXPAND_EVIDENCE_RUN_ID" --dir "$DATABASE_VERIFY_DIR/artifact"
          fi
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'database-release-evidence.json' || entry.name === 'database-baseline-evidence.json') files.push(item);
          });
          walk(process.env.DATABASE_VERIFY_DIR);
          if (files.length !== 1) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const projectRef = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          if (!/^[a-z0-9]{8,32}$/.test(projectRef || '')) process.exit(1);
          const refHash = crypto.createHash('sha256').update(projectRef).digest('hex');
          const baseline = /^[0-9]+$/.test(String(process.env.BASELINE_EVIDENCE_RUN_ID || ''));
          const bridged = !baseline && process.env.EXPAND_EVIDENCE_COMMIT !== process.env.GITHUB_SHA;
          const expectedExpandMigration = {
            'backend-stabilization': '20260726190559_backend_stabilization_expand.sql',
            'prompt-privacy': '20260729000000_prompt_read_views_expand.sql',
          }[process.env.DATABASE_RELEASE_TRACK];
          const lockdownMigrationAlias = { sourceVersion: '20260727000000', remoteVersion: '20260727025134', remoteName: 'backend_stabilization_lockdown' };
          const lockdownMigrationAliasHash = crypto.createHash('sha256').update(JSON.stringify(lockdownMigrationAlias)).digest('hex');
          const baselineInvariantKeys = [
            'expandApplied', 'lockdownAliasApplied', 'directTableWritesBlocked',
            'legacyQuotaWritesBlocked', 'storageWritePoliciesAbsent',
            'serviceV2MutationRpcsCallable', 'clientV2MutationRpcsBlocked',
            'promptPrivacyMigrationsApplied', 'privatePromptSchemaBlocked', 'privatePromptTablesBlocked',
            'clientPromptColumnsBlocked', 'requiredSafeViewsReadable',
            'ownerViewsAnonymousBlocked', 'safeViewsExcludePromptColumns',
            'safeViewsUseSecurityBarrier', 'safeViewDefinitionsMatch',
            'servicePromptColumnsReadable',
          ];
          const baselineV2Keys = [
            'allPassed', 'attestedAt', 'baselineSourceSha', 'commit', 'invariants',
            'lockdownAppliedAt', 'lockdownCommit', 'lockdownEvidenceRunId',
            'lockdownMigrationAlias', 'lockdownMigrationAliasHash', 'lockdownStateAttestedAt',
            'migrationListHash', 'migrationRowsFingerprint', 'missingMigrationCount',
            'operation', 'postLockdownSourceSha', 'previousStableWorkerVersionId',
            'privilegeCommit', 'privilegeEvidenceRunId', 'projectRefHash', 'queryMode',
            'releaseTrack', 'remoteStateFingerprint', 'schemaVersion', 'target',
            'verificationCommit', 'verificationEvidenceRunId', 'workerVersionId',
          ];
          const baselineV3Keys = [
            ...baselineV2Keys,
            'previousBaselineEvidenceRunId', 'servingCutoverEvidenceRunId',
          ];
          const canonicalOptionalRunId = (value) => value === null || /^[0-9]+$/.test(String(value));
          const baselineEvidenceShape = evidence.schemaVersion === 2
            ? JSON.stringify(Object.keys(evidence).sort()) === JSON.stringify(baselineV2Keys.sort())
            : evidence.schemaVersion === 3
              && JSON.stringify(Object.keys(evidence).sort()) === JSON.stringify(baselineV3Keys.sort())
              && canonicalOptionalRunId(evidence.previousBaselineEvidenceRunId)
              && canonicalOptionalRunId(evidence.servingCutoverEvidenceRunId)
              && (evidence.servingCutoverEvidenceRunId === null || evidence.previousBaselineEvidenceRunId !== null);
          const valid = baseline
            ? baselineEvidenceShape
              && evidence.target === 'production'
              && evidence.operation === 'read-only-post-lockdown-baseline-attestation'
              && evidence.queryMode === 'supabase_read_only_user'
              && evidence.releaseTrack === process.env.DATABASE_RELEASE_TRACK
              && evidence.commit === process.env.GITHUB_SHA
              && evidence.baselineSourceSha === process.env.BASELINE_SOURCE_SHA
              && evidence.postLockdownSourceSha === process.env.POST_LOCKDOWN_EVIDENCE_SHA
              && evidence.lockdownCommit === process.env.BASELINE_SOURCE_SHA
              && evidence.privilegeCommit === process.env.POST_LOCKDOWN_EVIDENCE_SHA
              && evidence.verificationCommit === process.env.POST_LOCKDOWN_EVIDENCE_SHA
              && evidence.projectRefHash === refHash
              && /^[0-9]+$/.test(String(evidence.lockdownEvidenceRunId || ''))
              && /^[0-9]+$/.test(String(evidence.privilegeEvidenceRunId || ''))
              && /^[0-9]+$/.test(String(evidence.verificationEvidenceRunId || ''))
              && /^[A-Za-z0-9_-]+$/.test(String(evidence.workerVersionId || ''))
              && /^[A-Za-z0-9_-]+$/.test(String(evidence.previousStableWorkerVersionId || ''))
              && /^[a-f0-9]{64}$/.test(String(evidence.migrationListHash || ''))
              && /^[a-f0-9]{32}$/.test(String(evidence.migrationRowsFingerprint || ''))
              && /^[a-f0-9]{32}$/.test(String(evidence.remoteStateFingerprint || ''))
              && evidence.missingMigrationCount === 0
              && JSON.stringify(evidence.lockdownMigrationAlias) === JSON.stringify(lockdownMigrationAlias)
              && evidence.lockdownMigrationAliasHash === lockdownMigrationAliasHash
              && evidence.invariants
              && JSON.stringify(Object.keys(evidence.invariants).sort()) === JSON.stringify(baselineInvariantKeys.sort())
              && baselineInvariantKeys.every((name) => evidence.invariants[name] === true)
              && evidence.allPassed === true
              && Number.isFinite(Date.parse(evidence.lockdownAppliedAt || ''))
              && Number.isFinite(Date.parse(evidence.lockdownStateAttestedAt || ''))
              && Number.isFinite(Date.parse(evidence.attestedAt || ''))
              && Date.parse(evidence.lockdownAppliedAt) <= Date.parse(evidence.lockdownStateAttestedAt)
              && Date.parse(evidence.lockdownStateAttestedAt) <= Date.parse(evidence.attestedAt)
              && Date.now() >= Date.parse(evidence.attestedAt)
              && Date.now() - Date.parse(evidence.attestedAt) <= 6 * 60 * 60 * 1000
            : evidence.schemaVersion === 3
              && evidence.target === '${{ inputs.target }}'
              && evidence.operation === 'apply-expand'
              && evidence.releaseTrack === process.env.DATABASE_RELEASE_TRACK
              && evidence.commit === process.env.EXPAND_EVIDENCE_COMMIT
              && evidence.migration === expectedExpandMigration
              && evidence.projectRefHash === refHash
              && Number.isFinite(Date.parse(evidence.appliedAt || ''));
          if (!valid) process.exit(1);
          if (bridged) {
            if (!process.env.SUPABASE_ACCESS_TOKEN
              || !/^[a-f0-9]{32}$/.test(String(evidence.remoteStateFingerprint || ''))
              || !/^[a-f0-9]{32}$/.test(String(evidence.migrationRowsFingerprint || ''))) process.exit(1);
            const expectedCatalogStateHash = crypto.createHmac('sha256', process.env.SUPABASE_ACCESS_TOKEN)
              .update(JSON.stringify([evidence.remoteStateFingerprint, evidence.migrationRowsFingerprint]))
              .digest('hex');
            const bridgeDirectory = path.join(process.env.DATABASE_VERIFY_DIR, 'bridge-prelaunch');
            const prelaunchFiles = [];
            const walkPrelaunch = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
              const item = path.join(directory, entry.name);
              if (entry.isDirectory()) walkPrelaunch(item); else if (entry.name === 'prelaunch-attestation-evidence.json') prelaunchFiles.push(item);
            });
            walkPrelaunch(path.join(bridgeDirectory, 'artifact'));
            if (prelaunchFiles.length !== 1) process.exit(1);
            const prelaunch = JSON.parse(fs.readFileSync(prelaunchFiles[0], 'utf8'));
            const prelaunchRun = JSON.parse(fs.readFileSync(path.join(bridgeDirectory, 'run.json'), 'utf8'));
            const prelaunchWorkflow = JSON.parse(fs.readFileSync(path.join(bridgeDirectory, 'workflow.json'), 'utf8'));
            const expectedPath = '.github/workflows/release-prelaunch-attestation.yml';
            const expectedKeys = [
              'allPassed', 'attestedAt', 'catalogStateCaptured', 'catalogStateHash',
              'commit', 'defaultBranchCiPassed', 'operation',
              'prelaunchDirectApproved', 'productionProjectGuardPassed', 'projectRefHash',
              'protectedStateCaptured', 'protectedStateHash', 'queryMode', 'releaseTrack',
              'rowCountHash', 'rowCountSnapshotCaptured', 'schemaVersion', 'target',
            ];
            const attestedAt = Date.parse(prelaunch.attestedAt || '');
            const appliedAt = Date.parse(evidence.appliedAt || '');
            const fresh = Number.isFinite(attestedAt)
              && Number.isFinite(appliedAt)
              && attestedAt >= appliedAt
              && Date.now() >= attestedAt
              && Date.now() - attestedAt <= 6 * 60 * 60 * 1000;
            const runBound = prelaunchRun.id === Number(process.env.EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID)
              && prelaunchRun.conclusion === 'success'
              && prelaunchRun.status === 'completed'
              && prelaunchRun.event === 'workflow_dispatch'
              && prelaunchRun.head_sha === process.env.GITHUB_SHA
              && prelaunchRun.head_branch === process.env.DEFAULT_BRANCH
              && prelaunchRun.path === expectedPath
              && prelaunchWorkflow.path === expectedPath
              && prelaunchRun.workflow_id === prelaunchWorkflow.id;
            const prelaunchValid = JSON.stringify(Object.keys(prelaunch).sort()) === JSON.stringify(expectedKeys.sort())
              && runBound
              && prelaunch.schemaVersion === 2
              && prelaunch.target === 'production'
              && prelaunch.operation === 'prelaunch-direct-attestation'
              && prelaunch.queryMode === 'supabase_read_only_user'
              && prelaunch.releaseTrack === 'prompt-privacy'
              && prelaunch.commit === process.env.GITHUB_SHA
              && prelaunch.projectRefHash === refHash
              && prelaunch.catalogStateHash === expectedCatalogStateHash
              && /^[a-f0-9]{64}$/.test(String(prelaunch.rowCountHash || ''))
              && /^[a-f0-9]{64}$/.test(String(prelaunch.protectedStateHash || ''))
              && prelaunch.rowCountHash === evidence.prelaunchOriginalRowCountHash
              && prelaunch.protectedStateHash === evidence.prelaunchOriginalProtectedStateHash
              && prelaunch.catalogStateCaptured === true
              && prelaunch.rowCountSnapshotCaptured === true
              && prelaunch.protectedStateCaptured === true
              && prelaunch.prelaunchDirectApproved === true
              && prelaunch.productionProjectGuardPassed === true
              && prelaunch.defaultBranchCiPassed === true
              && prelaunch.allPassed === true
              && /^[0-9]+$/.test(String(evidence.prelaunchOriginalEvidenceRunId || ''))
              && /^[a-f0-9]{64}$/.test(String(evidence.prelaunchOriginalCatalogStateHash || ''))
              && evidence.prelaunchRenewalEvidenceRunId === null
              && evidence.prelaunchDriftVerified === true
              && evidence.backupEvidenceRunId === null
              && fresh;
            if (!prelaunchValid) process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_EVIDENCE_MODE=${baseline ? 'baseline' : 'expand'}\nBASELINE_SERVING_VERSION_ID=${baseline ? evidence.workerVersionId : ''}\nBASELINE_PREVIOUS_STABLE_VERSION_ID=${baseline ? evidence.previousStableWorkerVersionId : ''}\nEXPAND_PROJECT_REF_HASH=${baseline ? '' : refHash}\nEXPAND_APPLIED_AT=${baseline ? '' : evidence.appliedAt}\nEXPAND_MIGRATION=${baseline ? '' : evidence.migration}\nEXPAND_EVIDENCE_COMMIT=${baseline ? '' : evidence.commit}\nEXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID=${bridged ? process.env.EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID : ''}\n`);
          NODE

      - name: Verify current-commit shadow upload and immutable version metadata
        if: ${{ inputs.operation == 'smoke' || inputs.operation == 'cutover' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::Cloudflare release credential is not configured for this environment'; exit 1; }
          export SHADOW_VERIFY_DIR
          SHADOW_VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-shadow-evidence-XXXXXX")
          trap 'rm -rf -- "$SHADOW_VERIFY_DIR"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SHADOW_EVIDENCE_RUN_ID" > "$SHADOW_VERIFY_DIR/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-worker.yml" > "$SHADOW_VERIFY_DIR/workflow.json"
          gh run download "$SHADOW_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-evidence-${{ inputs.target }}-$SHADOW_EVIDENCE_RUN_ID" --dir "$SHADOW_VERIFY_DIR/artifact"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = [];
          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).forEach((entry) => {
            const item = path.join(directory, entry.name);
            if (entry.isDirectory()) walk(item); else if (entry.name === 'release-evidence.json') files.push(item);
          });
          walk(path.join(process.env.SHADOW_VERIFY_DIR, 'artifact'));
          if (files.length !== 1) process.exit(1);
          const shadow = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          const run = JSON.parse(fs.readFileSync(path.join(process.env.SHADOW_VERIFY_DIR, 'run.json'), 'utf8'));
          const workflow = JSON.parse(fs.readFileSync(path.join(process.env.SHADOW_VERIFY_DIR, 'workflow.json'), 'utf8'));
          const expectedPath = '.github/workflows/release-worker.yml';
          const expectedOrigin = new URL(process.env.BASE_URL).origin;
          const refHash = crypto.createHash('sha256').update(process.env.EXPECTED_SUPABASE_PROJECT_REF).digest('hex');
          const expectedTag = `github-${process.env.SHADOW_EVIDENCE_RUN_ID}-${run.run_attempt}`;
          const expectedExpandMigration = {
            'backend-stabilization': '20260726190559_backend_stabilization_expand.sql',
            'prompt-privacy': '20260729000000_prompt_read_views_expand.sql',
          }[process.env.DATABASE_RELEASE_TRACK];
          const expectedBridgePrelaunchRunId = /^[0-9]+$/.test(String(process.env.EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID || ''))
            ? process.env.EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID
            : null;
          const runBound = run.id === Number(process.env.SHADOW_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.GITHUB_SHA
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedPath
            && workflow.path === expectedPath
            && run.workflow_id === workflow.id;
          const databaseBound = shadow.databaseReleaseTrack === process.env.DATABASE_RELEASE_TRACK
            && shadow.databaseEvidenceMode === process.env.DATABASE_EVIDENCE_MODE
            && (process.env.DATABASE_EVIDENCE_MODE === 'expand'
              ? shadow.expandEvidenceRunId === process.env.EXPAND_EVIDENCE_RUN_ID
                && shadow.baselineEvidenceRunId === null
                && shadow.expandMigration === expectedExpandMigration
                && shadow.expandProjectRefHash === refHash
                && shadow.expandEvidenceCommit === process.env.EXPAND_EVIDENCE_COMMIT
                && shadow.expandBridgePrelaunchEvidenceRunId === expectedBridgePrelaunchRunId
              : process.env.DATABASE_EVIDENCE_MODE === 'baseline'
                ? shadow.baselineEvidenceRunId === process.env.BASELINE_EVIDENCE_RUN_ID
                  && shadow.baselineServingVersionId === process.env.BASELINE_SERVING_VERSION_ID
                  && shadow.previousStableVersionId === process.env.BASELINE_SERVING_VERSION_ID
                  && !shadow.expandEvidenceRunId
                  && shadow.expandMigration === null
                  && shadow.expandEvidenceCommit === null
                  && shadow.expandBridgePrelaunchEvidenceRunId === null
              : false);
          const evidenceBound = shadow.schemaVersion === 4
            && shadow.target === '${{ inputs.target }}'
            && shadow.operation === 'shadow'
            && shadow.commit === process.env.GITHUB_SHA
            && shadow.workerName === process.env.WORKER_NAME
            && shadow.baseUrl === expectedOrigin
            && shadow.projectRefHash === refHash
            && shadow.versionId === process.env.INPUT_VERSION_ID
            && shadow.shadowEvidenceRunId === process.env.SHADOW_EVIDENCE_RUN_ID
            && shadow.shadowRunAttempt === run.run_attempt
            && shadow.versionTag === expectedTag
            && shadow.versionMessage === process.env.GITHUB_SHA
            && /^[a-f0-9]{64}$/.test(String(shadow.versionMetadataHash || ''))
            && Number.isFinite(Date.parse(shadow.versionCreatedAt || ''))
            && shadow.smokePassed === true;
          if (!runBound || !databaseBound || !evidenceBound) process.exit(1);
          fs.writeFileSync(path.join(process.env.SHADOW_VERIFY_DIR, 'bound.json'), JSON.stringify({
            runAttempt: run.run_attempt,
            versionTag: shadow.versionTag,
            versionMessage: shadow.versionMessage,
            versionCreatedAt: shadow.versionCreatedAt,
            versionMetadataHash: shadow.versionMetadataHash,
          }));
          NODE
          args=(--env ""); if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          npx --no-install wrangler versions view "$INPUT_VERSION_ID" "${args[@]}" --name "$WORKER_NAME" --json > "$SHADOW_VERIFY_DIR/live-version.json"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const canonicalize = (value) => Array.isArray(value)
            ? value.map(canonicalize)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]))
              : value;
          const bound = JSON.parse(fs.readFileSync(path.join(process.env.SHADOW_VERIFY_DIR, 'bound.json'), 'utf8'));
          const live = JSON.parse(fs.readFileSync(path.join(process.env.SHADOW_VERIFY_DIR, 'live-version.json'), 'utf8'));
          const liveHash = crypto.createHash('sha256').update(JSON.stringify(canonicalize(live))).digest('hex');
          const valid = live.id === process.env.INPUT_VERSION_ID
            && live.annotations?.['workers/tag'] === bound.versionTag
            && live.annotations?.['workers/message'] === bound.versionMessage
            && live.metadata?.created_on === bound.versionCreatedAt
            && liveHash === bound.versionMetadataHash;
          if (!valid) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, `VERIFIED_SHADOW_RUN_ATTEMPT=${bound.runAttempt}\nVERSION_TAG=${bound.versionTag}\nVERSION_MESSAGE=${bound.versionMessage}\nVERSION_CREATED_AT=${bound.versionCreatedAt}\nVERSION_METADATA_HASH=${bound.versionMetadataHash}\n`);
          NODE

      - name: Verify evidence-bound manual rollback target
        if: ${{ inputs.operation == 'rollback' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export ROLLBACK_VERIFY_DIR
          ROLLBACK_VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/vmate-rollback-evidence-XXXXXX")
          trap 'rm -rf -- "$ROLLBACK_VERIFY_DIR"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_EVIDENCE_RUN_ID" > "$ROLLBACK_VERIFY_DIR/release-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-worker.yml" > "$ROLLBACK_VERIFY_DIR/release-workflow.json"
          gh run download "$ROLLBACK_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-evidence-${{ inputs.target }}-$ROLLBACK_EVIDENCE_RUN_ID" --dir "$ROLLBACK_VERIFY_DIR/release"
          if [[ "$ROLLBACK_MODE" == 'post-lockdown' && "$LOCKDOWN_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            gh run download "$LOCKDOWN_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "database-release-evidence-${{ inputs.target }}-$LOCKDOWN_EVIDENCE_RUN_ID" --dir "$ROLLBACK_VERIFY_DIR/lockdown"
          fi
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const findOne = (directory, filename) => {
            const files = [];
            const walk = (item) => fs.readdirSync(item, { withFileTypes: true }).forEach((entry) => {
              const next = path.join(item, entry.name);
              if (entry.isDirectory()) walk(next); else if (entry.name === filename) files.push(next);
            });
            walk(directory);
            if (files.length !== 1) process.exit(1);
            return JSON.parse(fs.readFileSync(files[0], 'utf8'));
          };
          const release = findOne(path.join(process.env.ROLLBACK_VERIFY_DIR, 'release'), 'release-evidence.json');
          const run = JSON.parse(fs.readFileSync(path.join(process.env.ROLLBACK_VERIFY_DIR, 'release-run.json'), 'utf8'));
          const workflow = JSON.parse(fs.readFileSync(path.join(process.env.ROLLBACK_VERIFY_DIR, 'release-workflow.json'), 'utf8'));
          const refHash = crypto.createHash('sha256').update(process.env.EXPECTED_SUPABASE_PROJECT_REF).digest('hex');
          const expectedOrigin = new URL(process.env.BASE_URL).origin;
          const expectedExpandMigration = {
            'backend-stabilization': '20260726190559_backend_stabilization_expand.sql',
            'prompt-privacy': '20260729000000_prompt_read_views_expand.sql',
          }[process.env.DATABASE_RELEASE_TRACK];
          const expectedLockdownMigration = {
            'backend-stabilization': '20260727000000_backend_stabilization_lockdown.sql',
            'prompt-privacy': '20260729010000_private_prompt_reads_lockdown.sql',
          }[process.env.DATABASE_RELEASE_TRACK];
          const expandBacked = release.databaseEvidenceMode === 'expand';
          const baselineBacked = release.databaseEvidenceMode === 'baseline';
          const matchingDatabaseEvidence = release.databaseReleaseTrack === process.env.DATABASE_RELEASE_TRACK
            && (expandBacked
              ? release.expandMigration === expectedExpandMigration
                && /^[0-9]+$/.test(String(release.expandEvidenceRunId || ''))
                && release.baselineEvidenceRunId === null
              : baselineBacked
                ? release.expandMigration === null
                  && !release.expandEvidenceRunId
                  && /^[0-9]+$/.test(String(release.baselineEvidenceRunId || ''))
                  && /^[A-Za-z0-9_-]+$/.test(String(release.baselineServingVersionId || ''))
                  && release.baselineServingVersionId === release.previousStableVersionId
              : false);
          const expectedWorkflowPath = '.github/workflows/release-worker.yml';
          const runBound = run.id === Number(process.env.ROLLBACK_EVIDENCE_RUN_ID)
            && run.conclusion === 'success'
            && run.status === 'completed'
            && run.event === 'workflow_dispatch'
            && run.head_sha === process.env.GITHUB_SHA
            && run.head_branch === process.env.DEFAULT_BRANCH
            && run.path === expectedWorkflowPath
            && workflow.path === expectedWorkflowPath
            && run.workflow_id === workflow.id;
          const immutableVersionBound = /^[0-9]+$/.test(String(release.shadowEvidenceRunId || ''))
            && Number.isInteger(release.shadowRunAttempt)
            && release.shadowRunAttempt >= 1
            && release.versionTag === `github-${release.shadowEvidenceRunId}-${release.shadowRunAttempt}`
            && release.versionMessage === process.env.GITHUB_SHA
            && Number.isFinite(Date.parse(release.versionCreatedAt || ''))
            && /^[a-f0-9]{64}$/.test(String(release.versionMetadataHash || ''));
          const successfulCutover = runBound
            && immutableVersionBound
            && release.schemaVersion === 4
            && release.target === '${{ inputs.target }}'
            && release.operation === 'cutover'
            && release.commit === process.env.GITHUB_SHA
            && release.projectRefHash === refHash
            && matchingDatabaseEvidence
            && release.workerName === process.env.WORKER_NAME
            && release.baseUrl === expectedOrigin
            && release.smokePassed === true
            && release.monitorChecks === 1
            && release.monitorMinutes === 0
            && release.observabilityPassed === null
            && release.observabilityMetrics === null
            && release.observabilityWindow === null
            && release.baselineWindow === null;
          if (!successfulCutover) process.exit(1);
          if (process.env.ROLLBACK_MODE === 'pre-lockdown') {
            if (baselineBacked || process.env.LOCKDOWN_EVIDENCE_RUN_ID || release.previousStableVersionId !== process.env.INPUT_VERSION_ID) process.exit(1);
          } else if (baselineBacked) {
            const validBaselineRollback = !process.env.LOCKDOWN_EVIDENCE_RUN_ID
              && release.v2Compatible === true
              && release.versionId !== process.env.INPUT_VERSION_ID
              && release.previousStableVersionId === process.env.INPUT_VERSION_ID
              && release.baselineServingVersionId === process.env.INPUT_VERSION_ID;
            if (!validBaselineRollback) process.exit(1);
          } else {
            if (!/^[0-9]+$/.test(String(process.env.LOCKDOWN_EVIDENCE_RUN_ID || ''))) process.exit(1);
            const lockdown = findOne(path.join(process.env.ROLLBACK_VERIFY_DIR, 'lockdown'), 'database-release-evidence.json');
            const validLockdown = lockdown.schemaVersion === 3
              && lockdown.target === '${{ inputs.target }}'
              && lockdown.operation === 'apply-lockdown'
              && lockdown.releaseTrack === process.env.DATABASE_RELEASE_TRACK
              && lockdown.migration === expectedLockdownMigration
              && lockdown.commit === process.env.GITHUB_SHA
              && lockdown.projectRefHash === refHash
              && lockdown.workerVersionId === release.versionId
              && lockdown.workerEvidenceRunId === process.env.ROLLBACK_EVIDENCE_RUN_ID
              && lockdown.previousStableWorkerVersionId === release.previousStableVersionId
              && Number.isFinite(Date.parse(lockdown.appliedAt || ''));
            if (!validLockdown || release.v2Compatible !== true || release.versionId !== process.env.INPUT_VERSION_ID) process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `ROLLBACK_SOURCE_VERSION_ID=${process.env.INPUT_VERSION_ID}\nROLLBACK_SOURCE_EVIDENCE_RUN_ID=${process.env.ROLLBACK_EVIDENCE_RUN_ID}\n`);
          NODE

      - name: Prove live database rollback phase
        if: ${{ inputs.operation == 'rollback' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo '::error::Rollback database-state read credential is not configured'; exit 1; }
          workdir=$(mktemp -d "$RUNNER_TEMP/vmate-rollback-state-XXXXXX")
          trap 'rm -rf -- "$workdir"' EXIT
          mkdir -p "$workdir/supabase"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          npx --no-install supabase link --workdir "$workdir" --project-ref "$EXPECTED_SUPABASE_PROJECT_REF" > /dev/null
          printf "begin;\nselect set_config('vmate.rollback_mode', '%s', true);\nselect set_config('vmate.release_track', '%s', true);\n" "$ROLLBACK_MODE" "$DATABASE_RELEASE_TRACK" > "$workdir/rollback-state.sql"
          cat >> "$workdir/rollback-state.sql" <<'SQL'
          do $$
          declare
            legacy_client_rpc_grant_count integer;
            authenticated_direct_write_grant_count integer;
            api_direct_write_grant_count integer;
            storage_write_policy_count integer;
            service_v2_contract boolean;
            client_v2_rpc_grant_count integer;
            raw_prompt_read_grant_count integer;
            safe_view_count integer;
            safe_view_grant_count integer;
            anon_owner_view_grant_count integer;
            safe_view_security_barrier_count integer;
            safe_view_protected_column_count integer;
            safe_view_projection_mismatch_count integer;
          begin
            select count(*) into legacy_client_rpc_grant_count
            from (values
              (has_function_privilege('authenticated', 'public.reserve_daily_chat_message(text,integer)', 'EXECUTE')),
              (has_function_privilege('authenticated', 'public.complete_daily_chat_message(text,jsonb)', 'EXECUTE')),
              (has_function_privilege('authenticated', 'public.refund_daily_chat_message(text,integer)', 'EXECUTE'))
            ) as grants(allowed)
            where allowed;
            select
              count(*) filter (where role_name = 'authenticated'),
              count(*)
            into authenticated_direct_write_grant_count, api_direct_write_grant_count
            from unnest(array['anon', 'authenticated']) as roles(role_name)
            cross join unnest(array[
              'public.characters', 'public.worlds', 'public.character_assets', 'public.world_assets',
              'public.rooms', 'public.room_messages', 'public.room_state_summaries'
            ]) as tables(table_name)
            cross join unnest(array['INSERT', 'UPDATE', 'DELETE']) as privileges(privilege_name)
            where has_table_privilege(role_name, table_name, privilege_name);
            select count(*) into storage_write_policy_count
            from pg_policies
            where schemaname = 'storage' and tablename = 'objects'
              and policyname in (
                'Authenticated users can upload vmate assets to their own folder',
                'Authenticated users can update vmate assets in their own folder',
                'Authenticated users can delete vmate assets in their own folder'
              );
            service_v2_contract :=
              has_function_privilege('service_role', 'public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)', 'EXECUTE')
              and has_function_privilege('service_role', 'public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)', 'EXECUTE')
              and has_function_privilege('service_role', 'public.refund_chat_message_v2(uuid,text,text,integer)', 'EXECUTE')
              and has_function_privilege('service_role', 'public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)', 'EXECUTE')
              and has_function_privilege('service_role', 'public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)', 'EXECUTE')
              and has_function_privilege('service_role', 'public.reconcile_expired_chat_reservations_v2(integer)', 'EXECUTE');
            select count(*) into client_v2_rpc_grant_count
            from unnest(array['anon', 'authenticated']) as roles(role_name)
            cross join unnest(array[
              'public.reserve_chat_message_v2(uuid,text,uuid,text,text,integer,integer)',
              'public.complete_legacy_chat_message_v2(uuid,text,text,jsonb)',
              'public.refund_chat_message_v2(uuid,text,text,integer)',
              'public.create_room_v2(uuid,text,text,text,text,jsonb,jsonb,jsonb,jsonb)',
              'public.commit_room_turn_v2(uuid,uuid,text,text,bigint,jsonb,jsonb,jsonb,jsonb,jsonb)',
              'public.reconcile_expired_chat_reservations_v2(integer)'
            ]) as functions(signature)
            where has_function_privilege(role_name, signature, 'EXECUTE');
            select count(*) into raw_prompt_read_grant_count
            from (values
              (has_column_privilege('anon', 'public.characters', 'profile_json', 'SELECT')),
              (has_column_privilege('anon', 'public.characters', 'speech_style_json', 'SELECT')),
              (has_column_privilege('anon', 'public.characters', 'prompt_profile_json', 'SELECT')),
              (has_column_privilege('authenticated', 'public.characters', 'profile_json', 'SELECT')),
              (has_column_privilege('authenticated', 'public.characters', 'speech_style_json', 'SELECT')),
              (has_column_privilege('authenticated', 'public.characters', 'prompt_profile_json', 'SELECT')),
              (has_column_privilege('anon', 'public.worlds', 'world_rules_markdown', 'SELECT')),
              (has_column_privilege('anon', 'public.worlds', 'prompt_profile_json', 'SELECT')),
              (has_column_privilege('authenticated', 'public.worlds', 'world_rules_markdown', 'SELECT')),
              (has_column_privilege('authenticated', 'public.worlds', 'prompt_profile_json', 'SELECT')),
              (has_column_privilege('authenticated', 'public.rooms', 'resolved_prompt_snapshot_json', 'SELECT')),
              (has_column_privilege('authenticated', 'public.rooms', 'bridge_profile_json', 'SELECT'))
            ) as grants(allowed)
            where allowed;
            select count(*) into safe_view_count
            from information_schema.views
            where table_schema = 'public' and table_name in (
              'public_character_catalog', 'public_world_catalog', 'owned_character_details',
              'owned_world_details', 'owned_room_summaries'
            );
            select count(*) into safe_view_grant_count
            from (values
              (has_table_privilege('anon', to_regclass('public.public_character_catalog'), 'SELECT')),
              (has_table_privilege('anon', to_regclass('public.public_world_catalog'), 'SELECT')),
              (has_table_privilege('authenticated', to_regclass('public.public_character_catalog'), 'SELECT')),
              (has_table_privilege('authenticated', to_regclass('public.public_world_catalog'), 'SELECT')),
              (has_table_privilege('authenticated', to_regclass('public.owned_character_details'), 'SELECT')),
              (has_table_privilege('authenticated', to_regclass('public.owned_world_details'), 'SELECT')),
              (has_table_privilege('authenticated', to_regclass('public.owned_room_summaries'), 'SELECT'))
            ) as grants(allowed)
            where allowed;
            select count(*) into anon_owner_view_grant_count
            from (values
              (has_table_privilege('anon', to_regclass('public.owned_character_details'), 'SELECT')),
              (has_table_privilege('anon', to_regclass('public.owned_world_details'), 'SELECT')),
              (has_table_privilege('anon', to_regclass('public.owned_room_summaries'), 'SELECT'))
            ) as grants(allowed)
            where allowed;
            select count(*) into safe_view_security_barrier_count
            from pg_class relation
            join pg_namespace namespace on namespace.oid = relation.relnamespace
            where namespace.nspname = 'public'
              and relation.relname in (
                'public_character_catalog', 'public_world_catalog', 'owned_character_details',
                'owned_world_details', 'owned_room_summaries'
              )
              and coalesce(relation.reloptions, array[]::text[]) @> array['security_barrier=true'];
            select count(*) into safe_view_protected_column_count
            from information_schema.columns
            where table_schema = 'public' and (
              (table_name = 'public_character_catalog' and column_name in ('profile_json', 'speech_style_json', 'prompt_profile_json'))
              or (table_name = 'public_world_catalog' and column_name in ('world_rules_markdown', 'prompt_profile_json'))
              or (table_name = 'owned_room_summaries' and column_name in ('resolved_prompt_snapshot_json', 'bridge_profile_json'))
            );
            with expected(table_name, column_name) as (values
              ('public_character_catalog', 'id'),
              ('public_character_catalog', 'owner_user_id'),
              ('public_character_catalog', 'slug'),
              ('public_character_catalog', 'name'),
              ('public_character_catalog', 'headline'),
              ('public_character_catalog', 'summary'),
              ('public_character_catalog', 'cover_image_url'),
              ('public_character_catalog', 'avatar_image_url'),
              ('public_character_catalog', 'visibility'),
              ('public_character_catalog', 'display_status'),
              ('public_character_catalog', 'source_type'),
              ('public_character_catalog', 'source_url'),
              ('public_character_catalog', 'tags'),
              ('public_character_catalog', 'favorite_count'),
              ('public_character_catalog', 'chat_start_count'),
              ('public_character_catalog', 'rights_attested_at'),
              ('public_character_catalog', 'published_at'),
              ('public_character_catalog', 'created_at'),
              ('public_character_catalog', 'updated_at'),
              ('public_character_catalog', 'creator_name'),
              ('public_character_catalog', 'personality'),
              ('public_character_catalog', 'voice'),
              ('public_character_catalog', 'relationship'),
              ('public_character_catalog', 'hero_image_url'),
              ('public_character_catalog', 'image_slots'),
              ('public_character_catalog', 'search_text'),
              ('public_world_catalog', 'id'),
              ('public_world_catalog', 'owner_user_id'),
              ('public_world_catalog', 'slug'),
              ('public_world_catalog', 'name'),
              ('public_world_catalog', 'headline'),
              ('public_world_catalog', 'summary'),
              ('public_world_catalog', 'cover_image_url'),
              ('public_world_catalog', 'visibility'),
              ('public_world_catalog', 'display_status'),
              ('public_world_catalog', 'source_type'),
              ('public_world_catalog', 'source_url'),
              ('public_world_catalog', 'tags'),
              ('public_world_catalog', 'favorite_count'),
              ('public_world_catalog', 'chat_start_count'),
              ('public_world_catalog', 'rights_attested_at'),
              ('public_world_catalog', 'published_at'),
              ('public_world_catalog', 'created_at'),
              ('public_world_catalog', 'updated_at'),
              ('public_world_catalog', 'creator_name'),
              ('public_world_catalog', 'image_slots'),
              ('public_world_catalog', 'search_text'),
              ('owned_room_summaries', 'id'),
              ('owned_room_summaries', 'user_id'),
              ('owned_room_summaries', 'character_id'),
              ('owned_room_summaries', 'world_id'),
              ('owned_room_summaries', 'user_alias'),
              ('owned_room_summaries', 'title'),
              ('owned_room_summaries', 'last_message_at'),
              ('owned_room_summaries', 'created_at'),
              ('owned_room_summaries', 'updated_at'),
              ('owned_room_summaries', 'version')
            ), actual as (
              select table_name::text, column_name::text
              from information_schema.columns
              where table_schema = 'public'
                and table_name in ('public_character_catalog', 'public_world_catalog', 'owned_room_summaries')
            )
            select count(*) into safe_view_projection_mismatch_count
            from (
              (select * from expected except select * from actual)
              union all
              (select * from actual except select * from expected)
            ) projection_differences;
            if current_setting('vmate.release_track', true) = 'backend-stabilization'
              and current_setting('vmate.rollback_mode', true) = 'pre-lockdown' then
              if legacy_client_rpc_grant_count <> 3 or authenticated_direct_write_grant_count <> 21 or api_direct_write_grant_count <> 42
                or storage_write_policy_count <> 3 or not service_v2_contract or client_v2_rpc_grant_count <> 0
                or raw_prompt_read_grant_count <> 12 then
                raise exception 'rollback phase does not match the approved pre-lockdown contract';
              end if;
            elsif current_setting('vmate.release_track', true) = 'backend-stabilization'
              and current_setting('vmate.rollback_mode', true) = 'post-lockdown' then
              if legacy_client_rpc_grant_count <> 0 or api_direct_write_grant_count <> 0 or storage_write_policy_count <> 0
                or not service_v2_contract or client_v2_rpc_grant_count <> 0 or raw_prompt_read_grant_count <> 12 then
                raise exception 'rollback phase does not match the approved post-lockdown contract';
              end if;
            elsif current_setting('vmate.release_track', true) = 'prompt-privacy'
              and current_setting('vmate.rollback_mode', true) = 'pre-lockdown' then
              if legacy_client_rpc_grant_count <> 0 or api_direct_write_grant_count <> 0 or storage_write_policy_count <> 0 or not service_v2_contract
                or client_v2_rpc_grant_count <> 0
                or raw_prompt_read_grant_count <> 12 or safe_view_count <> 5 or safe_view_grant_count <> 7 or anon_owner_view_grant_count <> 0
                or safe_view_security_barrier_count <> 5 or safe_view_protected_column_count <> 0 or safe_view_projection_mismatch_count <> 0 then
                raise exception 'rollback phase does not match the approved prompt pre-lockdown contract';
              end if;
            elsif current_setting('vmate.release_track', true) = 'prompt-privacy'
              and current_setting('vmate.rollback_mode', true) = 'post-lockdown' then
              if legacy_client_rpc_grant_count <> 0 or api_direct_write_grant_count <> 0 or storage_write_policy_count <> 0 or not service_v2_contract
                or client_v2_rpc_grant_count <> 0
                or raw_prompt_read_grant_count <> 0 or safe_view_count <> 5 or safe_view_grant_count <> 7 or anon_owner_view_grant_count <> 0
                or safe_view_security_barrier_count <> 5 or safe_view_protected_column_count <> 0 or safe_view_projection_mismatch_count <> 0 then
                raise exception 'rollback phase does not match the approved prompt post-lockdown contract';
              end if;
            else
              raise exception 'unsupported release track or rollback mode';
            end if;
          end $$;
          rollback;
          SQL
          npx --no-install supabase db query \
            --workdir "$workdir" \
            --linked \
            --file "$workdir/rollback-state.sql" > /dev/null

      - name: Verify source and local contracts
        run: npm run verify && npm run test:db

      - name: Build release assets and record hashes
        if: ${{ inputs.operation != 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/release-version.txt
          npm run release:manifest

      - name: Capture deployment before operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo '::error::Cloudflare credential is not configured for this environment'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::Cloudflare account binding is not configured for this environment'; exit 1; }
          mkdir -p artifacts
          export DEPLOYMENT_STATUS_FILE
          DEPLOYMENT_STATUS_FILE=$(mktemp "$RUNNER_TEMP/vmate-deployment-before-XXXXXX.json")
          trap 'rm -f -- "$DEPLOYMENT_STATUS_FILE"' EXIT
          args=(--env "")
          if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          npx --no-install wrangler deployments status "${args[@]}" --name "$WORKER_NAME" --json > "$DEPLOYMENT_STATUS_FILE"
          previous_stable_version_id=$(node <<'NODE'
          const source = JSON.parse(require('node:fs').readFileSync(process.env.DEPLOYMENT_STATUS_FILE, 'utf8'));
          const candidates = [];
          const visit = (value) => {
            if (Array.isArray(value)) return value.forEach(visit);
            if (!value || typeof value !== 'object') return;
            if (typeof value.version_id === 'string' && Number(value.percentage) === 100) candidates.push(value.version_id);
            Object.values(value).forEach(visit);
          };
          visit(source);
          const unique = [...new Set(candidates)];
          if (unique.length !== 1) process.exit(1);
          process.stdout.write(unique[0]);
          NODE
          )
          [[ "$previous_stable_version_id" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::Could not determine the exact current stable Worker version'; exit 1; }
          if [[ "${DATABASE_EVIDENCE_MODE:-}" == 'baseline' ]]; then
            [[ "$BASELINE_SERVING_VERSION_ID" =~ ^[A-Za-z0-9_-]+$ && "$previous_stable_version_id" == "$BASELINE_SERVING_VERSION_ID" ]] || { echo '::error::serving Worker changed after the baseline attestation'; exit 1; }
          fi
          echo "PREVIOUS_STABLE_VERSION_ID=$previous_stable_version_id" >> "$GITHUB_ENV"

      - name: Apply production Custom Domain trigger before shadow upload
        if: ${{ inputs.target == 'production' && inputs.operation == 'shadow' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$WRANGLER_ENV" ]] || { echo '::error::production Custom Domain trigger must use the top-level Wrangler target'; exit 1; }
          npx --no-install wrangler triggers deploy --env "" --name "$WORKER_NAME" --dry-run
          npx --no-install wrangler triggers deploy --env "" --name "$WORKER_NAME"

      - name: Upload and register a zero-traffic Worker version
        id: shadow
        if: ${{ inputs.operation == 'shadow' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--env "")
          if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          stable_version_id="$PREVIOUS_STABLE_VERSION_ID"
          [[ -n "$stable_version_id" ]] || { echo '::error::Could not determine the current stable Worker version'; exit 1; }
          export WRANGLER_OUTPUT_FILE_PATH
          WRANGLER_OUTPUT_FILE_PATH=$(mktemp "$RUNNER_TEMP/vmate-wrangler-output-XXXXXX.jsonl")
          trap 'rm -f -- "$WRANGLER_OUTPUT_FILE_PATH"' EXIT
          version_tag="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_allowed_origins="$APPROVED_ORIGIN"
          if [[ '${{ inputs.target }}' == 'production' ]]; then
            release_allowed_origins="$APPROVED_ORIGIN,$LEGACY_ORIGIN"
          fi
          npx --no-install wrangler versions upload "${args[@]}" --name "$WORKER_NAME" --tag "$version_tag" --message "$GITHUB_SHA" --var "ALLOWED_ORIGINS:$release_allowed_origins"
          version_id=$(node - "$version_tag" <<'NODE'
          const fs = require('node:fs');
          const expectedTag = process.argv[2];
          const entries = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const matches = entries.filter((entry) => entry.type === 'version-upload' && entry.version_id && (!entry.version_tag || entry.version_tag === expectedTag));
          if (matches.length !== 1) process.exit(1);
          process.stdout.write(matches[0].version_id);
          NODE
          )
          [[ -n "$version_id" ]] || { echo '::error::Could not determine the exact uploaded Worker version'; exit 1; }
          version_metadata_file="$RUNNER_TEMP/vmate-shadow-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          npx --no-install wrangler versions view "$version_id" "${args[@]}" --name "$WORKER_NAME" --json > "$version_metadata_file"
          node - "$version_metadata_file" "$version_id" "$version_tag" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const [metadataPath, versionId, versionTag] = process.argv.slice(2);
          const canonicalize = (value) => Array.isArray(value)
            ? value.map(canonicalize)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]))
              : value;
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          const createdAt = metadata.metadata?.created_on;
          const valid = metadata.id === versionId
            && metadata.annotations?.['workers/tag'] === versionTag
            && metadata.annotations?.['workers/message'] === process.env.GITHUB_SHA
            && Number.isFinite(Date.parse(createdAt || ''));
          if (!valid) process.exit(1);
          const metadataHash = crypto.createHash('sha256').update(JSON.stringify(canonicalize(metadata))).digest('hex');
          fs.appendFileSync(process.env.GITHUB_ENV, `VERSION_TAG=${versionTag}\nVERSION_MESSAGE=${process.env.GITHUB_SHA}\nVERSION_CREATED_AT=${createdAt}\nVERSION_METADATA_HASH=${metadataHash}\n`);
          NODE
          rm -f -- "$version_metadata_file"
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$stable_version_id@100%" "$version_id@0%" --dry-run --yes
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$stable_version_id@100%" "$version_id@0%" --yes
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "stable_version_id=$stable_version_id" >> "$GITHUB_OUTPUT"

      - name: Preflight evidence-bound rollback version with zero-traffic override
        if: ${{ inputs.operation == 'rollback' && inputs.rollback_mode == 'post-lockdown' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-release.mjs \
            --base-url "$BASE_URL" \
            --worker-name "$WORKER_NAME" \
            --version-id "$INPUT_VERSION_ID" | tee artifacts/rollback-preflight-smoke.log

      - name: Cut over atomically to selected version
        if: ${{ inputs.operation == 'cutover' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--env ""); if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          echo "CUTOVER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$INPUT_VERSION_ID@100%" --dry-run --yes
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$INPUT_VERSION_ID@100%" --yes

      - name: Roll back atomically to selected compatible version
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--env ""); if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$INPUT_VERSION_ID@100%" --dry-run --yes
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$INPUT_VERSION_ID@100%" --yes

      - name: Capture and verify deployment after operation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHADOW_VERSION_ID: ${{ steps.shadow.outputs.version_id }}
          STABLE_VERSION_ID: ${{ steps.shadow.outputs.stable_version_id }}
        run: |
          set -euo pipefail
          export DEPLOYMENT_STATUS_FILE
          DEPLOYMENT_STATUS_FILE=$(mktemp "$RUNNER_TEMP/vmate-deployment-after-XXXXXX.json")
          trap 'rm -f -- "$DEPLOYMENT_STATUS_FILE"' EXIT
          args=(--env ""); if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          npx --no-install wrangler deployments status "${args[@]}" --name "$WORKER_NAME" --json > "$DEPLOYMENT_STATUS_FILE"
          node <<'NODE'
          const source = JSON.parse(require('node:fs').readFileSync(process.env.DEPLOYMENT_STATUS_FILE, 'utf8'));
          if (!source || typeof source !== 'object' || Array.isArray(source)
            || !Array.isArray(source.versions) || source.versions.length === 0) process.exit(1);
          const entries = source.versions.map((entry) => {
            if (!entry || typeof entry !== 'object' || Array.isArray(entry)
              || typeof entry.version_id !== 'string' || !/^[A-Za-z0-9_-]+$/.test(entry.version_id)
              || typeof entry.percentage !== 'number' || !Number.isFinite(entry.percentage)
              || entry.percentage < 0 || entry.percentage > 100) process.exit(1);
            return { id: entry.version_id, percentage: entry.percentage };
          });
          const ids = new Set(entries.map((entry) => entry.id));
          const total = entries.reduce((sum, entry) => sum + entry.percentage, 0);
          if (ids.size !== entries.length || Math.abs(total - 100) > 1e-9) process.exit(1);
          const operation = '${{ inputs.operation }}';
          if (operation === 'shadow') {
            const stable = entries.find((entry) => entry.id === process.env.STABLE_VERSION_ID);
            const shadow = entries.find((entry) => entry.id === process.env.SHADOW_VERSION_ID);
            if (entries.length !== 2 || stable?.percentage !== 100 || shadow?.percentage !== 0) process.exit(1);
          }
          if (operation === 'cutover' || operation === 'rollback') {
            if (entries.length !== 1 || entries[0].id !== process.env.INPUT_VERSION_ID || entries[0].percentage !== 100) process.exit(1);
          }
          NODE

      - name: Smoke selected Worker version and applicable assets
        shell: bash
        env:
          SHADOW_VERSION_ID: ${{ steps.shadow.outputs.version_id }}
        run: |
          set -euo pipefail
          version_id="$INPUT_VERSION_ID"
          if [[ '${{ inputs.operation }}' == 'shadow' ]]; then version_id="$SHADOW_VERSION_ID"; fi
          if [[ '${{ inputs.operation }}' == 'rollback' ]]; then
            node scripts/smoke-release.mjs --base-url "$BASE_URL" --worker-name "$WORKER_NAME" --version-id "$version_id" | tee artifacts/smoke.log
          else
            node scripts/smoke-release.mjs --base-url "$BASE_URL" --worker-name "$WORKER_NAME" --version-id "$version_id" --dist-manifest artifacts/dist-manifest.json | tee artifacts/smoke.log
          fi

      - name: Smoke preserved legacy Workers.dev hostname
        if: ${{ inputs.target == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not override the version or compare the new manifest here: this URL must prove the live legacy hostname remains reachable during shadow releases too.
          node scripts/smoke-release.mjs --base-url "$LEGACY_ORIGIN" | tee artifacts/legacy-smoke.log

      - name: Verify live cutover once at public origin
        if: ${{ inputs.operation == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-release.mjs \
            --base-url "$BASE_URL" \
            --dist-manifest artifacts/dist-manifest.json \
            --live-propagation true \
            --propagation-timeout-ms 20000 | tee artifacts/live-cutover-smoke.log

      - name: Verify live rollback once at public origin
        if: ${{ inputs.operation == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-release.mjs \
            --base-url "$BASE_URL" | tee artifacts/live-rollback-smoke.log

      - name: Record machine-readable release evidence
        shell: bash
        env:
          SHADOW_VERSION_ID: ${{ steps.shadow.outputs.version_id }}
          STABLE_VERSION_ID: ${{ steps.shadow.outputs.stable_version_id }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const operation = '${{ inputs.operation }}';
          const versionId = operation === 'shadow' ? process.env.SHADOW_VERSION_ID : process.env.INPUT_VERSION_ID;
          const previousStableVersionId = process.env.PREVIOUS_STABLE_VERSION_ID || process.env.STABLE_VERSION_ID || null;
          const baselineServingVersionId = operation === 'rollback' || process.env.DATABASE_EVIDENCE_MODE !== 'baseline'
            ? null
            : process.env.BASELINE_SERVING_VERSION_ID || null;
          const observability = null;
          const evidence = {
            schemaVersion: 4,
            target: '${{ inputs.target }}',
            operation,
            commit: process.env.GITHUB_SHA,
            workerName: process.env.WORKER_NAME,
            baseUrl: new URL(process.env.BASE_URL).origin,
            versionId,
            shadowEvidenceRunId: operation === 'shadow'
              ? process.env.GITHUB_RUN_ID
              : operation === 'smoke' || operation === 'cutover'
                ? process.env.SHADOW_EVIDENCE_RUN_ID
                : null,
            shadowRunAttempt: operation === 'shadow'
              ? Number(process.env.GITHUB_RUN_ATTEMPT)
              : operation === 'smoke' || operation === 'cutover'
                ? Number(process.env.VERIFIED_SHADOW_RUN_ATTEMPT)
                : null,
            versionTag: operation === 'rollback' ? null : process.env.VERSION_TAG || null,
            versionMessage: operation === 'rollback' ? null : process.env.VERSION_MESSAGE || null,
            versionCreatedAt: operation === 'rollback' ? null : process.env.VERSION_CREATED_AT || null,
            versionMetadataHash: operation === 'rollback' ? null : process.env.VERSION_METADATA_HASH || null,
            projectRefHash: crypto.createHash('sha256').update(process.env.EXPECTED_SUPABASE_PROJECT_REF).digest('hex'),
            databaseEvidenceMode: operation === 'rollback' ? null : process.env.DATABASE_EVIDENCE_MODE || null,
            databaseReleaseTrack: process.env.DATABASE_RELEASE_TRACK,
            baselineEvidenceRunId: operation === 'rollback' ? null : (/^[0-9]+$/.test(String(process.env.BASELINE_EVIDENCE_RUN_ID || '')) ? process.env.BASELINE_EVIDENCE_RUN_ID : null),
            baselineServingVersionId,
            v2Compatible: operation === 'cutover' && (process.env.DATABASE_EVIDENCE_MODE === 'expand' || process.env.DATABASE_EVIDENCE_MODE === 'baseline'),
            expandEvidenceRunId: operation === 'rollback' ? null : process.env.EXPAND_EVIDENCE_RUN_ID,
            expandEvidenceCommit: operation === 'rollback' ? null : process.env.EXPAND_EVIDENCE_COMMIT || null,
            expandBridgePrelaunchEvidenceRunId: operation === 'rollback'
              ? null
              : (/^[0-9]+$/.test(String(process.env.EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID || '')) ? process.env.EXPAND_BRIDGE_PRELAUNCH_EVIDENCE_RUN_ID : null),
            expandProjectRefHash: operation === 'rollback' ? null : process.env.EXPAND_PROJECT_REF_HASH,
            expandAppliedAt: operation === 'rollback' ? null : process.env.EXPAND_APPLIED_AT,
            expandMigration: operation === 'rollback' ? null : process.env.EXPAND_MIGRATION || null,
            previousStableVersionId,
            rollbackMode: operation === 'rollback' ? process.env.ROLLBACK_MODE : null,
            rollbackEvidenceRunId: operation === 'rollback' ? process.env.ROLLBACK_SOURCE_EVIDENCE_RUN_ID : null,
            rollbackSourceVersionId: operation === 'rollback' ? process.env.ROLLBACK_SOURCE_VERSION_ID : null,
            lockdownEvidenceRunId: operation === 'rollback' && process.env.ROLLBACK_MODE === 'post-lockdown' ? process.env.LOCKDOWN_EVIDENCE_RUN_ID : null,
            completedAt: new Date().toISOString(),
            smokePassed: true,
            monitorChecks: operation === 'cutover' ? 1 : 0,
            monitorMinutes: 0,
            observabilityPassed: observability?.passed ?? null,
            observabilityMetrics: observability?.metrics || null,
            observabilityWindow: observability?.window || null,
            baselineWindow: observability?.baselineWindow || null,
          };
          if (operation !== 'rollback') {
            const immutableVersionBound = /^[0-9]+$/.test(String(evidence.shadowEvidenceRunId || ''))
              && Number.isInteger(evidence.shadowRunAttempt)
              && evidence.shadowRunAttempt >= 1
              && evidence.versionTag === `github-${evidence.shadowEvidenceRunId}-${evidence.shadowRunAttempt}`
              && evidence.versionMessage === process.env.GITHUB_SHA
              && Number.isFinite(Date.parse(evidence.versionCreatedAt || ''))
              && /^[a-f0-9]{64}$/.test(String(evidence.versionMetadataHash || ''));
            if (!immutableVersionBound) throw new Error('Immutable Worker version evidence is incomplete.');
            if (evidence.databaseEvidenceMode === 'baseline'
              && (!/^[A-Za-z0-9_-]+$/.test(String(evidence.baselineServingVersionId || ''))
                || evidence.previousStableVersionId !== evidence.baselineServingVersionId)) {
              throw new Error('Baseline release is not anchored to the attested serving Worker version.');
            }
          }
          fs.writeFileSync('artifacts/release-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Restore the previous stable version after a failed cutover gate
        if: ${{ failure() && inputs.operation == 'cutover' && env.CUTOVER_STARTED_AT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_STABLE_VERSION_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::Previous stable version is unavailable; automatic rollback is unsafe'; exit 1; }
          args=(--env ""); if [[ -n "$WRANGLER_ENV" ]]; then args=(--env "$WRANGLER_ENV"); fi
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$PREVIOUS_STABLE_VERSION_ID@100%" --dry-run --yes
          npx --no-install wrangler versions deploy "${args[@]}" --name "$WORKER_NAME" "$PREVIOUS_STABLE_VERSION_ID@100%" --yes
          export AUTO_ROLLBACK_STATUS_FILE
          AUTO_ROLLBACK_STATUS_FILE=$(mktemp "$RUNNER_TEMP/vmate-auto-rollback-status-XXXXXX.json")
          trap 'rm -f -- "$AUTO_ROLLBACK_STATUS_FILE"' EXIT
          npx --no-install wrangler deployments status "${args[@]}" --name "$WORKER_NAME" --json > "$AUTO_ROLLBACK_STATUS_FILE"
          node <<'NODE'
          const source = JSON.parse(require('node:fs').readFileSync(process.env.AUTO_ROLLBACK_STATUS_FILE, 'utf8'));
          if (!source || typeof source !== 'object' || Array.isArray(source)
            || !Array.isArray(source.versions) || source.versions.length !== 1) process.exit(1);
          const [entry] = source.versions;
          if (!entry || typeof entry !== 'object' || Array.isArray(entry)
            || entry.version_id !== process.env.PREVIOUS_STABLE_VERSION_ID
            || entry.percentage !== 100) process.exit(1);
          NODE
          node scripts/smoke-release.mjs --base-url "$BASE_URL" | tee artifacts/automatic-rollback-smoke.log
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/automatic-rollback.json', `${JSON.stringify({
            schemaVersion: 1,
            restoredVersionId: process.env.PREVIOUS_STABLE_VERSION_ID,
            failedVersionId: process.env.INPUT_VERSION_ID,
            completedAt: new Date().toISOString(),
          }, null, 2)}\n`);
          NODE

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: release-evidence-${{ inputs.target }}-${{ github.run_id }}
          path: |
            artifacts/release-evidence.json
            artifacts/automatic-rollback.json
          if-no-files-found: warn
